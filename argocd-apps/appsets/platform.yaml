# Platform ApplicationSet: one Application per app file, per cluster Argo CD knows.
# Plain Argo CD, nothing substituted: the env comes from the cluster Secret's `env` label
# (manifests/argocd-clusters/), the app list from argocd-apps/envs/<env>/apps/*.yaml.
# Matrix param precedence is first child wins: the cluster comes first (name, server,
# metadata.labels.*), the app file second (.path, chart, repoURL, version, namespace, wave).
#
# App file (envs/<env>/apps/<app>.yaml):   chart, repoURL, version, namespace, wave
#   disable without deleting:              enabled: false   (+ a comment saying why)
# Chart values stay in platform-apps/<app>/<env>/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-onboarding
  namespace: argocd
spec:
  # Migration step: this set is about to be replaced by a renamed one (cluster-generator routing).
  # With this flag its Applications carry no finalizer, so pruning the set leaves the cluster
  # resources in place for the successor to adopt. The successor does not carry the flag.
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: env
                    operator: Exists
          - git:
              repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
              revision: HEAD
              files:
                - path: argocd-apps/envs/{{ .metadata.labels.env }}/apps/*.yaml
            selector:
              matchExpressions:
                - key: enabled
                  operator: NotIn
                  values: ["false"]
  template:
    metadata:
      name: '{{ .metadata.labels.env }}-{{ .path.filename | trimSuffix ".yaml" }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ .wave }}'
    spec:
      project: platform
      sources:
        - chart: '{{ .chart }}'
          repoURL: '{{ .repoURL }}'
          targetRevision: '{{ .version }}'
          helm:
            valueFiles:
              - $values/platform-apps/{{ .path.filename | trimSuffix ".yaml" }}/{{ .metadata.labels.env }}/values.yaml
        - repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
          targetRevision: HEAD
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      # Fields set by the API server or cert controllers, not by charts:
      # without this they diff forever and self-heal re-applies every reconcile.
      ignoreDifferences:
        - group: '*'
          kind: '*'
          jqPathExpressions:
            - '.spec.template.spec.containers[]?.resources | select(. == {})'
            - '.spec.template.spec.initContainers[]?.resources | select(. == {})'
            - '.webhooks[]?.clientConfig.caBundle'
        # Some charts omit Gateway API defaults the API server fills in; drop a
        # field only when it holds its default so real changes still diff.
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - '.spec.parentRefs[]? | select(.group == "gateway.networking.k8s.io") | .group'
            - '.spec.parentRefs[]? | select(.kind == "Gateway") | .kind'
            - '.spec.rules[]?.backendRefs[]? | select(.group == "") | .group'
            - '.spec.rules[]?.backendRefs[]? | select(.kind == "Service") | .kind'
            - '.spec.rules[]?.backendRefs[]? | select(.weight == 1) | .weight'
            - '.spec.rules[]? | select(.matches == [{"path":{"type":"PathPrefix","value":"/"}}]) | .matches'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
  # Booleans cannot be templated inside `template` (every templated field is a string);
  # templatePatch is rendered as YAML, so prune keeps its type.
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          prune: {{ .metadata.labels.prune }}
