# Platform catalogue: the single pane for every platform (Helm chart) app.
# The app-of-apps chart turns this into the platform ApplicationSet: one Application per app and env
# where the env is listed with enabled: true. Chart values stay in platform-apps/<app>/<env>/values.yaml.
# Keys: chart, repo, namespace, wave (Argo sync wave); envs.<env>: {version, enabled}; overrides.<env>
# may replace chart/repo/namespace/wave for one env.
platform:
  alloy:
    chart: alloy
    repo: https://grafana.github.io/helm-charts
    namespace: monitoring
    wave: 0
    envs:
      local: {version: "1.9.0", enabled: false}
  argo-rollouts:
    chart: argo-rollouts
    repo: https://argoproj.github.io/argo-helm
    namespace: argo-rollouts
    wave: 1
    envs:
      local: {version: "2.43.8", enabled: true}
  authentik:
    chart: authentik
    repo: https://charts.goauthentik.io
    namespace: authentik
    wave: 3
    envs:
      local: {version: "2026.8.5", enabled: true}
  cert-manager:
    chart: cert-manager
    repo: https://charts.jetstack.io
    namespace: cert-manager
    wave: -2
    envs:
      local: {version: "v1.17.4", enabled: false}
  cilium:
    chart: cilium
    repo: https://helm.cilium.io/
    namespace: kube-system
    wave: -3
    envs:
      local: {version: "1.19.10", enabled: false}
  cloudnative-pg:
