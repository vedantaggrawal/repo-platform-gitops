# Platform apps for this env: one entry per upstream Helm chart app (argocd-apps renders an Application
# per enabled entry; chart values stay in platform-apps/<app>/<env>/values.yaml). Keys: chart, repoURL,
# version (exact; Kargo promotes it, humans never edit it in stg/prod), namespace, wave, enabled.
# `constraint` (first stage only) is the semver range the Kargo Warehouse watches for new versions.

metrics-server:
  chart: metrics-server
  repoURL: https://kubernetes-sigs.github.io/metrics-server/
  version: "3.11.0"
  namespace: kube-system
  wave: -2
  enabled: false
