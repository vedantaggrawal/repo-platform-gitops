# dev: every platform app of this env, one entry per upstream Helm chart app. The platform
# ApplicationSet (argocd-apps/appsets/platform.yaml) fans this file out: one Application per entry.
# Keys per app:
#   chart, repoURL   the upstream chart            namespace, wave   where and in which order
#   version          exact chart version           valuesRef         git revision of platform-apps/<app>/dev/values.yaml
#   enabled: false   keep the entry, deploy nothing (say why)
# version and valuesRef move together: Kargo promotes both (freight = chart version + values commit) and
# writes them here; a human edits them only in the first stage, where valuesRef may be HEAD.
env: dev
apps:
  metrics-server:
    chart: metrics-server
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    version: "3.11.0"
    valuesRef: ea5bfb57b2e7168ec64b3e4daf8cef7d31d7a13b
    namespace: kube-system
    wave: -2
    enabled: false
