# Cluster identity and env knobs for the local kind cluster (control plane: hosts Argo CD and Kargo).
env: local
# This cluster exists: the ApplicationSet renders its apps.yaml. Hosts Argo CD (control plane).
active: true
controlPlane: true
server: https://kubernetes.default.svc
prune: true
# Raw manifests (manifests/<name>/local, network-policies/local) exist for this env: render the app-*.yaml apps.
rawManifests: true
# Kargo: this env takes freight straight from the Warehouses (first stage); others name their upstream stage.
promotion:
  upstream: null
