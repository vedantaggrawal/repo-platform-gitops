# prod: every platform app of this env, one entry per upstream Helm chart app. The platform
# ApplicationSet (argocd-apps/appsets/platform.yaml) fans this file out: one Application per entry.
# Keys per app:
#   chart, repoURL   the upstream chart            namespace, wave   where and in which order
#   version          exact chart version (Kargo writes it; a human edits it only in the first stage)
#   enabled: false   keep the entry, deploy nothing (say why)
# Config is promoted by copy: Kargo writes platform-apps/<app>/prod/values.yaml from the first stage's file at
# the freight's commit (freight = chart version + values commit). Humans edit values only in the first stage.
env: prod
apps:
  kube-prometheus-stack:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    version: "51.10.0"
    namespace: monitoring
    wave: -1
    enabled: true

  metrics-server:
    chart: metrics-server
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    version: "3.11.0"
    namespace: kube-system
    wave: -2
    enabled: true
