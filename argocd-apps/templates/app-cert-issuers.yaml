{{- if has .Values.env .Values.rawManifestEnvs }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-cert-issuers
  namespace: argocd
  annotations:
    # Platform CA issuer; cert-manager itself is installed by repo-platform Terraform.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/cert-issuers/{{ .Values.env }}
    directory:
      recurse: true
  destination:
    server: {{ .Values.cluster }}
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: {{ .Values.prune }}
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
