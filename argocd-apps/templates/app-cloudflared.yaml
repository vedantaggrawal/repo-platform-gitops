{{- if has .Values.env .Values.rawManifestEnvs }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-cloudflared
  namespace: argocd
  labels:
    eve.io/layer: networking
  annotations:
    # Cloudflare Tunnel connector (manifests/cloudflared). Token from OpenBao via ESO.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/cloudflared/{{ .Values.env }}
  destination:
    server: {{ .Values.cluster }}
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: {{ .Values.prune }}
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
