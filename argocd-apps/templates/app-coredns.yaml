{{- if has .Values.env .Values.rawManifestEnvs }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-coredns
  namespace: argocd
  annotations:
    # After keycloak-issuer (2): the rewrite target is that Service.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/coredns/{{ .Values.env }}
    directory:
      recurse: true
  destination:
    server: {{ .Values.cluster }}
    namespace: kube-system
  syncPolicy:
    automated:
      # Never prune: the coredns ConfigMap is cluster DNS. It is also annotated
      # Delete=false so removing this app leaves the last-applied Corefile.
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
