{{- $cluster := .Files.Get (printf "envs/%s/cluster.yaml" .Values.env) | fromYaml -}}
{{- if $cluster.rawManifests }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-demo-api
  namespace: argocd
  annotations:
    # Demo API route and JWT policy. After the Gateway (wave 2); namespace
    # kargo-demo-test is created by Kargo.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/demo-api/{{ .Values.env }}
  destination:
    server: {{ $cluster.server }}
    namespace: kargo-demo-test
  syncPolicy:
    automated:
      prune: {{ $cluster.prune }}
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
