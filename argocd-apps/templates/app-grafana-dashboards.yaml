{{- $cluster := .Files.Get (printf "envs/%s/cluster.yaml" .Values.env) | fromYaml -}}
{{- if $cluster.rawManifests }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-grafana-dashboards
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/grafana-dashboards/{{ .Values.env }}
    directory:
      recurse: true
  destination:
    server: {{ $cluster.server }}
    namespace: monitoring
  syncPolicy:
    automated:
      prune: {{ $cluster.prune }}
      selfHeal: true
      # The path holds only a README now: let Argo prune the ConfigMaps it still tracks.
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
