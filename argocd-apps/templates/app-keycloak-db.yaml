{{- if has .Values.env .Values.rawManifestEnvs }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-keycloak-db
  namespace: argocd
  annotations:
    # Keycloak's database. The keycloak app comes from the platform ApplicationSet,
    # so waves don't order the two; Keycloak's dbchecker init container waits for
    # this database instead.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/keycloak-db/{{ .Values.env }}
    directory:
      recurse: true
  destination:
    server: {{ .Values.cluster }}
    namespace: keycloak
  # CNPG's webhook fills in defaults for these Cluster fields; without this they
  # show as drift and selfHeal re-syncs forever. Fields we declare are still compared.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .spec.affinity
        - .spec.bootstrap.initdb.encoding
        - .spec.bootstrap.initdb.localeCType
        - .spec.bootstrap.initdb.localeCollate
        - .spec.enablePDB
        - .spec.enableSuperuserAccess
        - .spec.failoverDelay
        - .spec.logLevel
        - .spec.maxSyncReplicas
        - .spec.minSyncReplicas
        - .spec.monitoring
        - .spec.postgresGID
        - .spec.postgresUID
        - .spec.postgresql
        - .spec.primaryUpdateMethod
        - .spec.primaryUpdateStrategy
        - .spec.probes
        - .spec.replicationSlots
        - .spec.smartShutdownTimeout
        - .spec.startDelay
        - .spec.stopDelay
        - .spec.storage.resizeInUseVolumes
        - .spec.switchoverDelay
  syncPolicy:
    automated:
      prune: {{ .Values.prune }}
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # No ServerSideApply here: Argo CD 2.10.2 can't resolve the CNPG Cluster
      # schema, and both structured-merge and server-side diff then panic (nil
      # pointer) on every compare. The plain three-way diff works.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
