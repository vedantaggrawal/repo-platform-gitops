{{- if has .Values.env .Values.rawManifestEnvs }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-keycloak-secrets
  namespace: argocd
  annotations:
    # Secrets of the Codaxy realm only; platform SSO secrets are in the
    # platform-sso chart. Retry below covers ESO's CRDs not being there yet.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/keycloak-secrets/{{ .Values.env }}
    directory:
      recurse: true
  destination:
    server: {{ .Values.cluster }}
    namespace: keycloak
  syncPolicy:
    automated:
      prune: {{ .Values.prune }}
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs come from the external-secrets app.
      - SkipDryRunOnMissingResource=true
      # No ServerSideApply here: Argo CD 2.10.2 can't resolve the ESO schemas, and
      # both structured-merge and server-side diff then panic (nil pointer) on
      # every compare. The plain three-way diff works.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
