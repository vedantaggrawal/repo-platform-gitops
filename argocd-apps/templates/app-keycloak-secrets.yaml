{{- if has .Values.env .Values.rawManifestEnvs }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-keycloak-secrets
  namespace: argocd
  annotations:
    # After external-secrets (-1), before keycloak-config-cli (3). Its own app on
    # purpose: an ExternalSecret whose OpenBao path isn't written yet is Degraded,
    # and inside the config-cli app that would block its PostSync import Job.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/keycloak-secrets/{{ .Values.env }}
    directory:
      recurse: true
  destination:
    server: {{ .Values.cluster }}
    namespace: keycloak
  syncPolicy:
    automated:
      prune: {{ .Values.prune }}
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The CRDs come from the external-secrets app.
      - SkipDryRunOnMissingResource=true
{{- end }}
