{{- if has .Values.env .Values.rawManifestEnvs }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-librechat-data
  namespace: argocd
  labels:
    eve.io/layer: addons
  annotations:
    # LibreChat data and secrets (manifests/librechat): MongoDB and generated app secrets. Not server-side apply (ESO objects).
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/librechat/{{ .Values.env }}
  destination:
    server: {{ .Values.cluster }}
    namespace: librechat
  syncPolicy:
    automated:
      prune: {{ .Values.prune }}
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
