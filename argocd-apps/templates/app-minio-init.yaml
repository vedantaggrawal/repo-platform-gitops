{{- if has .Values.env .Values.rawManifestEnvs }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-minio-init
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/minio-init/{{ .Values.env }}
    directory:
      recurse: true
  destination:
    server: {{ .Values.cluster }}
    namespace: monitoring-storage
  syncPolicy:
    automated:
      prune: {{ .Values.prune }}
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # No ServerSideApply: Argo CD 2.10.2's server-side diff panics on the
      # External Secrets resources here (same as keycloak-db).
    # External Secrets resources stay Degraded while ESO or OpenBao isn't ready
    # (fresh cluster, or other apps still syncing). Argo doesn't auto-retry a
    # failed revision, and the PostSync Job only runs on success: retry long.
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
{{- end }}
