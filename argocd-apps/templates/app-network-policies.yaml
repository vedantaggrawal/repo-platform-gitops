{{- $cluster := .Files.Get (printf "envs/%s/cluster.yaml" .Values.env) | fromYaml -}}
{{- if $cluster.rawManifests }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: network-policies/{{ .Values.env }}
    directory:
      recurse: true
  destination:
    server: {{ $cluster.server }}
    namespace: default
  syncPolicy:
    automated:
      prune: {{ $cluster.prune }}
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
