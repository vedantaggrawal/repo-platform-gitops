{{- if has .Values.env .Values.rawManifestEnvs }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-opencode
  namespace: argocd
  labels:
    eve.io/layer: networking
  annotations:
    # OpenCode harness (manifests/opencode): in-cluster coding agent on Ollama, web UI behind Authentik.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/opencode/{{ .Values.env }}
  destination:
    server: {{ .Values.cluster }}
    namespace: opencode
  syncPolicy:
    automated:
      prune: {{ .Values.prune }}
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
