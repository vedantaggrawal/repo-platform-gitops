{{- $cluster := .Files.Get (printf "envs/%s/cluster.yaml" .Values.env) | fromYaml -}}
{{- if $cluster.rawManifests }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.env }}-secret-stores
  namespace: argocd
  annotations:
    # The external-secrets app (CRDs) comes from the platform ApplicationSet, so
    # waves don't order the two; retry covers a first sync before the CRDs exist.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
    targetRevision: HEAD
    path: manifests/secret-stores/{{ .Values.env }}
    directory:
      recurse: true
  destination:
    server: {{ $cluster.server }}
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: {{ $cluster.prune }}
      selfHeal: true
    syncOptions:
      # No ServerSideApply here: Argo CD 2.10.2 can't resolve the ESO CRD
      # schemas, and the structured-merge diff then panics (nil pointer) on
      # every compare. Keep ESO custom resources out of SSA apps.
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
{{- end }}
