{{- /*
Platform ApplicationSet for one env, from argocd-apps/envs/<env>/apps.yaml (what runs there, at which chart
version) and envs/<env>/cluster.yaml (where). One Application per enabled entry; chart values stay in
platform-apps/<app>/<env>/values.yaml. The element set is rendered here, so `helm template` shows exactly
which Applications an env has, and Kargo promotes a version by editing one key in that env's apps.yaml.
*/ -}}
{{- $env := .Values.env -}}
{{- $cluster := .Files.Get (printf "envs/%s/cluster.yaml" $env) | fromYaml -}}
{{- $apps := .Files.Get (printf "envs/%s/apps.yaml" $env) | fromYaml -}}
{{- $elements := list -}}
{{- range $name, $a := $apps -}}
  {{- if $a.enabled -}}
    {{- $elements = append $elements (dict
          "name" $name
          "chart" $a.chart
          "repoURL" $a.repoURL
          "targetRevision" (toString $a.version)
          "namespace" $a.namespace
          "syncWave" (toString ($a.wave | default 0))) -}}
  {{- end -}}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.env }}-platform-onboarding
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          {{- toYaml $elements | nindent 10 }}
  template:
    metadata:
      name: '{{ .Values.env }}-{{ "{{name}}" }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ "{{syncWave}}" }}'
    spec:
      project: platform
      sources:
        - chart: '{{ "{{chart}}" }}'
          repoURL: '{{ "{{repoURL}}" }}'
          targetRevision: '{{ "{{targetRevision}}" }}'
          helm:
            valueFiles:
              - $values/platform-apps/{{ "{{name}}" }}/{{ .Values.env }}/values.yaml
        - repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
          targetRevision: HEAD
          ref: values
      destination:
        server: {{ $cluster.server }}
        namespace: '{{ "{{namespace}}" }}'
      # Fields set by the API server or cert controllers, not by charts:
      # without this they diff forever and self-heal re-applies every reconcile.
      ignoreDifferences:
        - group: '*'
          kind: '*'
          jqPathExpressions:
            - '.spec.template.spec.containers[]?.resources | select(. == {})'
            - '.spec.template.spec.initContainers[]?.resources | select(. == {})'
            - '.webhooks[]?.clientConfig.caBundle'
        # Some charts omit Gateway API defaults the API server fills in; drop a
        # field only when it holds its default so real changes still diff.
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - '.spec.parentRefs[]? | select(.group == "gateway.networking.k8s.io") | .group'
            - '.spec.parentRefs[]? | select(.kind == "Gateway") | .kind'
            - '.spec.rules[]?.backendRefs[]? | select(.group == "") | .group'
            - '.spec.rules[]?.backendRefs[]? | select(.kind == "Service") | .kind'
            - '.spec.rules[]?.backendRefs[]? | select(.weight == 1) | .weight'
            - '.spec.rules[]? | select(.matches == [{"path":{"type":"PathPrefix","value":"/"}}]) | .matches'
      syncPolicy:
        automated:
          prune: {{ $cluster.prune }}
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
