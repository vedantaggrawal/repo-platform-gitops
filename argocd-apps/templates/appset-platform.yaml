{{- /*
Platform ApplicationSet from the catalogue (argocd-apps/catalog.yaml): one element per app whose
envs.<env> is enabled. Chart values stay in platform-apps/<app>/<env>/values.yaml. The element set is
rendered here, so `helm template` shows exactly which Applications exist for an env.
*/ -}}
{{- $env := .Values.env -}}
{{- $cat := .Files.Get "catalog.yaml" | fromYaml -}}
{{- $elements := list -}}
{{- range $name, $app := $cat.platform -}}
  {{- $e := index ($app.envs | default dict) $env -}}
  {{- if and $e $e.enabled -}}
    {{- $o := index ($app.overrides | default dict) $env | default dict -}}
    {{- $elements = append $elements (dict
          "name" $name
          "chart" ($o.chart | default $app.chart)
          "repoURL" ($o.repo | default $app.repo)
          "targetRevision" (toString $e.version)
          "namespace" ($o.namespace | default $app.namespace)
          "syncWave" (toString (hasKey $o "wave" | ternary $o.wave $app.wave))) -}}
  {{- end -}}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.env }}-platform-onboarding
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          {{- toYaml $elements | nindent 10 }}
  template:
    metadata:
      name: '{{ .Values.env }}-{{ "{{name}}" }}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ "{{syncWave}}" }}'
    spec:
      project: platform
      sources:
        - chart: '{{ "{{chart}}" }}'
          repoURL: '{{ "{{repoURL}}" }}'
          targetRevision: '{{ "{{targetRevision}}" }}'
          helm:
            valueFiles:
              - $values/platform-apps/{{ "{{name}}" }}/{{ .Values.env }}/values.yaml
        - repoURL: https://github.com/vedantaggrawal/repo-platform-gitops.git
          targetRevision: HEAD
          ref: values
      destination:
        server: {{ .Values.cluster }}
        namespace: '{{ "{{namespace}}" }}'
      # Fields set by the API server or cert controllers, not by charts:
      # without this they diff forever and self-heal re-applies every reconcile.
      ignoreDifferences:
        - group: '*'
          kind: '*'
          jqPathExpressions:
            - '.spec.template.spec.containers[]?.resources | select(. == {})'
            - '.spec.template.spec.initContainers[]?.resources | select(. == {})'
            - '.webhooks[]?.clientConfig.caBundle'
        # Some charts omit Gateway API defaults the API server fills in; drop a
        # field only when it holds its default so real changes still diff.
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - '.spec.parentRefs[]? | select(.group == "gateway.networking.k8s.io") | .group'
            - '.spec.parentRefs[]? | select(.kind == "Gateway") | .kind'
            - '.spec.rules[]?.backendRefs[]? | select(.group == "") | .group'
            - '.spec.rules[]?.backendRefs[]? | select(.kind == "Service") | .kind'
            - '.spec.rules[]?.backendRefs[]? | select(.weight == 1) | .weight'
            - '.spec.rules[]? | select(.matches == [{"path":{"type":"PathPrefix","value":"/"}}]) | .matches'
      syncPolicy:
        automated:
          prune: {{ .Values.prune }}
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
