global:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-keys
          key: secret_key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-app
          key: password
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-keys
          key: bootstrap_password
authentik:
  authentik:
    error_reporting:
      enabled: false
    postgresql:
      host: authentik-db-rw
      name: authentik
      user: authentik
      sslmode: require
  blueprints:
    configMaps:
      - authentik-blueprints
  worker:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 60s
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    volumes:
      - name: blueprint-github
        secret:
          secretName: authentik-blueprint-github
          optional: true
    volumeMounts:
      - name: blueprint-github
        mountPath: /blueprints/mounted/github
        readOnly: true
  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 60s
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    volumes:
      - name: branding
        configMap:
          name: authentik-branding
          optional: true
    volumeMounts:
      - name: branding
        mountPath: /web/dist/custom
        readOnly: true
    ingress:
      enabled: false
    route:
      main:
        enabled: true
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: Gateway
            name: platform
            namespace: envoy-gateway-system
            sectionName: https
        hostnames:
          - local.authentik.internal
        matches:
          - path:
              type: PathPrefix
              value: /
  postgresql:
    enabled: false
