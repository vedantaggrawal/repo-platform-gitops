{{- if eq .Values.component "secrets" }}
{{- range $alias, $_ := .Values.idps }}
{{- $env := upper $alias }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-{{ $alias }}-idp
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.secretStore }}
  target:
    name: keycloak-{{ $alias }}-idp
    creationPolicy: Owner
  data:
    {{- range $prop := list "client_id" "client_secret" }}
    - secretKey: {{ $env }}_{{ upper $prop }}
      remoteRef:
        key: platform/keycloak/idp/{{ $alias }}
        property: {{ $prop }}
    {{- end }}
{{- end }}
{{- end }}
