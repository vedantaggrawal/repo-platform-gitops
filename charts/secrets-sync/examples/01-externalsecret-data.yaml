# Pull two properties of one remote key into a Secret; one with a typed template.
global:
  namespace: monitoring
externalSecrets:
  - name: grafana-admin
    data:
      - secretKey: admin-user
        remoteRef: { key: platform/grafana/admin, property: username }
      - secretKey: admin-password
        remoteRef: { key: platform/grafana/admin, property: password }
  - name: grafana-db-app
    refreshInterval: 15m
    target:
      template:
        type: kubernetes.io/basic-auth
        metadata:
          labels: { cnpg.io/reload: "true" }
        data:
          username: grafana
          password: "{{ .password }}"
    data:
      - secretKey: password
        remoteRef: { key: platform/grafana/db, property: password }
