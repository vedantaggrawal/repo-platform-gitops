# Whole-key extract, regexp find across a path with key rewrite, a different store, and extraSpec.
externalSecrets:
  - name: authentik-keys
    namespace: authentik
    dataFrom:
      - extract: { key: platform/authentik/keys }
  - name: tenant-demo-oauth
    namespace: tenant-demo
    store: { kind: SecretStore, name: tenant-demo }
    refreshPolicy: OnChange
    target:
      creationPolicy: Merge
      deletionPolicy: Retain
    dataFrom:
      - find:
          path: tenant-demo/oauth
          name: { regexp: "^client_.*" }
        rewrite:
          - regexp: { source: "^client_(.*)$", target: "oauth_$1" }
    extraSpec:
      target:
        immutable: false
