# Push one key of an existing Secret (cert-manager's CA) into the store, overwriting on change,
# and push a whole Secret under one remote key to two stores.
pushSecrets:
  - name: platform-ca
    namespace: cert-manager
    secret: platform-ca
    updatePolicy: Replace
    data:
      - secretKey: ca.crt
        remoteKey: platform/ca
        property: ca.crt
  - name: registry-pull
    namespace: harbor
    secret: harbor-registry-credentials
    stores:
      - { kind: ClusterSecretStore, name: openbao }
      - { kind: SecretStore, name: tenant-demo }
    updatePolicy: IfNotExists
    deletionPolicy: Delete
    refreshInterval: 10m
    data:
      - remoteKey: platform/harbor/pull
        metadata:
          apiVersion: kubernetes.external-secrets.io/v1alpha1
          kind: PushSecretMetadata
          spec:
            sourceMergePolicy: Merge
