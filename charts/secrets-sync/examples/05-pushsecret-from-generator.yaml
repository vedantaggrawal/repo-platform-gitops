# Push straight from a generator (no intermediate Secret) with a template, and a raw ESO `match` item.
generators:
  - name: webhook-token
    kind: Password
    namespace: platform
    spec: { length: 40, digits: 10, symbols: 0, noUpper: true, allowRepeat: true }
pushSecrets:
  - name: webhook-token
    namespace: platform
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: webhook-token
    updatePolicy: IfNotExists
    template:
      engineVersion: v2
      data:
        token: "{{ .password }}"
    data:
      - match:
          secretKey: token
          remoteRef: { remoteKey: platform/webhooks/github, property: token }
