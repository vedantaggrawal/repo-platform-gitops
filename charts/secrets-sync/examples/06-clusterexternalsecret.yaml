# The same CA Secret in several namespaces, plus a label-selected fan-out.
clusterExternalSecrets:
  - name: platform-ca
    namespaces: [argocd, kargo]
    refreshTime: 1h
    externalSecret:
      data:
        - secretKey: ca.crt
          remoteRef: { key: platform/ca, property: ca.crt }
  - name: tenant-pull-secret
    namespaceSelectors:
      - matchLabels: { eve.io/tenant: "true" }
    externalSecret:
      name: registry-pull
      target:
        template:
          type: kubernetes.io/dockerconfigjson
          data:
            .dockerconfigjson: "{{ .dockerconfigjson }}"
      data:
        - secretKey: dockerconfigjson
          remoteRef: { key: platform/harbor/pull, property: dockerconfigjson }
