{{- range .Values.clusterExternalSecrets }}
{{- $es := required (printf "clusterExternalSecrets[%s].externalSecret is required" .name) .externalSecret }}
{{- if not (or .namespaces .namespaceSelectors) }}{{ fail (printf "clusterExternalSecrets[%s]: namespaces or namespaceSelectors is required" .name) }}{{ end }}
{{- $_ := set $es "name" ($es.name | default .name) }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  {{- include "secrets-sync.metadata" (dict "root" $ "item" . "class" "clusterExternalSecrets" "name" (required "clusterExternalSecrets[].name is required" .name) "cluster" true) | nindent 2 }}
spec:
  {{- with .namespaces }}
  namespaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .namespaceSelectors }}
  namespaceSelectors:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  refreshTime: {{ .refreshTime | default $.Values.global.refreshInterval }}
  externalSecretMetadata:
    labels:
      {{- include "secrets-sync.labels" (dict "root" $ "item" $es) | nindent 6 }}
  externalSecretSpec:
    {{- include "secrets-sync.externalSecretSpec" (dict "root" $ "item" $es) | nindent 4 }}
{{- end }}
