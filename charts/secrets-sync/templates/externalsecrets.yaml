{{- range .Values.externalSecrets }}
{{- if not (or .data .dataFrom) }}{{ fail (printf "externalSecrets[%s]: data or dataFrom is required" .name) }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- include "secrets-sync.metadata" (dict "root" $ "item" . "class" "externalSecrets" "name" (required "externalSecrets[].name is required" .name)) | nindent 2 }}
spec:
  {{- include "secrets-sync.externalSecretSpec" (dict "root" $ "item" .) | nindent 2 }}
{{- end }}
