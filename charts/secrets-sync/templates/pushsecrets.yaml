{{- range .Values.pushSecrets }}
{{- if and .secret .generatorRef }}{{ fail (printf "pushSecrets[%s]: set secret or generatorRef, not both" .name) }}{{ end }}
{{- if not .data }}{{ fail (printf "pushSecrets[%s]: data needs at least one remoteKey" .name) }}{{ end }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  {{- include "secrets-sync.metadata" (dict "root" $ "item" . "class" "pushSecrets" "name" (required "pushSecrets[].name is required" .name)) | nindent 2 }}
spec:
  {{- include "secrets-sync.pushSecretSpec" (dict "root" $ "item" .) | nindent 2 }}
{{- end }}
