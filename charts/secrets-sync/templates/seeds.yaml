{{- /*
Seed pattern, four resources per entry:
  1. generator (unless generatorRef points at an existing one)
  2. <name>-seed ExternalSecret: refreshPolicy CreatedOnce, one generator call per key, output renamed to the key
  3. <name> PushSecret: whole seed Secret → remoteKey, IfNotExists / None (never overwrites, never deletes)
  4. one ExternalSecret per consumer, reading the keys back from the store
*/ -}}
{{- range .Values.seeds }}
{{- $seed := . }}
{{- $name := required "seeds[].name is required" .name }}
{{- $remoteKey := required (printf "seeds[%s].remoteKey is required" $name) .remoteKey }}
{{- $keys := required (printf "seeds[%s].keys is required" $name) .keys }}
{{- if and .generator .generatorRef }}{{ fail (printf "seeds[%s]: set generator or generatorRef, not both" $name) }}{{ end }}
{{- $gen := .generator | default dict }}
{{- $genRef := .generatorRef | default (dict "apiVersion" "generators.external-secrets.io/v1alpha1" "kind" ($gen.kind | default "Password") "name" ($gen.name | default (printf "%s-generator" $name))) }}
{{- $outputKey := $gen.outputKey | default "password" }}
{{- if not .generatorRef }}
---
apiVersion: {{ $genRef.apiVersion }}
kind: {{ $genRef.kind }}
metadata:
  {{- include "secrets-sync.metadata" (dict "root" $ "item" . "class" "generators" "name" $genRef.name) | nindent 2 }}
spec:
  {{- toYaml ($gen.spec | default (dict "length" 48 "digits" 8 "symbols" 0 "noUpper" false "allowRepeat" true)) | nindent 2 }}
{{- end }}
{{- $dataFrom := list }}
{{- range $keys }}
{{- $dataFrom = append $dataFrom (dict "sourceRef" (dict "generatorRef" $genRef) "rewrite" (list (dict "regexp" (dict "source" (printf "^%s$" $outputKey) "target" .)))) }}
{{- end }}
{{- $seedItem := dict "name" (printf "%s-seed" $name) "namespace" .namespace "store" false "refreshPolicy" "CreatedOnce" "dataFrom" $dataFrom "labels" .labels "annotations" .annotations }}
{{- if .seedTemplate }}{{- $_ := set $seedItem "target" (dict "template" .seedTemplate) }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- include "secrets-sync.metadata" (dict "root" $ "item" $seedItem "class" "seeds" "name" $seedItem.name) | nindent 2 }}
spec:
  {{- include "secrets-sync.externalSecretSpec" (dict "root" $ "item" $seedItem) | nindent 2 }}
{{- $push := .push | default dict }}
{{- $pushItem := dict "name" $name "namespace" .namespace "secret" $seedItem.name "updatePolicy" ($push.updatePolicy | default "IfNotExists") "deletionPolicy" ($push.deletionPolicy | default "None") "refreshInterval" $push.refreshInterval "data" (list (dict "remoteKey" $remoteKey)) "labels" .labels "annotations" .annotations }}
{{- if .store }}{{- $_ := set $pushItem "stores" (list .store) }}{{ end }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  {{- include "secrets-sync.metadata" (dict "root" $ "item" $pushItem "class" "pushSecrets" "name" $name) | nindent 2 }}
spec:
  {{- include "secrets-sync.pushSecretSpec" (dict "root" $ "item" $pushItem) | nindent 2 }}
{{- range .consumers }}
{{- $cname := required (printf "seeds[%s].consumers[].name is required" $name) .name }}
{{- $ckeys := .keys | default $keys }}
{{- $data := list }}
{{- range $ckeys }}{{- $data = append $data (dict "secretKey" . "remoteRef" (dict "key" $remoteKey "property" .)) }}{{ end }}
{{- $cItem := dict "name" $cname "namespace" (.namespace | default $seed.namespace) "store" $seed.store "refreshInterval" .refreshInterval "data" $data "labels" (.esLabels | default $seed.labels) "annotations" (.esAnnotations | default $seed.annotations) }}
{{- $tpl := dict }}
{{- if .type }}{{- $_ := set $tpl "type" .type }}{{ end }}
{{- $meta := dict }}{{- if .labels }}{{- $_ := set $meta "labels" .labels }}{{ end }}{{- if .annotations }}{{- $_ := set $meta "annotations" .annotations }}{{ end }}
{{- if $meta }}{{- $_ := set $tpl "metadata" $meta }}{{ end }}
{{- if .data }}{{- $_ := set $tpl "data" .data }}{{ end }}
{{- if $tpl }}{{- $_ := set $cItem "target" (dict "name" $cname "template" $tpl) }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  {{- include "secrets-sync.metadata" (dict "root" $ "item" $cItem "class" "externalSecrets" "name" $cname) | nindent 2 }}
spec:
  {{- include "secrets-sync.externalSecretSpec" (dict "root" $ "item" $cItem) | nindent 2 }}
{{- end }}
{{- end }}
