# secrets-sync: ESO resources from values. Every list below is independent; combine freely.
# See examples/ for one file per pattern and README.md for the combination matrix.

global:
  # Default store for every ExternalSecret / PushSecret that does not set its own.
  store:
    kind: ClusterSecretStore   # SecretStore | ClusterSecretStore
    name: openbao
  # Default namespace for namespaced resources (falls back to the release namespace).
  namespace: ""
  # Default refresh for ExternalSecrets and PushSecrets without refreshPolicy CreatedOnce.
  refreshInterval: 1h
  # Added to every resource.
  labels: {}
  annotations: {}
  argocd:
    # Argo CD sync waves per resource class, so generators exist before the seeds that call them,
    # seeds before the PushSecrets that read them, and PushSecrets before the consumers.
    syncWaves:
      generators: "-2"
      seeds: "-2"
      pushSecrets: "-1"
      externalSecrets: "0"
      clusterExternalSecrets: "0"
    # Lets the first sync pass when the ESO CRDs are applied in the same wave.
    skipDryRunOnMissingResource: true

# Generators (generators.external-secrets.io/v1alpha1): Password, UUID, … `spec` is passed through.
generators: []
# - name: app-password
#   kind: Password
#   spec: { length: 48, digits: 8, symbols: 0, noUpper: false, allowRepeat: true }

# ExternalSecrets (external-secrets.io/v1): store → Kubernetes Secret.
externalSecrets: []
# - name: grafana-admin                      # also the target Secret name unless target.name is set
#   namespace: monitoring                    # optional
#   store: { kind: ClusterSecretStore, name: openbao }   # optional, overrides global.store; `store: false` = none (generator-only dataFrom)
#   refreshInterval: 1h                      # optional; ignored with refreshPolicy CreatedOnce
#   refreshPolicy: Periodic                  # Periodic | CreatedOnce | OnChange
#   syncWave: "0"                            # optional
#   labels: {}                               # on the ExternalSecret
#   annotations: {}
#   target:
#     name: grafana-admin
#     creationPolicy: Owner                  # Owner | Orphan | Merge | None | CreateOrMerge
#     deletionPolicy: Retain                 # Delete | Merge | Retain
#     immutable: false
#     template:                              # optional; engineVersion v2 unless set
#       type: kubernetes.io/basic-auth
#       metadata: { labels: {}, annotations: {} }
#       data: { username: admin, password: "{{ .password }}" }
#       templateFrom: []
#       mergePolicy: Replace
#   data:                                    # ESO shape, passed through
#     - secretKey: password
#       remoteRef: { key: platform/grafana/admin, property: password, version: "", conversionStrategy: Default, decodingStrategy: None }
#   dataFrom:                                # ESO shape, passed through (extract | find | sourceRef.generatorRef, rewrite)
#     - extract: { key: platform/grafana/admin }
#   extraSpec: {}                            # deep-merged last, for anything not modelled above

# ClusterExternalSecrets (external-secrets.io/v1): the same ExternalSecret shape fanned out to namespaces.
clusterExternalSecrets: []
# - name: platform-ca
#   namespaces: [argocd, kargo]              # or namespaceSelectors: [{ matchLabels: {…} }]
#   refreshTime: 1h
#   externalSecret:                          # same keys as an externalSecrets[] item (name = target name)
#     name: platform-ca
#     data: [{ secretKey: ca.crt, remoteRef: { key: platform/ca, property: ca.crt } }]

# PushSecrets (external-secrets.io/v1alpha1): Kubernetes Secret (or generator) → store.
pushSecrets: []
# - name: platform-ca
#   namespace: cert-manager
#   stores: [{ kind: ClusterSecretStore, name: openbao }]   # optional, overrides [global.store]
#   secret: platform-ca                      # source Secret name; or generatorRef: { apiVersion, kind, name }
#   updatePolicy: Replace                    # Replace | IfNotExists
#   deletionPolicy: None                     # Delete | None
#   refreshInterval: 1h
#   data:                                    # sugar: one item per remote key; or ESO `match` items passed through
#     - remoteKey: platform/ca               # whole Secret → one remote key (keys become properties)
#     - secretKey: ca.crt                    # one Secret key → one remote property
#       remoteKey: platform/ca
#       property: ca.crt
#       metadata: {}                         # provider-specific
#       conversionStrategy: None             # None | ReverseUnicode
#   template: {}                             # ESO template applied before pushing
#   extraSpec: {}

# Seeds: generate once → push to the store only if absent → consume from the store.
# This is the platform pattern for passwords that must never be in Git and never rotate by accident.
seeds: []
# - name: demo-db-roles                      # PushSecret name; seed Secret is <name>-seed
#   namespace: demo
#   remoteKey: platform/demo-db/roles        # one remote key; each seed key becomes a property
#   store: { kind: ClusterSecretStore, name: openbao }   # optional
#   generator:                               # one generator, called once per key (omit with generatorRef)
#     kind: Password
#     outputKey: password                    # field the generator emits (Password → password, UUID → uuid)
#     spec: { length: 48, digits: 8, symbols: 0, noUpper: false, allowRepeat: true }
#   generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: existing }
#   keys: [owner_password, app_password]
#   seedTemplate: {}                         # optional target.template on the seed ExternalSecret (e.g. add a fixed username)
#   push: { updatePolicy: IfNotExists, deletionPolicy: None, refreshInterval: 1h }
#   consumers:                               # ExternalSecrets fed from the remote key
#     - name: demo-db-owner
#       keys: [owner_password]               # default: all seed keys
#       type: kubernetes.io/basic-auth       # target.template.type
#       labels: { cnpg.io/reload: "true" }   # target.template.metadata.labels
#       annotations: {}
#       data: { username: demo_owner, password: "{{ .owner_password }}" }   # target.template.data; omit → keys delivered as-is
#       refreshInterval: 1h
#       namespace: ""
