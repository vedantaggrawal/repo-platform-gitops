# The cluster Argo CD runs on, declared so it carries labels. ApplicationSets route on these
# labels (cluster generator): env picks argocd-apps/envs/<env>/, prune is the env's prune policy.
# No credentials: Argo CD uses its own service account for https://kubernetes.default.svc.
apiVersion: v1
kind: Secret
metadata:
  name: in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    env: local
    prune: "true"
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
