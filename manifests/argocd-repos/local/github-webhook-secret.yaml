# GitHub webhook -> Argo CD (https://argocd.evelab.space/api/webhook) so a merge refreshes apps at
# once instead of waiting on the periodic refresh (which kept stale HEADs for hours, 2026-11-22/23).
# Secret generated once, kept in OpenBao platform/argocd/github-webhook (key secret), merged into the
# Helm-managed argocd-secret as webhook.github.secret. The same value goes into the GitHub webhook form.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: argocd-github-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec: { length: 40, digits: 10, symbols: 0, noUpper: false, allowRepeat: true }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-webhook-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  target:
    name: argocd-github-webhook-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: argocd-github-webhook } }
      rewrite: [{ regexp: { source: password, target: secret } }]
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: argocd-github-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: argocd-github-webhook-seed }
  data:
    - match: { remoteRef: { remoteKey: platform/argocd/github-webhook } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret-github-webhook
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: argocd-secret
    creationPolicy: Merge     # Helm owns the rest of argocd-secret; only this key is added
    deletionPolicy: Retain
    template:
      mergePolicy: Merge
      data:
        webhook.github.secret: "{{ .secret }}"
  dataFrom:
    - extract: { key: platform/argocd/github-webhook }
