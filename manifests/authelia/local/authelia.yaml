# Authelia: the platform's identity provider. Own users and groups (secrets.yaml),
# two-factor login, OpenID Connect for apps that support it, forward-auth for
# those that don't. Secrets are generated in-cluster or come from OpenBao
# (secrets.yaml); nothing secret is in this file.
# Adding an app: one entry under identity_providers.oidc.clients in configuration.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: authelia
spec:
  replicas: 1   # SQLite storage and in-memory sessions: single instance
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: authelia }
  template:
    metadata:
      labels: { app: authelia }
    spec:
      securityContext:
        runAsUser: 8000
        runAsGroup: 8000
        fsGroup: 8000
        runAsNonRoot: true
      containers:
        - name: authelia
          image: ghcr.io/authelia/authelia:4.39.24
          env:
            - { name: X_AUTHELIA_CONFIG, value: /config/configuration.yml }
            - { name: X_AUTHELIA_CONFIG_FILTERS, value: template }
            - { name: AUTHELIA_SESSION_SECRET_FILE, value: /keys/session }
            - { name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE, value: /keys/storage }
            - { name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE, value: /keys/jwt }
            - { name: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE, value: /keys/oidc-hmac }
          ports:
            - { name: http, containerPort: 9091 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: keys, mountPath: /keys, readOnly: true }
            - { name: jwk, mountPath: /jwk, readOnly: true }
            - { name: users, mountPath: /users, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - { name: config, configMap: { name: authelia-config } }   # hashed by kustomize: config changes roll the pod
        - { name: keys, secret: { secretName: authelia-keys } }
        - { name: jwk, secret: { secretName: authelia-jwk } }
        - { name: users, secret: { secretName: authelia-users } }
        - { name: data, persistentVolumeClaim: { claimName: authelia-data } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-data
  namespace: authelia
  annotations:
    # 2FA enrolments live here: keep them if the app is ever removed.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: authelia
spec:
  selector: { app: authelia }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: authelia
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
    cert-manager.io/usages: "digital signature,key encipherment,server auth"
spec:
  ingressClassName: cilium
  tls:
    - hosts: [local.authelia.internal]
      secretName: authelia-tls
  rules:
    - host: local.authelia.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: authelia, port: { name: http } }
