# Authelia's secrets. Nothing secret is in Git:
#   authelia-keys   random keys, generated once in-cluster and kept in OpenBao
#                   (platform/authelia/keys), so deleting the Secret can't lose
#                   the storage key that decrypts the kept database
#   authelia-jwk    OIDC token-signing key, issued and renewed by cert-manager
#   authelia-users  the user list below; password hashes come from OpenBao
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authelia-key
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Generate once (one generator call per key; `password` renamed to the file name)...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-keys-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: authelia-keys-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: authelia-key } }
      rewrite: [{ regexp: { source: password, target: session } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: authelia-key } }
      rewrite: [{ regexp: { source: password, target: storage } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: authelia-key } }
      rewrite: [{ regexp: { source: password, target: jwt } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: authelia-key } }
      rewrite: [{ regexp: { source: password, target: oidc-hmac } }]
---
# ...store in OpenBao only if not there yet (never overwritten, never deleted)...
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authelia-keys
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: authelia-keys-seed }
  data:
    - match: { remoteRef: { remoteKey: platform/authelia/keys } }
---
# ...and deliver from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-keys
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: authelia-keys
    creationPolicy: Owner
  dataFrom:
    - extract: { key: platform/authelia/keys }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authelia-jwk
spec:
  secretName: authelia-jwk
  commonName: authelia-oidc-signing
  issuerRef: { kind: ClusterIssuer, name: selfsigned }
  privateKey: { algorithm: RSA, size: 2048, rotationPolicy: Never }
  duration: 87600h   # 10y: a new key logs everyone out of every app
---
# The user directory. Add a person here (groups, email) and put their password
# hash in OpenBao, property = username:
#   docker run --rm -it authelia/authelia:4.39.24 authelia crypto hash generate argon2   # prompts for the password
#   bao kv patch secret/platform/authelia/users <username>='<hash>'
#   then, after the ExternalSecret refreshes (up to 5m): kubectl -n authelia rollout restart deploy/authelia
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: authelia-users
    creationPolicy: Owner
    template:
      data:
        users_database.yml: |
          users:
            vedantaggrawal:
              displayname: Vedant
              email: vedantaggrawal@platform.internal
              groups: [platform-admins]
              password: {{ .vedantaggrawal | quote }}
  dataFrom:
    - extract: { key: platform/authelia/users }
