# OIDC apps. Adding one = a provider + application pair below.
# Issuer for each app: https://local.authentik.internal:30443/application/o/<slug>/
# Groups reach apps in the `groups` claim (part of the `profile` scope).
version: 1
metadata:
  name: platform - applications
entries:
  - model: authentik_core.group
    identifiers: { name: platform-admins }
    attrs: { is_superuser: true }   # members also administer Authentik itself

  # Shared settings for public clients (PKCE, no secret).
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-grafana
    identifiers: { name: grafana }
    attrs: &public
      client_type: public
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      client_id: grafana
      redirect_uris:
        - { matching_mode: strict, url: "https://local.grafana.internal:30443/login/generic_oauth" }
  - model: authentik_core.application
    identifiers: { slug: grafana }
    attrs: { name: Grafana, provider: !KeyOf provider-grafana }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-argocd
    identifiers: { name: argocd }
    attrs:
      <<: *public
      client_id: argocd
      redirect_uris:
        - { matching_mode: strict, url: "https://local.argocd.internal:30443/auth/callback" }
        - { matching_mode: strict, url: "http://localhost:8085/auth/callback" }   # argocd login --sso
  - model: authentik_core.application
    identifiers: { slug: argocd }
    attrs: { name: Argo CD, provider: !KeyOf provider-argocd }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-kargo
    identifiers: { name: kargo }
    attrs:
      <<: *public
      client_id: kargo
      redirect_uris:
        - { matching_mode: strict, url: "https://local.kargo.internal:30443/login" }
        # kargo login --sso listens on a random localhost port
        - { matching_mode: regex, url: '^http://localhost:[0-9]+/auth/callback$' }
  - model: authentik_core.application
    identifiers: { slug: kargo }
    attrs: { name: Kargo, provider: !KeyOf provider-kargo }
