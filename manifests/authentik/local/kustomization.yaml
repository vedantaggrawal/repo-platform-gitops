apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - database.yaml
  - secrets.yaml
# Blueprints: plain files, mounted by the chart (blueprints.configMaps) and
# applied by Authentik's worker when a file is added or its content changes.
configMapGenerator:
  - name: authentik-blueprints
    files: [blueprints/apps.yaml, blueprints/break-glass.yaml, blueprints/federation.yaml, blueprints/branding.yaml]
    options:
      disableNameSuffixHash: true   # the chart mounts it by this exact name
