apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - database.yaml
  - secrets.yaml
# Blueprints: plain files, mounted by the chart (blueprints.configMaps) and
# applied by Authentik's worker on change and periodically.
configMapGenerator:
  - name: authentik-blueprints
    files: [blueprints/apps.yaml, blueprints/gitlab.yaml]
    options:
      disableNameSuffixHash: true   # the chart mounts it by this exact name
