# LibreChat's OIDC client secret: generated once, kept in OpenBao (platform/authentik/librechat-oidc),
# delivered to Authentik as env (blueprint reads !Env) and to LibreChat (manifests/secret-stores/local/librechat-oidc.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: librechat-oidc-client-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec: { length: 48, digits: 8, symbols: 0, noUpper: false, allowRepeat: true }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-oidc-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  target:
    name: librechat-oidc-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: librechat-oidc-client-secret } }
      rewrite: [{ regexp: { source: password, target: client_secret } }]
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: librechat-oidc
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: librechat-oidc-seed }
  data:
    - match: { remoteRef: { remoteKey: platform/authentik/librechat-oidc } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-librechat-oidc
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: authentik-librechat-oidc
    creationPolicy: Owner
  dataFrom:
    - extract: { key: platform/authentik/librechat-oidc }
