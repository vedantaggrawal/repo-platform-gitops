# Authentik's secrets. Nothing secret is in Git:
#   authentik-keys    secret_key and the first-start admin password, generated
#                     once in-cluster and kept in OpenBao (platform/authentik/keys),
#                     so deleting the Secret can't change them
#   authentik-blueprint-gitlab  the GitLab login blueprint, with the GitLab OAuth
#                     app's credentials (written to OpenBao by a human)
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-key
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Generate once (one generator call per key; `password` renamed to the key)...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-keys-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: authentik-keys-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: authentik-key } }
      rewrite: [{ regexp: { source: password, target: secret_key } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: authentik-key } }
      rewrite: [{ regexp: { source: password, target: bootstrap_password } }]
---
# ...store in OpenBao only if not there yet (never overwritten, never deleted)...
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik-keys
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: authentik-keys-seed }
  data:
    - match: { remoteRef: { remoteKey: platform/authentik/keys } }
---
# ...and deliver from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-keys
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: authentik-keys
    creationPolicy: Owner
  dataFrom:
    - extract: { key: platform/authentik/keys }
---
# GitLab login. The blueprint is rendered with the credentials, so changing them
# in OpenBao changes the file and Authentik applies it again (no restart).
# Link-only: GitLab logs in existing users who connected GitLab in their
# settings; it can't create accounts.
# GitLab OAuth app (gitlab.com > Preferences > Applications), written once by a human:
#   bao kv put secret/platform/authentik/gitlab client_id=<id> client_secret=<secret>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-gitlab
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: authentik-blueprint-gitlab
    creationPolicy: Owner
    template:
      data:
        gitlab.yaml: |
          version: 1
          metadata:
            name: platform - gitlab login
          entries:
            - model: authentik_sources_oauth.oauthsource
              identifiers: { slug: gitlab }
              attrs:
                name: GitLab
                provider_type: gitlab
                consumer_key: {{ .client_id | quote }}
                consumer_secret: {{ .client_secret | quote }}
                authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
                user_matching_mode: identifier
  dataFrom:
    - extract: { key: platform/authentik/gitlab }
