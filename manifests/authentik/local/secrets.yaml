# Authentik's secrets. Nothing secret is in Git:
#   authentik-keys    secret_key and the first-start admin password, generated
#                     once in-cluster and kept in OpenBao (platform/authentik/keys),
#                     so deleting the Secret can't change them
#   authentik-blueprint-github  the GitHub login blueprint, with the GitHub OAuth
#                     app's credentials (seeded by Terraform, pushed to OpenBao)
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-key
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Generate once (one generator call per key; `password` renamed to the key)...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-keys-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: authentik-keys-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: authentik-key } }
      rewrite: [{ regexp: { source: password, target: secret_key } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: authentik-key } }
      rewrite: [{ regexp: { source: password, target: bootstrap_password } }]
---
# ...store in OpenBao only if not there yet (never overwritten, never deleted)...
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik-keys
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: authentik-keys-seed }
  data:
    - match: { remoteRef: { remoteKey: platform/authentik/keys } }
---
# ...and deliver from OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-keys
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: authentik-keys
    creationPolicy: Owner
  dataFrom:
    - extract: { key: platform/authentik/keys }
---
# GitHub login. The blueprint is rendered with the credentials, so changing them
# in OpenBao changes the file and Authentik applies it again (no restart).
# Federated: the first login of an allowlisted GitHub account creates the user
# (allowlist, admins and enrollment flow: blueprints/federation.yaml).
# GitHub OAuth app (github.com > Settings > Developer settings > OAuth Apps). Its
# credentials come from tfvars authentik_github_client_id/secret (repo-platform),
# pushed to OpenBao by manifests/secret-stores/local/seed-secrets.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-github
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: authentik-blueprint-github
    creationPolicy: Owner
    template:
      data:
        github.yaml: |
          version: 1
          metadata:
            name: platform - github login
          entries:
            # Enrollment flow, allowlist and group mapping (blueprints/federation.yaml).
            - model: authentik_blueprints.metaapplyblueprint
              attrs:
                identifiers: { name: platform - github federation }
                required: true
            - model: authentik_sources_oauth.oauthsource
              identifiers: { slug: github }
              attrs:
                name: GitHub
                provider_type: github
                consumer_key: {{ .client_id | quote }}
                consumer_secret: {{ .client_secret | quote }}
                authentication_flow: !Find [authentik_flows.flow, [slug, github-authentication]]
                enrollment_flow: !Find [authentik_flows.flow, [slug, github-enrollment]]
                user_matching_mode: identifier
                group_matching_mode: name_link
                user_property_mappings:
                  - !Find [authentik_sources_oauth.oauthsourcepropertymapping, [name, github-groups]]
            # Standard sign-in page: a username field (password login, e.g.
            # akadmin) plus a GitHub button. Sign-out lands here and stays here.
            - model: authentik_stages_identification.identificationstage
              identifiers: { name: default-authentication-identification }
              attrs:
                user_fields: [username]
                sources:
                  - !Find [authentik_sources_oauth.oauthsource, [slug, github]]
  dataFrom:
    - extract: { key: platform/authentik/github }
