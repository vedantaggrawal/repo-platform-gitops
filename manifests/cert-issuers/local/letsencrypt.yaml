# Public certificates from Let's Encrypt via DNS-01 on Cloudflare (zone evelab.space). Hostnames
# keep resolving privately; only the TXT challenge touches public DNS. Token: OpenBao
# platform/dns-provider/cloudflare (key token) -> Secret cloudflare-api-token in cert-manager
# (manifests/secret-stores/local/cloudflare-api-token.yaml). Staging first, prod once proven.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-staging-account }
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: { name: cloudflare-api-token, key: token }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-account }
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef: { name: cloudflare-api-token, key: token }
