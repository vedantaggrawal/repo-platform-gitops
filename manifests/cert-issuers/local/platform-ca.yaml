# Platform root CA for edge TLS. The existing `selfsigned` ClusterIssuer
# (repo-platform Terraform) signs only this root; every ingress/gateway cert is
# then issued by `platform-ca`, so trusting this one root on your machine makes
# all *.internal hosts valid. Export it with:
#   kubectl -n cert-manager get secret platform-root-ca -o jsonpath='{.data.ca\.crt}' | base64 -d > eve-platform-ca.crt
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: eve platform local CA
  secretName: platform-root-ca
  duration: 87600h # 10y
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca
spec:
  ca:
    # ClusterIssuer secrets resolve in cert-manager's cluster resource namespace.
    secretName: platform-root-ca
