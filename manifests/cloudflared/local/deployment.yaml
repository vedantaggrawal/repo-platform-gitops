# Cloudflare Tunnel connector: outbound-only connections to Cloudflare's edge; no inbound port, the
# home IP stays hidden. Public hostnames are routed in the Cloudflare dashboard with ONE rule:
#   *.evelab.space -> https://envoy-envoy-gateway-system-platform-f2076d6c.envoy-gateway-system.svc.cluster.local:443
#   TLS: Origin Server Name = tunnel.local.evelab.space (matches the gateway's public wildcard cert)
# Envoy then routes by Host, so an app is public only if its HTTPRoute lists <app>.evelab.space.
# These pods are the ONLY connectors for the tunnel. Never run `cloudflared service install` on a
# laptop with this token: Cloudflare balances across every connector, and one that cannot resolve
# the in-cluster origin turns a share of all public requests into edge 502s (incident 2026-11-22).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels: { app.kubernetes.io/name: cloudflared }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: cloudflared }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloudflared }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.11.1
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: cloudflared-tunnel, key: token } }
          ports:
            - { name: metrics, containerPort: 2000 }
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
