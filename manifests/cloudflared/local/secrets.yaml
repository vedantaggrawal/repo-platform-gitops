# Tunnel token (remote-managed tunnel created in Cloudflare Zero Trust -> Networks -> Tunnels).
# Stored once in OpenBao at platform/dns-provider/cloudflared, key token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: cloudflared-tunnel
    creationPolicy: Owner
  dataFrom:
    - extract: { key: platform/dns-provider/cloudflared }
