{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "config-drift-dashboard",
    "namespace": "monitoring",
    "labels": {
      "grafana_dashboard": "1"
    },
    "annotations": {
      "config-drift/note": "Sections auto-repeat per $app (service_namespace label). Columns are a union of app schemas; add new flattened fields here as apps gain them."
    }
  },
  "data": {
    "config-drift.json": "{\n  \"title\": \"Config Drift \\u2014 per app (dynamic)\",\n  \"uid\": \"config-drift\",\n  \"tags\": [\n    \"config-drift\"\n  ],\n  \"schemaVersion\": 39,\n  \"version\": 11,\n  \"refresh\": \"\",\n  \"time\": {\n    \"from\": \"now-15m\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"app\",\n        \"type\": \"query\",\n        \"label\": \"App\",\n        \"datasource\": {\n          \"type\": \"loki\",\n          \"uid\": \"loki\"\n        },\n        \"query\": {\n          \"label\": \"service_namespace\",\n          \"stream\": \"\",\n          \"type\": 1,\n          \"refId\": \"LokiVariableQueryEditor-VariableQuery\"\n        },\n        \"definition\": \"label_values(service_namespace)\",\n        \"includeAll\": true,\n        \"multi\": true,\n        \"current\": {\n          \"text\": [\n            \"All\"\n          ],\n          \"value\": [\n            \"$__all\"\n          ]\n        },\n        \"refresh\": 2,\n        \"sort\": 1\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"type\": \"row\",\n      \"title\": \"App: $app\",\n      \"repeat\": \"app\",\n      \"repeatDirection\": \"v\",\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      }\n    },\n    {\n      \"type\": \"table\",\n      \"title\": \"$app \\u2014 drift across envs (differing cells down a column)\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 1\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"count by (env,OidcConfig_Authority,KeycloakConfig_Url,OidcConfig_ClientId,KeycloakConfig_ClientId,TmfApi_GatewayOAuth_ClientId,OandSI_OAuth_ClientId,HealthCheck_Enabled,UseRealData,Serilog_WriteTo_1_Args_serverUrl,Database_ConnectionString,Database_MaxPoolSize,Payments_Provider,Payments_WebhookUrl,Payments_RetryCount,FeatureManagement_EnableNewCheckout) (count_over_time({service_name=\\\"config-drift\\\", service_namespace=\\\"$app\\\"} [1m]))\",\n          \"queryType\": \"instant\"\n        }\n      ],\n      \"transformations\": [\n        {\n          \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n              \"Time\": true,\n              \"Value\": true\n            },\n            \"indexByName\": {\n              \"env\": 0\n            },\n            \"renameByName\": {}\n          }\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"custom\": {\n            \"filterable\": true\n          }\n        },\n        \"overrides\": []\n      }\n    }\n  ]\n}"
  }
}
