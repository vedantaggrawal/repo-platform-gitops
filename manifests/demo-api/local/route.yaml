# Demo API entry point. Gateway API defaults (group/kind, weight, PathPrefix "/")
# are written out so Argo CD 2.10's client-side diff shows no drift.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-api
  namespace: kargo-demo-test
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: platform, namespace: envoy-gateway-system, sectionName: https}
  hostnames: [local.demo-api.internal]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: kargo-demo, port: 3000, weight: 1}]
