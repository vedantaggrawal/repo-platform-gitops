# eve console (github.com/vedantaggrawal/eve-console): GitHub sign-in and repository list. Stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-console
  namespace: eve-console
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: eve-console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: eve-console }
    spec:
      serviceAccountName: eve-console   # manages sandbox pods (manifests/eve-console/local/sandboxes.yaml)
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: console
          image: ghcr.io/vedantaggrawal/eve-console:IMAGE_TAG
          env:
            - { name: PUBLIC_URL, value: "https://app.evelab.space" }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }   # Kubernetes API
          envFrom:
            - secretRef: { name: eve-console-session }
            - secretRef: { name: eve-console-github }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: eve-console
  namespace: eve-console
spec:
  selector: { app.kubernetes.io/name: eve-console }
  ports:
    - { name: http, port: 80, targetPort: http }
