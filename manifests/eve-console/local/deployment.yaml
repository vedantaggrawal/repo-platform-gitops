# eve console (github.com/evelab-space/eve-console). Stateless. The image line is written by the Kargo
# pipeline (manifests/eve-pipeline): every new image on main is promoted, rolled out and verified.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-console
  namespace: eve-console
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: eve-console }
  template:
    metadata:
      labels: { app.kubernetes.io/name: eve-console }
      annotations:
        eve.io/secret-rev: "1"   # bump to reload env from Secrets (read at start)
        # Zero-code OpenTelemetry: the operator injects the Node.js agent (HTTP server/client, fetch, Next.js spans)
        instrumentation.opentelemetry.io/inject-nodejs: opentelemetry-operator/default
    spec:
      serviceAccountName: eve-console   # manages sandbox pods (manifests/eve-console/local/sandboxes.yaml)
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }   # image user "node" is non-numeric
      containers:
        - name: console
          image: ghcr.io/evelab-space/eve-console:sha-d4d404311ba8cd0d87a4582b2b7ccdde14971246
          env:
            - { name: PUBLIC_URL, value: "https://app.evelab.space" }
            - { name: NODE_EXTRA_CA_CERTS, value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }   # Kubernetes API
            - { name: FARO_URL, value: "https://faro.evelab.space/" }   # browser telemetry (manifests/otel/local/collector-faro.yaml)
            - { name: KEYCLOAK_URL, value: "https://keycloak.evelab.space" }
            - { name: KEYCLOAK_REALM, value: platform }
            - { name: KEYCLOAK_CLIENT_ID, value: eve-console }
            - { name: OTEL_SERVICE_NAME, value: eve-console }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc }   # the agent endpoint in the Instrumentation is :4317 (gRPC)
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=eve,deployment.environment=local" }
          envFrom:
            - secretRef: { name: eve-console-session }
            - secretRef: { name: eve-console-github, optional: true }   # until the GitHub App exists
            - secretRef: { name: eve-console-argocd-plugin, optional: true }   # ARGOCD_PLUGIN_TOKEN (deploy-rails.yaml)
            - secretRef: { name: eve-console-keycloak, optional: true }   # KEYCLOAK_CLIENT_SECRET: sign-in through Keycloak
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }
