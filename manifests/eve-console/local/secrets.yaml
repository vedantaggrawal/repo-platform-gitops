# eve console secrets.
# - eve-console-session: cookie encryption key, generated once, kept in OpenBao platform/eve-console/session.
# - eve-console-github: the eve GitHub App (created by hand in GitHub), OpenBao
#   platform/eve-console/github-app {client_id, client_secret, slug}.
apiVersion: v1
kind: Namespace
metadata:
  name: eve-console
  labels:
    eve.io/layer: addons
    eve.io/tenant: platform
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: eve-console-session
  namespace: eve-console
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec: { length: 48, digits: 8, symbols: 0, noUpper: false, allowRepeat: true }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eve-console-session-seed
  namespace: eve-console
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  target:
    name: eve-console-session-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: eve-console-session } }
      rewrite: [{ regexp: { source: password, target: SESSION_SECRET } }]
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: eve-console-session
  namespace: eve-console
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: eve-console-session-seed }
  data:
    - match: { remoteRef: { remoteKey: platform/eve-console/session } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eve-console-session
  namespace: eve-console
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: eve-console-session
    creationPolicy: Owner
  dataFrom:
    - extract: { key: platform/eve-console/session }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eve-console-github
  namespace: eve-console
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 15m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: eve-console-github
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GITHUB_APP_CLIENT_ID: '{{ .client_id }}'
        GITHUB_APP_CLIENT_SECRET: '{{ .client_secret }}'
        GITHUB_APP_SLUG: '{{ .slug | trim | trimSuffix "/" | splitList "/" | last }}'   # name or https://github.com/apps/<name>
  dataFrom:
    - extract: { key: platform/eve-console/github-app }
