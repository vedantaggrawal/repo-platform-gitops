# Image registry for apps eve builds from users' repos. GHCR won't take GitHub App tokens and the nodes
# can't reach Harbor, so this registry runs with hostNetwork on the worker: containerd pulls
# localhost:5000/... (plain HTTP is allowed for localhost), build Jobs push through the Service.
# Single worker for now; more nodes need shared storage (S3 backend) and a DaemonSet.
apiVersion: v1
kind: Namespace
metadata:
  name: eve-registry
  labels:
    eve.io/layer: addons
    eve.io/tenant: platform
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: eve-registry
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: eve-registry
spec:
  replicas: 1
  strategy: { type: Recreate }   # hostPort 5000 + RWO volume
  selector:
    matchLabels: { app.kubernetes.io/name: eve-registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: eve-registry }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: registry
          image: docker.io/library/registry:3.0.0
          env:
            - { name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5000" }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          ports:
            - { name: http, containerPort: 5000, hostPort: 5000 }
          readinessProbe:
            httpGet: { path: /v2/, port: 5000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry-data }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: eve-registry
spec:
  selector: { app.kubernetes.io/name: eve-registry }
  ports:
    - { name: http, port: 5000, targetPort: 5000 }
