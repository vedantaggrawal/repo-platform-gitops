# Temporary smoke test (removed once verified): copy busybox into the registry, then run it from
# localhost:5000 to prove the nodes can pull what builds push.
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-push
  namespace: eve-registry
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: crane
          image: gcr.io/go-containerregistry/crane:v0.22.1
          args: [copy, --insecure, "docker.io/library/busybox:1.37.0", "registry.eve-registry.svc.cluster.local:5000/smoke/busybox:1.37.0"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-pull
  namespace: eve-registry
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: smoke-pull }
  template:
    metadata:
      labels: { app.kubernetes.io/name: smoke-pull }
    spec:
      containers:
        - name: busybox
          image: localhost:5000/smoke/busybox:1.37.0
          command: [sh, -c, "echo pulled-from-eve-registry; sleep 3600"]
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { memory: 32Mi } }
