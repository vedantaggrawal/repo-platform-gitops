# Public wildcard for the gateway's HTTPS listener (SNI picks it for *.local.evelab.space while the
# private platform-gateway-tls keeps serving local.*.internal during the hostname move).
# Staging issuer until issuance is proven; then letsencrypt.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-gateway-public
  namespace: envoy-gateway-system
spec:
  secretName: platform-gateway-public-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-staging
  dnsNames:
    - local.evelab.space
    - "*.local.evelab.space"
