apiVersion: v1
kind: ConfigMap
metadata:
  name: saturation-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana-dashboards/note: Interim ConfigMap provisioning; moves to Grafana Git Sync once Grafana 13 lands.
data:
  saturation-overview.json: |
    {"uid":"saturation-overview","title":"Saturation overview","tags":["saturation"],"schemaVersion":39,"version":1,"time":{"from":"now-6h","to":"now"},"refresh":"1m","templating":{"list":[{"name":"x_tenant_id","label":"tenant","type":"query","datasource":{"type":"prometheus","uid":"mimir"},"query":{"query":"label_values(traces_span_metrics_calls_total,x_tenant_id)","refId":"v"},"includeAll":true,"allValue":".*","multi":true,"current":{"text":"All","value":"$__all"},"refresh":2}]},"annotations":{"list":[]},"panels":[
    {"type":"row","title":"Nodes","id":1,"gridPos":{"h":1,"w":24,"x":0,"y":0},"collapsed":false},
    {"type":"timeseries","title":"Memory requests / allocatable","id":2,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":0,"y":1},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","expr":"100*sum by(node)(kube_pod_container_resource_requests{resource=\"memory\"})/sum by(node)(kube_node_status_allocatable{resource=\"memory\"})","legendFormat":"{{node}}"}]},
    {"type":"timeseries","title":"CPU requests / allocatable","id":3,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":8,"y":1},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","expr":"100*sum by(node)(kube_pod_container_resource_requests{resource=\"cpu\"})/sum by(node)(kube_node_status_allocatable{resource=\"cpu\"})","legendFormat":"{{node}}"}]},
    {"type":"timeseries","title":"Pods Pending","id":4,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":16,"y":1},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"sum(kube_pod_status_phase{phase=\"Pending\"})","legendFormat":"pending"}]},
    {"type":"timeseries","title":"OOMKills","id":5,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":0,"y":8},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(namespace,pod)(increase(container_oom_events_total[$__rate_interval]))>0","legendFormat":"{{namespace}}/{{pod}}"},{"refId":"B","expr":"increase(node_vmstat_oom_kill[$__rate_interval])>0","legendFormat":"node {{instance}}"}]},
    {"type":"row","title":"Storage","id":6,"gridPos":{"h":1,"w":24,"x":0,"y":15},"collapsed":false},
    {"type":"timeseries","title":"Node /var used % (holds all PVCs)","id":7,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":12,"x":0,"y":16},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","expr":"100*(1-node_filesystem_avail_bytes{mountpoint=\"/var\"}/node_filesystem_size_bytes{mountpoint=\"/var\"})","legendFormat":"{{namespace}}/{{persistentvolumeclaim}}"}]},
    {"type":"timeseries","title":"Node /var days to full (6h trend)","id":8,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":12,"x":12,"y":16},"fieldConfig":{"defaults":{"unit":"d"},"overrides":[]},"targets":[{"refId":"A","expr":"node_filesystem_avail_bytes{mountpoint=\"/var\"}/clamp_min(-deriv(node_filesystem_avail_bytes{mountpoint=\"/var\"}[6h]),1)/86400","legendFormat":"{{namespace}}/{{persistentvolumeclaim}}"}]},
    {"type":"row","title":"Gateway","id":9,"gridPos":{"h":1,"w":24,"x":0,"y":23},"collapsed":false},
    {"type":"timeseries","title":"RPS by cluster","id":10,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":0,"y":24},"fieldConfig":{"defaults":{"unit":"reqps"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(envoy_cluster_name)(rate(envoy_cluster_upstream_rq_total{job=~\".*gateway.*\"}[$__rate_interval]))","legendFormat":"{{envoy_cluster_name}}"}]},
    {"type":"timeseries","title":"4xx / 5xx RPS","id":11,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":8,"y":24},"fieldConfig":{"defaults":{"unit":"reqps"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(envoy_response_code_class)(rate(envoy_http_downstream_rq_xx_total{job=~\".*gateway.*\",envoy_response_code_class=~\"4|5\"}[$__rate_interval]))","legendFormat":"{{envoy_response_code_class}}xx"}]},
    {"type":"timeseries","title":"429s by cluster","id":12,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":16,"y":24},"fieldConfig":{"defaults":{"unit":"reqps"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(envoy_cluster_name)(rate(envoy_cluster_upstream_rq_total{job=~\".*gateway.*\",envoy_response_code=\"429\"}[$__rate_interval]))","legendFormat":"{{envoy_cluster_name}}"}]},
    {"type":"timeseries","title":"Upstream p95 by cluster","id":13,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":12,"x":0,"y":31},"fieldConfig":{"defaults":{"unit":"ms"},"overrides":[]},"targets":[{"refId":"A","expr":"histogram_quantile(0.95,sum by(le,envoy_cluster_name)(rate(envoy_cluster_upstream_rq_time_bucket{job=~\".*gateway.*\"}[$__rate_interval])))","legendFormat":"{{envoy_cluster_name}}"}]},
    {"type":"timeseries","title":"Overflows (cx / pending rq / retry)","id":14,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":12,"x":12,"y":31},"fieldConfig":{"defaults":{"unit":"ops"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(envoy_cluster_name)(rate(envoy_cluster_upstream_cx_overflow_total{job=~\".*gateway.*\"}[$__rate_interval]))","legendFormat":"cx {{envoy_cluster_name}}"},{"refId":"B","expr":"sum by(envoy_cluster_name)(rate(envoy_cluster_upstream_rq_pending_overflow_total{job=~\".*gateway.*\"}[$__rate_interval]))","legendFormat":"pending {{envoy_cluster_name}}"},{"refId":"C","expr":"sum by(envoy_cluster_name)(rate(envoy_cluster_upstream_rq_retry_overflow_total{job=~\".*gateway.*\"}[$__rate_interval]))","legendFormat":"retry {{envoy_cluster_name}}"}]},
    {"type":"row","title":"App RED (tenant: $x_tenant_id)","id":15,"gridPos":{"h":1,"w":24,"x":0,"y":38},"collapsed":false},
    {"type":"timeseries","title":"Rate by service","id":16,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":0,"y":39},"fieldConfig":{"defaults":{"unit":"reqps"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(service_name)(rate(traces_span_metrics_calls_total{x_tenant_id=~\"$x_tenant_id\"}[$__rate_interval]))","legendFormat":"{{service_name}}","exemplar":true}]},
    {"type":"timeseries","title":"Errors % by service","id":17,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":8,"y":39},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","expr":"100*sum by(service_name)(rate(traces_span_metrics_calls_total{x_tenant_id=~\"$x_tenant_id\",status_code=\"STATUS_CODE_ERROR\"}[$__rate_interval]))/sum by(service_name)(rate(traces_span_metrics_calls_total{x_tenant_id=~\"$x_tenant_id\"}[$__rate_interval]))","legendFormat":"{{service_name}}","exemplar":true}]},
    {"type":"timeseries","title":"Duration p95 by service","id":18,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":16,"y":39},"fieldConfig":{"defaults":{"unit":"ms"},"overrides":[]},"targets":[{"refId":"A","expr":"histogram_quantile(0.95,sum by(le,service_name)(rate(traces_span_metrics_duration_milliseconds_bucket{x_tenant_id=~\"$x_tenant_id\"}[$__rate_interval])))","legendFormat":"{{service_name}}","exemplar":true}]},
    {"type":"row","title":"Postgres (CNPG)","id":19,"gridPos":{"h":1,"w":24,"x":0,"y":46},"collapsed":false},
    {"type":"timeseries","title":"Connections vs max","id":20,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":0,"y":47},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(namespace,pod)(cnpg_backends_total)","legendFormat":"used {{namespace}}/{{pod}}"},{"refId":"B","expr":"max by(namespace,pod)(cnpg_pg_settings_setting{name=\"max_connections\"})","legendFormat":"max {{namespace}}/{{pod}}"}]},
    {"type":"timeseries","title":"Lock waits","id":21,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":8,"y":47},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(namespace,pod)(cnpg_backends_waiting_total)","legendFormat":"{{namespace}}/{{pod}}"}]},
    {"type":"timeseries","title":"Longest transaction","id":22,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":16,"y":47},"fieldConfig":{"defaults":{"unit":"s"},"overrides":[]},"targets":[{"refId":"A","expr":"max by(namespace,pod)(cnpg_backends_max_tx_duration_seconds)","legendFormat":"{{namespace}}/{{pod}}"}]},
    {"type":"row","title":"Telemetry pipeline","id":23,"gridPos":{"h":1,"w":24,"x":0,"y":54},"collapsed":false},
    {"type":"timeseries","title":"Exporter queue size / capacity","id":24,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":0,"y":55},"fieldConfig":{"defaults":{"unit":"percent"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(exporter,data_type)(otelcol_exporter_queue_size)/sum by(exporter,data_type)(otelcol_exporter_queue_capacity)*100","legendFormat":"{{exporter}} {{data_type}}"}]},
    {"type":"timeseries","title":"Exporter send failed","id":25,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":8,"y":55},"fieldConfig":{"defaults":{"unit":"ops"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(exporter)(rate(otelcol_exporter_send_failed_spans_total[$__rate_interval]))","legendFormat":"spans {{exporter}}"},{"refId":"B","expr":"sum by(exporter)(rate(otelcol_exporter_send_failed_metric_points_total[$__rate_interval]))","legendFormat":"metrics {{exporter}}"},{"refId":"C","expr":"sum by(exporter)(rate(otelcol_exporter_send_failed_log_records_total[$__rate_interval]))","legendFormat":"logs {{exporter}}"}]},
    {"type":"timeseries","title":"Mimir discards","id":26,"datasource":{"type":"prometheus","uid":"mimir"},"gridPos":{"h":7,"w":8,"x":16,"y":55},"fieldConfig":{"defaults":{"unit":"ops"},"overrides":[]},"targets":[{"refId":"A","expr":"sum by(reason,user)(rate(cortex_discarded_samples_total[$__rate_interval]))","legendFormat":"samples {{reason}}"},{"refId":"B","expr":"sum by(reason,user)(rate(cortex_discarded_exemplars_total[$__rate_interval]))","legendFormat":"exemplars {{reason}}"}]}
    ]}
