# Realms reconciled by keycloak-config-cli. Non-sensitive: secrets are
# substituted at run time from out-of-band Secrets ($(env:NAME:default)).
# `platform`: SSO for platform UIs (Grafana first). People log in with GitHub;
# everyone lands in platform-viewers, listed users in platform-admins.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realms
  namespace: keycloak
data:
  platform.json: |
    {
      "realm": "platform",
      "enabled": true,
      "displayName": "Platform",
      "registrationAllowed": false,
      "loginWithEmailAllowed": false,
      "groups": [
        {
          "name": "platform-admins"
        },
        {
          "name": "platform-viewers"
        }
      ],
      "defaultGroups": [
        "/platform-viewers"
      ],
      "identityProviders": [
        {
          "alias": "github",
          "providerId": "github",
          "enabled": true,
          "trustEmail": false,
          "firstBrokerLoginFlowAlias": "first broker login",
          "config": {
            "clientId": "$(env:GITHUB_CLIENT_ID:unset)",
            "clientSecret": "$(env:GITHUB_CLIENT_SECRET:unset)",
            "syncMode": "IMPORT",
            "defaultScope": "read:user"
          }
        }
      ],
      "users": [
        {
          "username": "vedantaggrawal",
          "enabled": true,
          "federatedIdentities": [
            {
              "identityProvider": "github",
              "userId": "14919641",
              "userName": "vedantaggrawal"
            }
          ],
          "groups": [
            "/platform-admins"
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "groups",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "grafana",
          "name": "Grafana",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "https://local.grafana.internal:30443/login/generic_oauth"
          ],
          "webOrigins": [
            "https://local.grafana.internal:30443"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://local.grafana.internal:30443/*"
          },
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "groups"
          ]
        }
      ]
    }
