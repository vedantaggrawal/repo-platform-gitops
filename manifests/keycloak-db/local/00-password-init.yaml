# Generates the `keycloak-db` Secret in-cluster on first sync (PreSync hook):
# exits if it already exists, otherwise creates it with a random password.
# The password never appears in Git (this repo is public), and Argo CD does not
# track the Secret, so it is never pruned or rotated.
#
# Recovery: the password is only applied when Postgres initialises an empty
# volume. Do not delete the Secret while the `data-keycloak-db-0` PVC exists —
# a regenerated password would no longer match the database. Remove both
# together (losing Keycloak's data) or neither.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-db-password-init
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-db-password-init
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["keycloak-db"]
    verbs: ["get"]
  # RBAC can't restrict `create` by name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-db-password-init
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-db-password-init
subjects:
  - kind: ServiceAccount
    name: keycloak-db-password-init
    namespace: keycloak
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-password-init
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: keycloak-db-password-init
      restartPolicy: Never
      containers:
        - name: init
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              API=https://kubernetes.default.svc/api/v1/namespaces/keycloak/secrets
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              AUTH="Authorization: Bearer $(cat $SA/token)"
              code=$(curl -s -o /dev/null -w '%{http_code}' --cacert $SA/ca.crt -H "$AUTH" $API/keycloak-db)
              if [ "$code" = 200 ]; then echo "keycloak-db exists"; exit 0; fi
              [ "$code" = 404 ] || { echo "unexpected status $code"; exit 1; }
              pw=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
              body='{"apiVersion":"v1","kind":"Secret","metadata":{"name":"keycloak-db","labels":{"app.kubernetes.io/managed-by":"keycloak-db-password-init"}},"stringData":{"username":"keycloak","password":"'"$pw"'"}}'
              code=$(curl -s -o /dev/null -w '%{http_code}' --cacert $SA/ca.crt -H "$AUTH" -H 'Content-Type: application/json' -X POST -d "$body" $API)
              [ "$code" = 201 ] || [ "$code" = 409 ] || { echo "create failed: $code"; exit 1; }
              echo "keycloak-db created"
