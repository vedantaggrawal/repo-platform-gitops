# MinIO credentials of user `cnpg` for objectstore.yaml, from OpenBao (seeded
# by manifests/minio-init/local/credentials.yaml). Holds no value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-backup-s3
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-db-backup-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: platform/minio/cnpg, property: username }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: platform/minio/cnpg, property: password }
