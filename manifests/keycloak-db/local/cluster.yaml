# Keycloak's Postgres, run by the CloudNativePG operator. The operator creates
# the database, the `keycloak` owner and the `keycloak-db-app` Secret (username,
# password, host, uri) — no credential lives in this public repo.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    # SkipDryRun: the CRD comes from the cloudnative-pg platform app (separate
    # Application). Delete/Prune=false: Argo never deletes this Cluster (doing so
    # drops the database and rotates its credentials).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Delete=false,Prune=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  # Continuous WAL archiving to MinIO via the Barman Cloud plugin
  # (objectstore.yaml). Adding it restarts the single instance once.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: keycloak-db-backups
  storage:
    size: 2Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
