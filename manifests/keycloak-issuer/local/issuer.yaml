# Pods can't reach the Keycloak issuer URL https://local.keycloak.internal:30443
# (30443 exists only as kind's host port mapping). This gives it a stable
# in-cluster address: a Service with a fixed ClusterIP on port 30443 whose
# endpoints are the nodes' Cilium Envoy listener (:443, hostNetwork), which
# serves local.keycloak.internal with the platform-ca certificate. OIDC clients
# resolve the hostname to it with:
#   hostAliases: [{ip: 10.96.200.10, hostnames: [local.keycloak.internal]}]
# and trust platform-ca via the platform-ca-bundle ConfigMap below.
# Node IPs are kind's (172.18.0.2/.3); re-check them after a cluster recreate.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-issuer
  namespace: keycloak
spec:
  clusterIP: 10.96.200.10
  ports:
    - name: https
      port: 30443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: keycloak-issuer-nodes
  namespace: keycloak
  labels:
    kubernetes.io/service-name: keycloak-issuer
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
endpoints:
  - addresses: ["172.18.0.2"]
  - addresses: ["172.18.0.3"]
---
# Public root certificate of the platform CA (not secret). Copy or mount where
# OIDC clients need to trust the issuer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-ca-bundle
  namespace: keycloak
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    MIIBgTCCASagAwIBAgIQB/8YJdb3OtmidL634o3oSzAKBggqhkjOPQQDAjAgMR4w
    HAYDVQQDExVldmUgcGxhdGZvcm0gbG9jYWwgQ0EwHhcNMjYxMDIzMDIyMzU0WhcN
    MzYxMDIwMDIyMzU0WjAgMR4wHAYDVQQDExVldmUgcGxhdGZvcm0gbG9jYWwgQ0Ew
    WTATBgcqhkjOPQIBBggqhkjOPQMBBwNCAARsYgvcYWnsUeKQe5rjxeX/kcerwJTx
    WzP73sQ1SZmeDAyUnC/oyWwRq6vHhCdBEQ0meUc2vKMUAl1uoBtu7mXwo0IwQDAO
    BgNVHQ8BAf8EBAMCAqQwDwYDVR0TAQH/BAUwAwEB/zAdBgNVHQ4EFgQUmxRxF9ub
    yE1im8onzF7IscaXrbIwCgYIKoZIzj0EAwIDSQAwRgIhAL5Q2azSZFfSWTBhHaNI
    XiPQAIIXfsb73q3hEDZ3yBdNAiEAxDvRCRque6UrexgZG+MKEwM/Cobm/rztNM2D
    mL/58NE=
    -----END CERTIFICATE-----
---
# Self-test after every sync: discovery through the in-cluster path must work
# and its issuer must equal the external URL.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-issuer-check
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      hostAliases:
        - ip: 10.96.200.10
          hostnames: ["local.keycloak.internal"]
      containers:
        - name: check
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              out=$(curl -sS --cacert /ca/ca.crt https://local.keycloak.internal:30443/realms/platform/.well-known/openid-configuration)
              echo "$out" | grep -q '"issuer":"https://local.keycloak.internal:30443/realms/platform"' || { echo "unexpected discovery: $out" | head -c 300; exit 1; }
              echo "issuer reachable in-cluster"
          volumeMounts:
            - name: ca
              mountPath: /ca
      volumes:
        - name: ca
          configMap:
            name: platform-ca-bundle
