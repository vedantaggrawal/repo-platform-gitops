# GitHub OAuth app for the platform realm's GitHub login, consumed by
# keycloak-config-cli (env GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET). The value
# is written to OpenBao once by a human (keys client_id, client_secret):
#   bao kv put secret/platform/keycloak/idp/github client_id=<id> client_secret=<secret>
# Until then this ExternalSecret errors, no Secret exists, and the IdP keeps
# placeholder values (the config-cli env refs are optional).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-github-idp
  namespace: keycloak
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-github-idp
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: platform/keycloak/idp/github
        property: client_id
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: platform/keycloak/idp/github
        property: client_secret
