# Harbor's OIDC client secret: generated once, stored in OpenBao at
# secret/platform/keycloak/clients/harbor (client_secret), delivered to
# keycloak-config-cli (harbor-oidc in keycloak) and to Harbor core (harbor-oidc
# in harbor, as Harbor's CONFIG_OVERWRITE_JSON).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc-seed
  namespace: keycloak
spec:
  refreshPolicy: CreatedOnce
  target:
    name: harbor-oidc-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-client-secret
---
# IfNotExists: OpenBao stays the source of truth; a re-created seed never
# overwrites it.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: harbor-oidc
  namespace: keycloak
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao
  selector:
    secret:
      name: harbor-oidc-seed
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: platform/keycloak/clients/harbor
          property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc
  namespace: keycloak
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-oidc
    creationPolicy: Owner
  data:
    - secretKey: HARBOR_CLIENT_SECRET
      remoteRef:
        key: platform/keycloak/clients/harbor
        property: client_secret
---
# Harbor's OIDC settings as CONFIG_OVERWRITE_JSON (read by core at start; makes
# the configuration read-only in the UI). Rendered by ESO so the client secret
# never sits in git. Core reads it only at start: after a change, restart core
# (bump oidc-generation in the Harbor values).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-oidc
  namespace: harbor
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: harbor-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CONFIG_OVERWRITE_JSON: |-
          {
            "auth_mode": "oidc_auth",
            "oidc_name": "Keycloak",
            "oidc_endpoint": "https://local.keycloak.internal:30443/realms/platform",
            "oidc_client_id": "harbor",
            "oidc_client_secret": {{ .client_secret | toJson }},
            "oidc_scope": "openid,profile,email,groups,offline_access",
            "oidc_user_claim": "preferred_username",
            "oidc_groups_claim": "groups",
            "oidc_admin_group": "platform-admins",
            "oidc_verify_cert": true,
            "oidc_auto_onboard": true,
            "oidc_logout": true
          }
  data:
    - secretKey: client_secret
      remoteRef:
        key: platform/keycloak/clients/harbor
        property: client_secret
---
# Public platform root CA (same as keycloak/platform-ca-bundle), for Harbor's
# caBundleSecretName: added to the trust store so oidc_verify_cert works against
# the issuer's platform-ca certificate. Not secret.
