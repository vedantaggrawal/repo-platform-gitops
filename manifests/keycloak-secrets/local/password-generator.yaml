# Generates confidential-client secrets. Per client, a seed ExternalSecret runs
# it once and a PushSecret stores the result in OpenBao at
# secret/platform/keycloak/clients/<client> (IfNotExists, so OpenBao stays the
# source of truth); config-cli and the app read it back with ExternalSecrets.
# Alphanumeric only: safe in $(env:...) substitution, URLs and env files.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-client-secret
  namespace: keycloak
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
