# Keycloak's database: CloudNativePG, WAL-archived and backed up daily (backup.yaml), like the other
# platform databases. CNPG generates the keycloak-db-app Secret (username/password) Keycloak reads.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Delete=false,Prune=false
spec:
  instances: 1
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: minio
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  storage:
    size: 2Gi
    storageClass: standard
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 384Mi }
