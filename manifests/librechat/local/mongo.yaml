# MongoDB for LibreChat. The chart's bundled Bitnami MongoDB only ships amd64 images (bitnamilegacy),
# so the official multi-arch image runs here instead. Single node; LibreChat needs no replica set
# unless the Slack channel gateway is used. Backups: follow-up (mongodump to S3).
apiVersion: v1
kind: Service
metadata:
  name: librechat-mongo
spec:
  selector: { app.kubernetes.io/name: librechat-mongo }
  ports:
    - { name: mongo, port: 27017, targetPort: 27017 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: librechat-mongo
spec:
  serviceName: librechat-mongo
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: librechat-mongo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: librechat-mongo }
    spec:
      securityContext: { runAsUser: 999, runAsGroup: 999, fsGroup: 999, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mongo
          image: docker.io/library/mongo:8.0.38-noble
          args: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          envFrom:
            - secretRef: { name: librechat-mongo }
          ports:
            - { name: mongo, containerPort: 27017 }
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data/db }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
