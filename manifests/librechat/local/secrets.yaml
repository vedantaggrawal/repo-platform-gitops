# LibreChat's own secrets: generated once, kept in OpenBao (platform/librechat/app), delivered as
# librechat-credentials-env (the chart's existingSecretName) and librechat-mongo (MongoDB root user).
# CREDS_KEY / CREDS_IV must be 32 / 16 bytes in hex: derived from a random seed with sha256sum.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: librechat-random
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec: { length: 48, digits: 8, symbols: 0, noUpper: false, allowRepeat: true }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  target:
    name: librechat-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: librechat-random } }
      rewrite: [{ regexp: { source: password, target: creds_seed } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: librechat-random } }
      rewrite: [{ regexp: { source: password, target: jwt_secret } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: librechat-random } }
      rewrite: [{ regexp: { source: password, target: jwt_refresh_secret } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: librechat-random } }
      rewrite: [{ regexp: { source: password, target: meili_master_key } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: librechat-random } }
      rewrite: [{ regexp: { source: password, target: mongo_root_password } }]
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: librechat-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: librechat-seed }
  data:
    - match: { remoteRef: { remoteKey: platform/librechat/app } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-credentials-env
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: librechat-credentials-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CREDS_KEY: '{{ .creds_seed | sha256sum }}'
        CREDS_IV: '{{ printf "%s-iv" .creds_seed | sha256sum | trunc 32 }}'
        JWT_SECRET: '{{ .jwt_secret }}'
        JWT_REFRESH_SECRET: '{{ .jwt_refresh_secret }}'
        MEILI_MASTER_KEY: '{{ .meili_master_key }}'
        MONGO_URI: 'mongodb://root:{{ .mongo_root_password }}@librechat-mongo.librechat.svc.cluster.local:27017/LibreChat?authSource=admin'
  dataFrom:
    - extract: { key: platform/librechat/app }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-mongo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: librechat-mongo
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: '{{ .mongo_root_password }}'
  dataFrom:
    - extract: { key: platform/librechat/app }
