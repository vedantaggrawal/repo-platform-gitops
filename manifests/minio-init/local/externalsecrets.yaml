# MinIO credentials from OpenBao (secret/platform/minio/*, seeded by
# credentials.yaml). Nothing here holds a value.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root
  namespace: monitoring-storage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: minio-root
  data:
    - secretKey: rootUser
      remoteRef: { key: platform/minio/root, property: username }
    - secretKey: rootPassword
      remoteRef: { key: platform/minio/root, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-app-users
  namespace: monitoring-storage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: minio-app-users
  data:
    - secretKey: MIMIR_USER
      remoteRef: { key: platform/minio/mimir, property: username }
    - secretKey: MIMIR_PASSWORD
      remoteRef: { key: platform/minio/mimir, property: password }
    - secretKey: LOKI_USER
      remoteRef: { key: platform/minio/loki, property: username }
    - secretKey: LOKI_PASSWORD
      remoteRef: { key: platform/minio/loki, property: password }
    - secretKey: TEMPO_USER
      remoteRef: { key: platform/minio/tempo, property: username }
    - secretKey: TEMPO_PASSWORD
      remoteRef: { key: platform/minio/tempo, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-s3
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mimir-s3
  data:
    - secretKey: MIMIR_S3_ACCESS_KEY_ID
      remoteRef: { key: platform/minio/mimir, property: username }
    - secretKey: MIMIR_S3_SECRET_ACCESS_KEY
      remoteRef: { key: platform/minio/mimir, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: loki-s3
  data:
    - secretKey: LOKI_S3_ACCESS_KEY_ID
      remoteRef: { key: platform/minio/loki, property: username }
    - secretKey: LOKI_S3_SECRET_ACCESS_KEY
      remoteRef: { key: platform/minio/loki, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-s3
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tempo-s3
  data:
    - secretKey: TEMPO_S3_ACCESS_KEY
      remoteRef: { key: platform/minio/tempo, property: username }
    - secretKey: TEMPO_S3_SECRET_KEY
      remoteRef: { key: platform/minio/tempo, property: password }
---
# Keycloak client secret for the MinIO console login (oidc.existingClientSecretName),
# generated by manifests/keycloak-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-oidc
  namespace: monitoring-storage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: minio-oidc
  data:
    - secretKey: client_secret
      remoteRef: { key: platform/keycloak/clients/minio, property: client_secret }
