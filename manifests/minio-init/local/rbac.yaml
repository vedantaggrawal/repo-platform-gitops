# Lets the minio-init Job create (once) and read the per-app S3 credential
# Secrets in `monitoring` (consumed by mimir/loki/tempo). RBAC can't scope
# `create` by name; `get` is limited to the three Secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-init
  namespace: monitoring-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minio-init-s3-secrets
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["s3-mimir", "s3-loki", "s3-tempo"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-init-s3-secrets
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minio-init-s3-secrets
subjects:
  - kind: ServiceAccount
    name: minio-init
    namespace: monitoring-storage
