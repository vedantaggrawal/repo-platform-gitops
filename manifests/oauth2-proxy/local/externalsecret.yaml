# Credentials shared by the three oauth2-proxy releases, in the keys the chart's
# config.existingSecret expects. Generated and pushed to OpenBao by
# manifests/keycloak-secrets/local/oauth2-proxy.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: oauth2-proxy
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: oauth2-proxy
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: oauth2-proxy
        client-secret: "{{ .client_secret }}"
        cookie-secret: "{{ .cookie_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: platform/keycloak/clients/oauth2-proxy
        property: client_secret
    - secretKey: cookie_secret
      remoteRef:
        key: platform/oauth2-proxy/cookie
        property: cookie_secret
