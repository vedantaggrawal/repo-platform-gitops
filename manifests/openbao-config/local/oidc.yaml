# Human login to OpenBao via Authentik (OIDC). Members of platform-admins get policy platform-admin.
# CLI: vault login -method=oidc   UI: Method OIDC. The client secret is seeded by manifests/authentik.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-oidc-client
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: openbao-oidc-client
    creationPolicy: Owner
    template:
      data:
        client_id: openbao
        client_secret: "{{ .client_secret }}"
  dataFrom:
    - extract: { key: platform/authentik/openbao-oidc }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: platform-admin
  namespace: openbao
spec:
  authentication:
    path: kubernetes
    role: bao-config
    serviceAccount:
      name: bao-config
  policy: |
    path "secret/*" { capabilities = ["create", "read", "update", "delete", "list"] }
    path "sys/*"    { capabilities = ["create", "read", "update", "delete", "list", "sudo"] }
    path "auth/*"   { capabilities = ["create", "read", "update", "delete", "list", "sudo"] }
    path "identity/*" { capabilities = ["create", "read", "update", "delete", "list"] }
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: AuthEngineMount
metadata:
  name: oidc
  namespace: openbao
spec:
  authentication:
    path: kubernetes
    role: bao-config
    serviceAccount:
      name: bao-config
  type: oidc
  path: ""
  description: Authentik SSO
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineConfig
metadata:
  name: authentik
  namespace: openbao
spec:
  authentication:
    path: kubernetes
    role: bao-config
    serviceAccount:
      name: bao-config
  path: oidc
  OIDCDiscoveryURL: https://authentik.local.evelab.space:30443/application/o/openbao/
  OIDCClientID: openbao
  OIDCCredentials:
    secret: { name: openbao-oidc-client }
    usernameKey: client_id
    passwordKey: client_secret
  defaultRole: platform-admin
---
apiVersion: redhatcop.redhat.io/v1alpha1
kind: JWTOIDCAuthEngineRole
metadata:
  name: platform-admin
  namespace: openbao
spec:
  authentication:
    path: kubernetes
    role: bao-config
    serviceAccount:
      name: bao-config
  path: oidc
  name: platform-admin
  roleType: oidc
  userClaim: email
  groupsClaim: groups
  boundAudiences: [openbao]
  boundClaims:
    groups: [platform-admins]
  OIDCScopes: [openid, email, profile]
  allowedRedirectURIs:
    - https://local.openbao.internal:30443/ui/vault/auth/oidc/oidc/callback
    - https://openbao.local.evelab.space:30443/ui/vault/auth/oidc/oidc/callback
    - https://openbao.evelab.space/ui/vault/auth/oidc/oidc/callback
    - http://localhost:8250/oidc/callback
  tokenPolicies: [platform-admin]
  tokenTTL: 1h
  tokenMaxTTL: 8h
