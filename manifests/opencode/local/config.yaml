# OpenCode server config in the syntax of the running version (1.19.6 docs: providers, config, mcp-servers).
# Only the in-cluster Ollama is enabled; the built-in hosted provider is disabled (and egress.yaml blocks it at the
# network). Read-only tools are MCP servers (mcp.yaml). Option C later: add a hosted provider here and allow its
# FQDN in egress.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "enabled_providers": [
        "ollama"
      ],
      "disabled_providers": [
        "opencode"
      ],
      "model": "ollama/qwen2.5-coder:3b",
      "small_model": "ollama/llama3.2:3b",
      "share": "disabled",
      "autoupdate": false,
      "provider": {
        "ollama": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Ollama (in-cluster)",
          "options": {
            "baseURL": "http://local-ollama.ollama.svc.cluster.local:11434/v1"
          },
          "models": {
            "qwen2.5-coder:3b": {
              "name": "Qwen2.5 Coder 3B"
            },
            "llama3.2:3b": {
              "name": "Llama 3.2 3B"
            }
          }
        }
      },
      "mcp": {
        "kubernetes": {
          "type": "remote",
          "url": "http://mcp-kubernetes.opencode.svc.cluster.local:8080/mcp",
          "enabled": true
        },
        "grafana": {
          "type": "remote",
          "url": "http://mcp-grafana.opencode.svc.cluster.local:8000/mcp",
          "enabled": true
        },
        "gitea": {
          "type": "remote",
          "url": "http://mcp-gitea.opencode.svc.cluster.local:8080/mcp",
          "enabled": true
        }
      }
    }
