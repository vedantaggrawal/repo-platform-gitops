# OpenCode server config: models from the in-cluster Ollama (discovered via /v1); read-only tools as MCP
# servers (mcp.yaml). Swap the model to a hosted one later with a provider block here (option C).
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "providers": {
        "ollama": {
          "settings": { "baseURL": "http://local-ollama.ollama.svc.cluster.local:11434/v1" }
        }
      },
      "mcp": {
        "servers": {
          "kubernetes": { "type": "remote", "url": "http://mcp-kubernetes.opencode.svc.cluster.local:8080/mcp" },
          "grafana":    { "type": "remote", "url": "http://mcp-grafana.opencode.svc.cluster.local:8000/mcp" },
          "gitea":      { "type": "remote", "url": "http://mcp-gitea.opencode.svc.cluster.local:8080/mcp" }
        }
      }
    }
