# OpenCode in the cluster: the same server that powers the TUI serves the web UI; clients connect with
# `opencode --server https://code.evelab.space` (Basic auth user opencode, password from OpenBao).
# Browsers pass Authentik forward auth first (SecurityPolicy in manifests/routes/local/opencode-auth.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  labels: { app.kubernetes.io/name: opencode }
spec:
  replicas: 1
  strategy: { type: Recreate }   # one RWO workspace
  selector:
    matchLabels: { app.kubernetes.io/name: opencode }
  template:
    metadata:
      labels: { app.kubernetes.io/name: opencode }
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: clone
          image: alpine/git:2.47.2
          command: [sh, -c]
          args:
            - |
              set -e
              cd /workspace
              [ -d repo-platform-gitops/.git ] || git clone --depth 50 https://github.com/vedantaggrawal/repo-platform-gitops.git
              cd repo-platform-gitops && git pull --ff-only || true
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:1.19.6
          args: [serve, --hostname, "0.0.0.0", --port, "4096"]
          workingDir: /workspace/repo-platform-gitops
          env:
            - name: OPENCODE_PASSWORD
              valueFrom: { secretKeyRef: { name: opencode-server, key: password } }
            - { name: HOME, value: /home/opencode }
          ports:
            - { name: http, containerPort: 4096 }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: home, mountPath: /home/opencode }
            - { name: config, mountPath: /home/opencode/.config/opencode/opencode.json, subPath: opencode.json }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: workspace
          persistentVolumeClaim: { claimName: opencode-workspace }
        - name: home
          emptyDir: {}
        - name: config
          configMap: { name: opencode-config }
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
spec:
  selector: { app.kubernetes.io/name: opencode }
  ports:
    - { name: http, port: 4096, targetPort: http }
