# The agent's data stays in the cluster: pods in this namespace may only talk to in-cluster services,
# DNS, GitHub (workspace clone) and the npm registry (OpenCode installs provider SDK packages).
# Hosted model endpoints (opencode.ai, any LLM API) are unreachable by default; a hosted model (option C,
# later) is a deliberate one-line addition here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-cluster-only
spec:
  endpointSelector: {}
  egress:
    - toEntities: [cluster]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: github.com
        - matchName: codeload.github.com
        - matchName: registry.npmjs.org
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
