# Server password for OpenCode's web UI/API (Basic auth user `opencode`): generated once, kept in OpenBao
# at platform/opencode/server (key password), delivered as Secret opencode-server.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: opencode-server-password
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec: { length: 32, digits: 8, symbols: 0, noUpper: false, allowRepeat: true }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-server-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshPolicy: CreatedOnce
  target:
    name: opencode-server-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: opencode-server-password } }
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencode-server
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: opencode-server-seed }
  data:
    - match: { remoteRef: { remoteKey: platform/opencode/server } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencode-server
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: opencode-server
    creationPolicy: Owner
  dataFrom:
    - extract: { key: platform/opencode/server }
