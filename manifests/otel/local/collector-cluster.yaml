# otel-cluster — StatefulSet + Target Allocator. Replaces Alloy pipelines 1
# (ServiceMonitor/PodMonitor scrape), 2 (apiserver/kubelet/cadvisor/coredns, now
# covered by the kube-prometheus-stack SMs) and 5 (remote_write to Mimir). The TA
# discovers the SM/PM objects and shards them across the collector's prometheus
# receiver.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-cluster
  namespace: opentelemetry-operator
spec:
  mode: statefulset
  replicas: 1
  priorityClassName: platform-critical
  # The worker can fill up (demo workloads); this pipeline (traces, cluster
  # metrics, SLO inputs) must always schedule, so it may use the control-plane node.
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  # contrib distro — needed for the prometheus receiver + prometheusremotewrite
  # exporter, which the operator-default opentelemetry-collector-k8s image omits.
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.158.0
  serviceAccount: otel-cluster
  # Disable the operator-generated NetworkPolicy: its egress rule is an ipBlock to
  # the apiserver node IP (172.18.0.2:6443), which Cilium treats as the special
  # `host` entity and an ipBlock cannot match — so the Target Allocator's
  # informers can't reach the API and hang. Network policy is managed separately.
  networkPolicy:
    enabled: false
  # Bounded so scraping cadvisor (high-cardinality) + remote_write buffering
  # can't OOM the node; memory_limiter (below) applies backpressure at 80%.
  # At 512Mi the memory_limiter soft limit (~282MiB) sat below the working heap
  # (~386MiB): it refused ~20% of points and the pod still OOMKilled. 1Gi gives a
  # ~563MiB soft limit. GOMEMLIMIT matches the limiter's hard limit (80%) instead
  # of the operator's default of 100% of the container limit.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  env:
    - name: GOMEMLIMIT
      value: 820MiB
  observability:
    metrics:
      enableMetrics: true
  targetAllocator:
    enabled: true
    serviceAccount: otel-cluster-ta
    # Empty selectors = discover every ServiceMonitor/PodMonitor in the cluster
    # (cilium, hubble, kube-state-metrics, cert-manager, the otel collectors, …).
    prometheusCR:
      enabled: true
      serviceMonitorSelector: {}
      podMonitorSelector: {}
  config:
    receivers:
      # Traces from otel-agent (tail sampling needs every span of a trace here).
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      prometheus:
        config:
          # Jobs come from ServiceMonitors/PodMonitors via the TA, except the kubelet:
          # it has no Service without prometheus-operator, so it is scraped here by
          # node discovery. Labels match the kube-prometheus-stack ServiceMonitor the
          # mixin dashboards and rules were written for (job="kubelet", metrics_path, node).
          scrape_configs:
            - job_name: kubelet
              scheme: https
              kubernetes_sd_configs: [{role: node}]
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt, insecure_skip_verify: true}
              honor_labels: true
              relabel_configs:
                - {source_labels: [__meta_kubernetes_node_name], target_label: node}
                - {source_labels: [__metrics_path__], target_label: metrics_path}
              metric_relabel_configs:
                - {source_labels: [__name__], regex: kubelet_runtime_operations_duration_seconds_bucket, action: drop}
            - job_name: kubelet-cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              kubernetes_sd_configs: [{role: node}]
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt, insecure_skip_verify: true}
              honor_labels: true
              relabel_configs:
                - {target_label: job, replacement: kubelet}
                - {source_labels: [__meta_kubernetes_node_name], target_label: node}
                - {source_labels: [__metrics_path__], target_label: metrics_path}
              metric_relabel_configs:
                - {source_labels: [__name__], regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)', action: drop}
                - {source_labels: [__name__], regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)', action: drop}
                - {source_labels: [__name__], regex: 'container_memory_(mapped_file|swap)', action: drop}
                - {source_labels: [__name__], regex: 'container_(file_descriptors|tasks_state|threads_max)', action: drop}
                - {source_labels: [__name__], regex: 'container_spec.*', action: drop}
                - {source_labels: [__name__], regex: '(container_memory_failures_total|container_blkio_device_usage_total)', action: drop}
            - job_name: kubelet-probes
              scheme: https
              metrics_path: /metrics/probes
              kubernetes_sd_configs: [{role: node}]
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt, insecure_skip_verify: true}
              honor_labels: true
              relabel_configs:
                - {target_label: job, replacement: kubelet}
                - {source_labels: [__meta_kubernetes_node_name], target_label: node}
                - {source_labels: [__metrics_path__], target_label: metrics_path}
              metric_relabel_configs:
                - {source_labels: [__name__], regex: prober_probe_duration_seconds_bucket, action: drop}
    # RED metrics and the service graph are derived from the unsampled stream
    # (traces/in), before tail_sampling, so sampling does not bias them.
    connectors:
      forward/sample: {}
      spanmetrics:
        dimensions:
          - name: x-tenant-id
          - name: x-tier
        exemplars:
          enabled: true
        histogram:
          explicit:
            buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
      servicegraph:
        latency_histogram_buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      # Keep errors, slow traces and 401/403/429; drop /healthz; 10% of the rest.
      # Top-level policies are OR'd; a drop policy match always wins. Single
      # replica only: all spans of a trace must reach one instance.
      tail_sampling:
        decision_wait: 10s
        num_traces: 10000
        policies:
          - name: drop-healthz
            type: drop
            drop:
              drop_sub_policy:
                - name: healthz-route
                  type: string_attribute
                  string_attribute: {key: http.route, values: [/healthz]}
                - name: healthz-path
                  type: string_attribute
                  string_attribute: {key: url.path, values: [/healthz]}
          - name: errors
            type: status_code
            status_code: {status_codes: [ERROR]}
          - name: slow
            type: latency
            latency: {threshold_ms: 500}
          - name: rejections
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - 'attributes["http.response.status_code"] == 401 or attributes["http.response.status_code"] == 403 or attributes["http.response.status_code"] == 429 or attributes["http.status_code"] == 401 or attributes["http.status_code"] == 403 or attributes["http.status_code"] == 429'
          - name: baseline
            type: probabilistic
            probabilistic: {sampling_percentage: 10}
    exporters:
      # Sampled traces -> Tempo (native OTLP).
      otlp/tempo:
        endpoint: local-tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
      prometheusremotewrite/mimir:
        endpoint: http://local-mimir-nginx.monitoring.svc.cluster.local/api/v1/push
        headers:
          X-Scope-OrgID: anonymous
    service:
      telemetry:
        logs:
          encoding: json
      pipelines:
        traces/in:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [spanmetrics, servicegraph, forward/sample]
        traces/sample:
          receivers: [forward/sample]
          processors: [tail_sampling, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [prometheus, spanmetrics, servicegraph]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite/mimir]
