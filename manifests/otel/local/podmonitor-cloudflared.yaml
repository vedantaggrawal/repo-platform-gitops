# Cloudflare Tunnel connector health (connections, requests, errors) from each cloudflared pod's :2000.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: opentelemetry-operator
spec:
  namespaceSelector:
    matchNames: [cloudflared]
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
