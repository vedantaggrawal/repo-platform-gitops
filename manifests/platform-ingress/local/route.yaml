# In-cluster access to the platform's public hosts. Browsers reach
# https://local.<app>.internal:30443 through kind's host port mapping, which
# pods can't use. This Service gives those hosts a stable in-cluster address
# (fixed ClusterIP, port 30443) whose endpoint is Cilium's Envoy listener
# (:443, hostNetwork) on the ingress node; Envoy routes every *.internal host
# by SNI. CoreDNS (coredns.yaml) resolves local.*.internal to it, so OIDC
# clients use the same issuer URL as browsers.
# The endpoint is the ingress-ready node's IP (kind control-plane 172.18.0.2);
# re-check it after a cluster recreate.
apiVersion: v1
kind: Service
metadata:
  name: platform-ingress
  namespace: kube-system
spec:
  clusterIP: 10.96.0.200
  ports:
    - name: https
      port: 30443
      targetPort: 443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: platform-ingress-nodes
  namespace: kube-system
  labels:
    kubernetes.io/service-name: platform-ingress
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
endpoints:
  # Only nodes labelled ingress-ready=true run the Envoy listener (control-plane).
  - addresses: ["172.18.0.2"]
