# Every request to Chroma is checked with Authentik's outpost (forward auth): browsers get a login,
# API clients send `Authorization: Bearer <JWT from the chromadb OAuth2 provider>` (JWT federation).
# Replaces the Envoy JWT policy so one gate serves both.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: chromadb
  namespace: chromadb
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: chromadb}
  extAuth:
    headersToExtAuth: [cookie, authorization]
    http:
      backendRefs:
        - {group: "", kind: Service, name: local-authentik-server, namespace: authentik, port: 80}
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend: [x-authentik-username, x-authentik-groups, x-authentik-email, x-authentik-uid]
