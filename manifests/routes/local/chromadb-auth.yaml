# JWT auth for Chroma's API behind the gateway: a Bearer token from Authentik's chromadb provider.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: chromadb
  namespace: chromadb
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: chromadb}
  jwt:
    # Authentik's issuer is the host the token was requested from; accept the public and the
    # canonical cluster name (any provider matching = allowed). Same JWKS for both.
    providers:
      - name: authentik-public
        issuer: https://authentik.evelab.space/application/o/chromadb/
        audiences: [chromadb]
        remoteJWKS:
          uri: http://local-authentik-server.authentik.svc.cluster.local/application/o/chromadb/jwks/
          cacheDuration: 300s
      - name: authentik-local
        issuer: https://authentik.local.evelab.space:30443/application/o/chromadb/
        audiences: [chromadb]
        remoteJWKS:
          uri: http://local-authentik-server.authentik.svc.cluster.local/application/o/chromadb/jwks/
          cacheDuration: 300s
