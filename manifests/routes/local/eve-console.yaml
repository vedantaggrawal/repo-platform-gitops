apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eve-console
  namespace: eve-console
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: platform, namespace: envoy-gateway-system, sectionName: https}
  hostnames: [app.evelab.space, app.local.evelab.space]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: eve-console, port: 80, weight: 1}]
