# Public endpoint for browser telemetry (Faro SDK in the eve console) -> otel-faro collector.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: faro
  namespace: opentelemetry-operator
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: platform, namespace: envoy-gateway-system, sectionName: https}
  hostnames: [faro.evelab.space, faro.local.evelab.space]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: otel-faro-collector, port: 8081, weight: 1}]
