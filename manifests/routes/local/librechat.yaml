apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: librechat
  namespace: librechat
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: platform, namespace: envoy-gateway-system, sectionName: https}
  hostnames: [librechat.local.evelab.space, librechat.evelab.space]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: librechat, port: 3080, weight: 1}]
