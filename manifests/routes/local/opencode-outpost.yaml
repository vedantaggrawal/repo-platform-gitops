# Forward auth: Authentik's outpost must answer /outpost.goauthentik.io on the app's own host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode-outpost
  namespace: opencode
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: platform, namespace: envoy-gateway-system, sectionName: https}
  hostnames: [code.local.evelab.space, code.evelab.space]
  rules:
    - matches: [{path: {type: PathPrefix, value: /outpost.goauthentik.io}}]
      backendRefs: [{group: "", kind: Service, name: local-authentik-server, namespace: authentik, port: 80, weight: 1}]
