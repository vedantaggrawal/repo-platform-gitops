apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencode
  namespace: opencode
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: platform, namespace: envoy-gateway-system, sectionName: https}
  hostnames: [code.local.evelab.space, code.evelab.space]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: opencode, port: 4096, weight: 1}]
