# Lets the forward-auth routes and policies in other namespaces reference Authentik's Service.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: forward-auth
  namespace: authentik
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: opencost}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: kube-system}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: opencost}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: kube-system}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: headlamp}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: headlamp}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: chromadb}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: chromadb}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: opencode}
    - {group: gateway.envoyproxy.io, kind: SecurityPolicy, namespace: opencode}
  to:
    - {group: "", kind: Service, name: local-authentik-server}
