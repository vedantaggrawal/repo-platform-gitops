# Mimir's Alertmanager fallback config, rendered by ESO with the Slack webhook inline (OpenBao
# platform/alerting/slack, key webhook_url). Mimir 2.17 rejects api_url_file, so the URL cannot be a
# mounted file; the whole config is the secret instead. Mimir reads it via
# alertmanager.fallback_config_file (platform-apps/observability/mimir/local/values.yaml).
# Watchdog goes to "null" until the heartbeat check exists (platform/alerting/heartbeat).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-slack
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: alert-slack
    creationPolicy: Owner
    template:
      data:
        webhook_url: "{{ .webhook_url }}"
        alertmanager.yaml: |
          route:
            receiver: "null"
            group_by: [alertname, namespace, service]
            routes:
              - matchers: [alertname="Watchdog"]
                receiver: "null"
              # Every critical/warning group also becomes a Gitea issue (alert-intake), then Slack below.
              - matchers: [severity=~"critical|warning"]
                receiver: gitea
                continue: true
                repeat_interval: 12h
              - matchers: [severity="critical"]
                receiver: slack
                repeat_interval: 1h
              - matchers: [severity="warning"]
                receiver: slack
                repeat_interval: 4h
          receivers:
            - name: "null"
            - name: gitea
              webhook_configs:
                - url: http://alert-intake.gitea.svc.cluster.local:8080/
                  send_resolved: true
            - name: slack
              slack_configs:
                - api_url: "{{ .webhook_url }}"
                  send_resolved: true
                  # Alertmanager templates are passed through ESO's renderer as raw strings (backticks).
                  color: '{{ `{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}` }}'
                  title: '{{ `[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }}){{ with .CommonLabels.namespace }} in {{ . }}{{ end }}` }}'
                  title_link: https://grafana.evelab.space/alerting/list
                  text: |-
                    {{ `{{ range .Alerts }}*{{ .Labels.alertname }}*{{ with .Annotations.summary }}: {{ . }}{{ end }}
                    {{ with .Annotations.description }}{{ . }}
                    {{ end }}• *where:* {{ with .Labels.layer }}layer={{ . }} {{ end }}{{ with .Labels.service }}service={{ . }} {{ end }}{{ with .Labels.namespace }}ns={{ . }} {{ end }}{{ with .Labels.pod }}pod={{ . }} {{ end }}{{ with .Labels.container }}container={{ . }} {{ end }}{{ with .Labels.instance }}instance={{ . }} {{ end }}{{ with .Labels.job }}job={{ . }}{{ end }}
                    • *since:* {{ .StartsAt.Format "2006-01-02 15:04 UTC" }}{{ if eq .Status "resolved" }} → resolved {{ .EndsAt.Format "15:04 UTC" }}{{ end }}
                    • *labels:* {{ range .Labels.SortedPairs }}{{ if not (or (eq .Name "alertname") (eq .Name "severity")) }}`+"`"+`{{ .Name }}={{ .Value }}`+"`"+` {{ end }}{{ end }}
                    {{ with .Annotations.runbook_url }}• *runbook:* {{ . }}
                    {{ end }}
                    {{ end }}` }}
  dataFrom:
    - extract: { key: platform/alerting/slack }
