# Mimir's Alertmanager fallback config, rendered by ESO with the Slack webhook inline (OpenBao
# platform/alerting/slack, key webhook_url). Mimir 2.17 rejects api_url_file, so the URL cannot be a
# mounted file; the whole config is the secret instead. Mimir reads it via
# alertmanager.fallback_config_file (platform-apps/observability/mimir/local/values.yaml).
# Watchdog goes to "null" until the heartbeat check exists (platform/alerting/heartbeat).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-slack
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: alert-slack
    creationPolicy: Owner
    template:
      data:
        webhook_url: "{{ .webhook_url }}"
        alertmanager.yaml: |
          route:
            receiver: "null"
            group_by: [alertname, namespace, service]
            routes:
              - matchers: [alertname="Watchdog"]
                receiver: "null"
              - matchers: [severity="critical"]
                receiver: slack
                repeat_interval: 1h
              - matchers: [severity="warning"]
                receiver: slack
                repeat_interval: 4h
          receivers:
            - name: "null"
            - name: slack
              slack_configs:
                - api_url: "{{ .webhook_url }}"
                  send_resolved: true
  dataFrom:
    - extract: { key: platform/alerting/slack }
