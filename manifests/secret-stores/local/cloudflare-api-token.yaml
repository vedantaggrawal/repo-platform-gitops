# Cloudflare zone DNS-edit token for cert-manager's DNS-01 solver (ClusterIssuers letsencrypt*).
# Lives in cert-manager's namespace: ClusterIssuers read secrets from --cluster-resource-namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  dataFrom:
    - extract: { key: platform/dns-provider/cloudflare }
