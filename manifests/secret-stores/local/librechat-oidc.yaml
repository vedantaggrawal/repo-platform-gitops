# LibreChat's namespace (declared here so the OIDC client secret can land before the chart app) and the
# consumer of the secret seeded by manifests/authentik/local/librechat-oidc.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: librechat
  labels:
    eve.io/layer: addons
    eve.io/tenant: platform   # same labels the platform ApplicationSet sets; avoids drift between the two apps
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-oidc
  namespace: librechat
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: librechat-oidc
    creationPolicy: Owner
  dataFrom:
    - extract: { key: platform/authentik/librechat-oidc }
