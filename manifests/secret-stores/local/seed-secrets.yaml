# Human-issued credentials seeded by Terraform (repo-platform, from tfvars) as
# Secrets in namespace platform-seed, copied into OpenBao here. Apps never read
# platform-seed: ESO delivers from OpenBao. Replace keeps OpenBao in step with
# tfvars (rotation = change tfvars + terraform apply); nothing is ever deleted.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik-github-oauth
  namespace: platform-seed
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 5m
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: authentik-github-oauth }
  data:
    - match: { remoteRef: { remoteKey: platform/authentik/github } }
---
# Slack webhook for Mimir Alertmanager (tfvar alert_slack_webhook).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: alert-slack
  namespace: platform-seed
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 5m
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: alert-slack }
  data:
    - match: { remoteRef: { remoteKey: platform/alerting/slack } }
