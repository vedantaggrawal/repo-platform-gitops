# Public root certificate of the platform CA (not secret), from the
# cert-manager/platform-root-ca Secret (manifests/cert-issuers), written by
# trust-manager to ConfigMap platform-ca-bundle (key ca.crt) in every
# namespace, including new ones, like kube-root-ca.crt. Mount it where clients
# must trust platform-ca certificates (e.g. OIDC clients of Keycloak). A
# renewed root propagates automatically.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: platform-ca-bundle
  annotations:
    # The Bundle CRD comes from the trust-manager app (wave -1).
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sources:
    - secret:
        name: platform-root-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
