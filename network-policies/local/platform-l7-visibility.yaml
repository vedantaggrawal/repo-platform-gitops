# L7 visibility for Hubble: every pod in these namespaces keeps allow-all ingress (rule 1, no L3/L4
# change) and gets HTTP parsing on its HTTP port(s) (rule 2), so `hubble observe --protocol http` and the
# hubble_http_* metrics (httpV2 in the Cilium values) show method/path/status per request. Pattern from
# webserver-l7-visibility.yaml. Not for storage/DB ports: parsing costs CPU and those are not HTTP.
# Not for Authentik: the Cilium proxy rewrites X-Forwarded-Proto to http, and Authentik then advertises
# http:// OIDC endpoints (issuer mismatch in Argo CD, OpenBao, Gitea). Incident 2026-11-22.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: l7-visibility
  namespace: gitea
spec:
  endpointSelector: {}
  ingress:
    - fromEntities: [all]
    - toPorts:
        - ports:
            - { port: "3000", protocol: TCP }
          rules:
            http:
              - {}
---
