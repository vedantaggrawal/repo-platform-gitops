# JupyterHub — multi-user Jupyter notebooks. Chart 4.4.5 = JupyterHub 5.5.5 (arm64 images).
# Sign-in via Authentik (OIDC, GenericOAuthenticator): platform-admins are hub admins; platform-dev and
# platform-viewer get a notebook server. The client secret is the Secret jupyterhub-oidc
# (manifests/secret-stores, seeded in OpenBao by manifests/authentik).
# Reached at https://jupyter.evelab.space (public, via the tunnel) and https://jupyter.local.evelab.space:30443.
hub:
  config:
    JupyterHub:
      authenticator_class: generic-oauth
    GenericOAuthenticator:
      client_id: jupyterhub
      oauth_callback_url: https://jupyter.evelab.space/hub/oauth_callback
      authorize_url: https://authentik.evelab.space/application/o/authorize/
      # Token and user info are fetched in-cluster (no hairpin through the tunnel).
      token_url: http://local-authentik-server.authentik.svc.cluster.local/application/o/token/
      userdata_url: http://local-authentik-server.authentik.svc.cluster.local/application/o/userinfo/
      scope: [openid, email, profile]
      username_claim: preferred_username
      claim_groups_key: groups
      allowed_groups: [platform-admins, platform-dev, platform-viewer]
      admin_groups: [platform-admins]
      manage_groups: true
  extraEnv:
    OAUTH_CLIENT_SECRET:
      valueFrom:
        secretKeyRef: { name: jupyterhub-oidc, key: client_secret }
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

proxy:
  service:
    type: ClusterIP   # HTTPRoute in manifests/routes/local/jupyterhub.yaml
  chp:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }

singleuser:
  image:
    name: quay.io/jupyter/scipy-notebook
    tag: "2026-11-23"
  memory:
    guarantee: 512M
    limit: 2G
  cpu:
    limit: 1
  storage:
    type: dynamic
    capacity: 2Gi
    dynamic:
      storageClass: standard

# Not useful on a single-node kind cluster.
scheduling:
  userScheduler:
    enabled: false
prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false

cull:
  enabled: true
  timeout: 3600   # stop idle notebook servers after 1h
