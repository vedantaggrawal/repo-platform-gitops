# Authelia: the platform's identity provider (own users and groups, 2FA,
# OpenID Connect). Secrets are not generated by the chart (its `lookup` is empty
# under Argo CD, so they'd change every sync): they come from
# manifests/authelia (External Secrets + cert-manager) and are mounted by name.
# Adding an app: one entry under configMap.identity_providers.oidc.clients.

pod:
  kind: Deployment
  replicas: 1   # SQLite storage and in-memory sessions: single instance
  strategy:
    type: Recreate
  securityContext:
    container:
      runAsUser: 8000
      runAsGroup: 8000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
    pod:
      fsGroup: 8000
  extraVolumes:
    - name: authelia-url
      configMap: { name: authelia-url }
  extraVolumeMounts:
    - { name: authelia-url, mountPath: /config-extra, readOnly: true }

# The chart's own Secret stays empty: every key below points at our Secrets
# (mounted at /secrets/<name>), so nothing is regenerated on sync.
secret:
  additionalSecrets:
    authelia-keys: {}
    authelia-jwk: {}
    authelia-users: {}

persistence:
  enabled: true
  storageClass: standard
  size: 1Gi
  annotations:
    # 2FA enrolments live here: keep them if the app is ever removed.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false

ingress:
  enabled: true
  className: cilium
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
    cert-manager.io/usages: "digital signature,key encipherment,server auth"
  tls:
    enabled: true
    secret: authelia-tls

configMap:
  # The chart builds authelia_url without a port; this file (rendered below)
  # overrides session.cookies with the :30443 URL browsers use.
  extraConfigs: [/config-extra/session.yml]
  log:
    format: json
  theme: auto
  authentication_backend:
    # Passwords are hashes held in OpenBao: change them there, not in the UI.
    password_reset: { disable: true }
    password_change: { disable: true }
    file:
      enabled: true
      path: /secrets/authelia-users/users_database.yml
  access_control:
    default_policy: two_factor
  identity_validation:
    reset_password:
      secret: { secret_name: authelia-keys, path: jwt }
  session:
    encryption_key: { secret_name: authelia-keys, path: session }
    cookies:
      - domain: local.authelia.internal   # also the ingress host
  storage:
    encryption_key: { secret_name: authelia-keys, path: storage }
    local:
      enabled: true
      path: /config/db.sqlite3
  notifier:
    # No mail server: 2FA enrolment codes are written here.
    filesystem:
      enabled: true
      filename: /config/notification.txt
  totp:
    issuer: platform
  identity_providers:
    oidc:
      enabled: true
      hmac_secret: { secret_name: authelia-keys, path: oidc-hmac }
      jwks:
        - key_id: main
          algorithm: RS256
          use: sig
          key: { path: /secrets/authelia-jwk/tls.key }
      clients:
        - client_id: grafana
          client_name: Grafana
          public: true
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris: [https://local.grafana.internal:30443/login/generic_oauth]
          scopes: [openid, profile, email, groups]
        - client_id: argocd
          client_name: Argo CD
          public: true
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://local.argocd.internal:30443/auth/callback
            - http://localhost:8085/auth/callback   # argocd login --sso
          scopes: [openid, profile, email, groups, offline_access]
          grant_types: [authorization_code, refresh_token]
          response_types: [code]
        - client_id: kargo
          client_name: Kargo
          public: true
          require_pkce: true
          pkce_challenge_method: S256
          # UI only. The CLI's `--sso` callback uses localhost on a random port,
          # which needs a loopback-port check against Authelia first.
          redirect_uris: [https://local.kargo.internal:30443/login]
          # Kargo asks for offline_access when the provider advertises it.
          scopes: [openid, profile, email, groups, offline_access]
          grant_types: [authorization_code, refresh_token]
          response_types: [code]

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: authelia-url
    data:
      session.yml: |
        session:
          cookies:
            - domain: local.authelia.internal
              authelia_url: https://local.authelia.internal:30443
