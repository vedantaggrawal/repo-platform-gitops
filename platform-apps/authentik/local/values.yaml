# Authentik: the platform's identity provider. Own users and groups, 2FA,
# GitLab login, OpenID Connect for apps, forward-auth for apps without a login.
# Everything it manages (groups, apps, the GitLab source) is declared as
# blueprints in manifests/authentik/local/blueprints, which Authentik applies
# and keeps applied. Secrets come from that directory too, never from the chart.

global:
  # Secrets as env: these take precedence over the empty values the chart puts
  # in its own config Secret (loaded with envFrom).
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom: { secretKeyRef: { name: authentik-keys, key: secret_key } }
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom: { secretKeyRef: { name: authentik-db-app, key: password } }
    # First start only: creates the `akadmin` break-glass user with this password.
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom: { secretKeyRef: { name: authentik-keys, key: bootstrap_password } }
    # GitLab login (blueprints/gitlab.yaml reads these). Optional: until the
    # OAuth app's credentials are in OpenBao, the GitLab button doesn't work.
    - name: GITLAB_CLIENT_ID
      valueFrom: { secretKeyRef: { name: authentik-gitlab, key: client_id, optional: true } }
    - name: GITLAB_CLIENT_SECRET
      valueFrom: { secretKeyRef: { name: authentik-gitlab, key: client_secret, optional: true } }

authentik:
  error_reporting:
    enabled: false
  postgresql:
    # CNPG cluster in manifests/authentik/local/database.yaml.
    host: authentik-db-rw
    name: authentik
    user: authentik

blueprints:
  configMaps: [authentik-blueprints]

server:
  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: platform-ca
      cert-manager.io/usages: "digital signature,key encipherment,server auth"
    hosts: [local.authentik.internal]
    tls:
      - secretName: authentik-tls
        hosts: [local.authentik.internal]

postgresql:
  enabled: false
