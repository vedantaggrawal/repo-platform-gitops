# Authentik: the platform's identity provider. Own users and groups, 2FA,
# GitHub login, OpenID Connect for apps, forward-auth for apps without a login.
# What it manages (groups, apps, GitHub login) is declared as blueprints in
# manifests/authentik/local, applied when a blueprint file is added or changes.
# Secrets come from that directory too, never from the chart.

global:
  # Secrets as env: these take precedence over the empty values the chart puts
  # in its own config Secret (loaded with envFrom).
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom: { secretKeyRef: { name: authentik-keys, key: secret_key } }
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom: { secretKeyRef: { name: authentik-db-app, key: password } }
    # First start only: creates the `akadmin` break-glass user with this password.
    - name: AUTHENTIK_BOOTSTRAP_PASSWORD
      valueFrom: { secretKeyRef: { name: authentik-keys, key: bootstrap_password } }

authentik:
  error_reporting:
    enabled: false
  postgresql:
    # CNPG cluster in manifests/authentik/local/database.yaml.
    host: authentik-db-rw
    name: authentik
    user: authentik
    sslmode: require   # CNPG serves TLS by default

blueprints:
  configMaps: [authentik-blueprints]

worker:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  # GitHub login blueprint, rendered with its credentials by External Secrets.
  # Optional: until the credentials are in OpenBao there's no GitHub button.
  # A credential change changes the file, so the blueprint is applied again.
  volumes:
    - name: blueprint-github
      secret: { secretName: authentik-blueprint-github, optional: true }
  volumeMounts:
    - { name: blueprint-github, mountPath: /blueprints/mounted/github, readOnly: true }

server:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  # Logo/favicon (ConfigMap authentik-branding, manifests/authentik/local/branding/),
  # served at /static/dist/custom/<file>. Optional: the server starts without it.
  volumes:
    - name: branding
      configMap: { name: authentik-branding, optional: true }
  volumeMounts:
    - { name: branding, mountPath: /web/dist/custom, readOnly: true }
  ingress:
    enabled: false
  # Route on the Envoy Gateway.
  route:
    main:
      enabled: true
      parentRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: platform, namespace: envoy-gateway-system, sectionName: https}]
      hostnames: [local.authentik.internal]
      matches: [{path: {type: PathPrefix, value: /}}]

postgresql:
  enabled: false

# Scraped by the otel-cluster target allocator (any ServiceMonitor), 60s like every platform target.
server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
worker:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
