# -- Cilium CNI for Kind with kube-proxy replacement --

# Replace kube-proxy with eBPF datapath
kubeProxyReplacement: true

# Kind-critical: API server reachable by container name since kube-proxy is disabled

# IPAM
ipam:
  mode: kubernetes

# Host networking features
hostPort:
  enabled: true
externalIPs:
  enabled: true
nodePort:
  enabled: true

# Image pull policy for local dev
image:
  pullPolicy: IfNotPresent

# Operator (one block: a duplicate `operator:` key silently replaced this one)
operator:
  replicas: 1
  # Restart on config change; otherwise a stale operator keeps old settings
  # (e.g. it kept recreating the ingress CiliumEnvoyConfig after ingress was off).
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

# Restart agents/envoy when cilium-config changes (Helm upgrades only edit the ConfigMap).
rollOutCiliumPods: true

# -- Ingress: off. Envoy Gateway (Gateway API) serves north-south on the
# ingress-ready node's 443/80; routes live with each app. --
ingressController:
  enabled: false

# -- Hubble Observability --
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    # Served by the HTTPRoute in manifests/routes/local/ (Envoy Gateway).
    ingress:
      enabled: false
  metrics:
    enabled:
      - dns:query;rcode;ips;qtypes;rrtypes;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
      - drop:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
      - tcp:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
      - flow:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
      - icmp:sourceContext=namespace;destinationContext=namespace;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
      - httpV2:exemplars=true;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
      namespace: monitoring
      annotations:
        grafana_folder: Cilium

# -- Gateway API: off. Envoy Gateway is the Gateway API controller; Cilium's
# would also need the CRDs before it starts, and Argo installs them later. --
gatewayAPI:
  enabled: false

# L7 proxy is enabled by default, explicit for clarity
l7Proxy: true

# Mutual authentication (SPIFFE-based identity)
authentication:
  mutual:
    spire:
      enabled: false  # enable when SPIRE server is deployed

# Cilium agent and operator Prometheus metrics + ServiceMonitors
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true

envoy:
  rollOutPods: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
