# Envoy Gateway controller, deployed by argocd-apps/templates/app-envoy-gateway.yaml
# (not the platform AppSet: the chart's crds/ bundles CRDs owned by app-gateway-crds, so it
# needs helm.skipCrds, which the AppSet template can't set per app).
deployment:
  envoyGateway:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
