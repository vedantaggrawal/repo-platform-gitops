replicas: 1

# Console output as JSON so Loki's | json parser unpacks msg/level/logger.
grafana.ini:
  log:
    mode: console
    level: info
  log.console:
    format: json
  server:
    root_url: https://local.grafana.internal:30443
  # SSO via the Keycloak `platform` realm (GitHub login brokered by Keycloak).
  # Public client + PKCE, so there is no client secret anywhere. The browser goes
  # to Keycloak's external URL; Grafana's back-channel calls use the in-cluster
  # service (pods can't reach :30443). Admin = member of group platform-admins.
  # The local admin (Secret grafana-admin, below) remains as break-glass.
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    client_id: grafana
    use_pkce: true
    scopes: openid profile email groups
    auth_url: https://local.keycloak.internal:30443/realms/platform/protocol/openid-connect/auth
    token_url: http://local-keycloak-keycloakx-http.keycloak.svc.cluster.local/realms/platform/protocol/openid-connect/token
    api_url: http://local-keycloak-keycloakx-http.keycloak.svc.cluster.local/realms/platform/protocol/openid-connect/userinfo
    signout_redirect_url: https://local.keycloak.internal:30443/realms/platform/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Flocal.grafana.internal%3A30443%2Flogin
    login_attribute_path: preferred_username
    email_attribute_path: email
    groups_attribute_path: groups
    role_attribute_path: contains(groups[*], 'platform-admins') && 'Admin' || 'Viewer'
    role_attribute_strict: false
    allow_sign_up: true

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 384Mi

# ServiceAccount with Service access so Loki and Mimir resolve via DNS works
# the same; no special perms needed for the standalone Grafana.
serviceAccount:
  create: true

# Sidecar auto-discovers ConfigMaps with grafana_datasource=1 or
# grafana_dashboard=1 in any namespace. Other apps (e.g. Cilium) drop
# dashboard ConfigMaps with the right label and they show up automatically.
sidecar:
  dashboards:
    enabled: true
    searchNamespace: ALL
  datasources:
    # Datasources are provisioned statically below, so sidecar discovery is
    # off. With searchNamespace: ALL it imported the dev kube-prometheus-stack
    # `grafana_datasource=1` ConfigMap (Prometheus isDefault:true) from the
    # shared monitoring namespace, colliding with our Mimir default and
    # crashing Grafana ("Only one datasource per organization can be default").
    enabled: false

# LGTM datasources: Mimir (metrics, default), Loki (logs), Tempo (traces).
# Cross-source jumps: Loki → Tempo via TraceID in log lines; Tempo →
# Loki via service.name; Tempo → Mimir for metrics on the same service.
# Standalone grafana chart wants the provisioning-file format here (the
# kube-prom-stack-only `additionalDataSources` key was silently ignored).
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        type: prometheus
        uid: mimir
        isDefault: true
        access: proxy
        url: http://local-mimir-nginx.monitoring.svc.cluster.local/prometheus
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          timeInterval: 30s
        secureJsonData:
          httpHeaderValue1: anonymous
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://local-loki-gateway.monitoring.svc.cluster.local
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_id":"(\w+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://local-tempo.monitoring.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            tags: [{ key: service.name, value: service_name }]
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: mimir
            tags: [{ key: service.name, value: service }]
          serviceMap:
            datasourceUid: mimir
          nodeGraph:
            enabled: true

ingress:
  enabled: true
  ingressClassName: cilium
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
  hosts:
    - local.grafana.internal
  tls:
    - secretName: grafana-tls
      hosts:
        - local.grafana.internal

# Standalone chart doesn't ship a ServiceMonitor by default — Alloy now
# scrapes Grafana via explicit prometheus.scrape, so leave SM off.
serviceMonitor:
  enabled: false

# Admin credentials from a Secret the chart doesn't render. Without this the
# chart generates a random password on every render (its `lookup` is empty
# under Argo CD's `helm template`), so Grafana restarted and its admin password
# changed on every sync of this repo.
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# grafana-admin is created once, in-cluster, by this PreSync hook Job: it exits
# if the Secret exists, otherwise it creates it with a random password. The
# password never appears in Git and Argo CD doesn't track (or prune) the
# Secret. Read it with:
#   kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: grafana-admin-init
      namespace: monitoring
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-2"
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: grafana-admin-init
      namespace: monitoring
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-2"
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["grafana-admin"]
        verbs: ["get"]
      # RBAC can't restrict `create` by name.
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["create"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: grafana-admin-init
      namespace: monitoring
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-2"
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: grafana-admin-init
    subjects:
      - kind: ServiceAccount
        name: grafana-admin-init
        namespace: monitoring
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: grafana-admin-init
      namespace: monitoring
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: grafana-admin-init
          restartPolicy: Never
          containers:
            - name: init
              image: curlimages/curl:8.11.1
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  API=https://kubernetes.default.svc/api/v1/namespaces/monitoring/secrets
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  AUTH="Authorization: Bearer $(cat $SA/token)"
                  code=$(curl -s -o /dev/null -w '%{http_code}' --cacert $SA/ca.crt -H "$AUTH" $API/grafana-admin)
                  if [ "$code" = 200 ]; then echo "grafana-admin exists"; exit 0; fi
                  [ "$code" = 404 ] || { echo "unexpected status $code"; exit 1; }
                  pw=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
                  body='{"apiVersion":"v1","kind":"Secret","metadata":{"name":"grafana-admin","labels":{"app.kubernetes.io/managed-by":"grafana-admin-init"}},"stringData":{"admin-user":"admin","admin-password":"'"$pw"'"}}'
                  code=$(curl -s -o /dev/null -w '%{http_code}' --cacert $SA/ca.crt -H "$AUTH" -H 'Content-Type: application/json' -X POST -d "$body" $API)
                  [ "$code" = 201 ] || [ "$code" = 409 ] || { echo "create failed: $code"; exit 1; }
                  echo "grafana-admin created"
