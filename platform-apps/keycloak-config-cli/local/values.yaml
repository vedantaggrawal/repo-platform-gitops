# keycloak-config-cli — declaratively reconciles the Keycloak realms defined
# inline below (`config:`). Runs as a PostSync hook Job; editing a realm changes
# the chart's rendered Secret, so the app goes OutOfSync and the Job re-runs. remote-state is on by default, so it only purges
# resources it created, never hand-made ones.
#
# Secrets in the keycloak namespace (NOT in git, this repo is public):
#   - keycloak-admin-creds : Keycloak admin credentials (out-of-band, from the Keycloak deploy)
#   - keycloak-github-idp  : GitHub OAuth app for the platform realm's GitHub login
#                            (keys GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET), delivered
#                            from OpenBao by manifests/keycloak-secrets. Optional:
#                            until it exists the IdP is created with placeholder
#                            values and GitHub login doesn't work.
#
# Realms here are non-sensitive: secrets are substituted at run time with
# $(env:NAME:-default). The import checksum is taken after substitution, so a
# changed secret is applied on the next run of the Job. The Job runs on every
# sync of this app, not when a Secret changes: after changing a secret in
# OpenBao (and the ExternalSecret has refreshed), bump importGeneration below.

image:
  # CLI 6.5.1 built against Keycloak 26.5.5 (admin API forward-compatible with 26.8).
  tag: "6.5.1-26.5.5"

existingSecret: keycloak-admin-creds
existingSecretKey: password

env:
  KEYCLOAK_URL: "http://local-keycloak-keycloakx-http.keycloak.svc.cluster.local"
  KEYCLOAK_USER: "admin"
  # Wait for Keycloak to answer before importing (Job may start before KC is ready).
  KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
  KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: "300s"
  # Resolve $(env:...) placeholders in the realm files from the container env.
  IMPORT_VARSUBSTITUTION_ENABLED: "true"
  IMPORT_FILES_LOCATIONS: "/config/*"

extraEnv:
  - name: GITHUB_CLIENT_ID
    valueFrom: { secretKeyRef: { name: keycloak-github-idp, key: GITHUB_CLIENT_ID, optional: true } }
  - name: GITHUB_CLIENT_SECRET
    valueFrom: { secretKeyRef: { name: keycloak-github-idp, key: GITHUB_CLIENT_SECRET, optional: true } }
  # Generated (manifests/keycloak-secrets/local/oauth2-proxy.yaml). Not optional:
  # the Job waits for the Secret rather than importing a placeholder secret.
  - name: OAUTH2_PROXY_CLIENT_SECRET
    valueFrom: { secretKeyRef: { name: oauth2-proxy-oidc, key: OAUTH2_PROXY_CLIENT_SECRET } }

# One retry if Keycloak isn't ready yet.
backoffLimit: 2

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# `platform`: SSO for platform UIs (Grafana first). People log in with GitHub;
# everyone lands in platform-viewers, listed users in platform-admins.
config:
  platform:
    inline:
      realm: platform
      # Bump to force a re-import (e.g. after Keycloak's database was rebuilt): it
      # changes the rendered realm Secret, so the app syncs and the import re-runs.
      attributes:
        importGeneration: "2"
      enabled: true
      displayName: Platform
      registrationAllowed: false
      loginWithEmailAllowed: false
      groups:
        - name: platform-admins
        - name: platform-viewers
      defaultGroups:
        - /platform-viewers
      identityProviders:
        - alias: github
          providerId: github
          enabled: true
          trustEmail: false
          firstBrokerLoginFlowAlias: first broker login
          config:
            clientId: $(env:GITHUB_CLIENT_ID:-unset)
            clientSecret: $(env:GITHUB_CLIENT_SECRET:-unset)
            syncMode: IMPORT
            defaultScope: read:user
      users:
        - username: vedantaggrawal
          enabled: true
          federatedIdentities:
            - identityProvider: github
              userId: "14919641"
              userName: vedantaggrawal
          groups:
            - /platform-admins
      clientScopes:
        - name: groups
          protocol: openid-connect
          attributes:
            include.in.token.scope: "true"
          protocolMappers:
            - name: groups
              protocol: openid-connect
              protocolMapper: oidc-group-membership-mapper
              config:
                claim.name: groups
                full.path: "false"
                id.token.claim: "true"
                access.token.claim: "true"
                userinfo.token.claim: "true"
      clients:
        - clientId: grafana
          name: Grafana
          enabled: true
          publicClient: true
          standardFlowEnabled: true
          directAccessGrantsEnabled: false
          redirectUris:
            - https://local.grafana.internal:30443/login/generic_oauth
          webOrigins:
            - https://local.grafana.internal:30443
          attributes:
            pkce.code.challenge.method: S256
            post.logout.redirect.uris: https://local.grafana.internal:30443/*
          defaultClientScopes:
            - basic
            - web-origins
            - acr
            - roles
            - profile
            - email
            - groups
        # oauth2-proxy in front of UIs without their own login (one redirect
        # URI per protected host). Access requires group platform-admins.
        - clientId: oauth2-proxy
          name: oauth2-proxy
          enabled: true
          publicClient: false
          clientAuthenticatorType: client-secret
          secret: $(env:OAUTH2_PROXY_CLIENT_SECRET)
          standardFlowEnabled: true
          directAccessGrantsEnabled: false
          redirectUris:
            - https://local.alertmanager.internal:30443/oauth2/callback
            - https://local.hubble.internal:30443/oauth2/callback
            - https://local.prometheus.internal:30443/oauth2/callback
          attributes:
            pkce.code.challenge.method: S256
          protocolMappers:
            # Client id in the access token's aud, as oauth2-proxy's keycloak-oidc
            # docs recommend (e.g. for --oidc-extra-audience / bearer-token use).
            - name: oauth2-proxy-audience
              protocol: openid-connect
              protocolMapper: oidc-audience-mapper
              config:
                included.client.audience: oauth2-proxy
                access.token.claim: "true"
                id.token.claim: "false"
          # oauth2-proxy requests exactly "openid email profile groups" (its
          # extraArgs.scope); a scope outside these is rejected (invalid_scope).
          defaultClientScopes:
            - basic
            - web-origins
            - acr
            - roles
            - profile
            - email
            - groups
