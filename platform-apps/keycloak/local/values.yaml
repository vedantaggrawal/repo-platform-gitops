# Keycloak (codecentric keycloakx chart) — local dev environment.
#
# Runs in production mode (`start`) on a CloudNativePG Postgres cluster
# (manifests/keycloak-db; the operator generates the credentials), so realms, clients and
# users survive pod restarts. (start-dev's embedded H2 lost everything on every
# restart, which made it unusable as the platform's OIDC provider.)
#
# The admin bootstrap credentials live in the `keycloak-admin-creds` Secret
# (created out-of-band in the keycloak namespace, NOT in git, since this values
# file is public), consumed below via extraEnv secretKeyRef. Create it before
# the first sync:
#
#   kubectl create ns keycloak
#   kubectl -n keycloak create secret generic keycloak-admin-creds \
#     --from-literal=username=admin --from-literal=password=<pick-one>
#
# The console is exposed through the Cilium ingress at
# https://local.keycloak.internal:30443 (kind maps container 443 -> host 30443).
# cert-manager mints a self-signed cert via the `selfsigned` ClusterIssuer,
# matching how the rest of the platform handles local TLS.

replicas: 1

command:
  - "/opt/keycloak/bin/kc.sh"
args:
  - "start"

database:
  vendor: postgres
  hostname: keycloak-db-rw
  port: 5432
  database: keycloak
  username: keycloak
  existingSecret: keycloak-db-app
  existingSecretKey: password

# Wait for Postgres before starting Keycloak (no ordering between the
# keycloak-db app and this one).
dbchecker:
  enabled: true

# Modern Keycloak serves at root; cleaner than the chart's legacy /auth default.
http:
  relativePath: "/"

# TLS terminates at the Cilium ingress (Envoy), which emits X-Forwarded-* headers
# — so `xforwarded`, not the chart default `forwarded`. This drives KC_PROXY_HEADERS
# and (via proxy.http.enabled, already true by default) KC_HTTP_ENABLED so Keycloak
# builds correct https:// redirect URLs. (The legacy KC_PROXY var is removed in 26.)
proxy:
  mode: xforwarded

# Single replica: local cache. `custom` suppresses the chart's ispn/jdbc-ping
# cluster stack; KC_CACHE=local below selects the local cache explicitly.
cache:
  stack: custom

extraEnv: |
  # Keycloak 26 bootstrap admin vars (the legacy KEYCLOAK_ADMIN_* are deprecated).
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-creds
        key: username
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-creds
        key: password
  # JSON logs so Loki's `| json` parser unpacks fields cleanly, consistent with
  # the rest of the platform (grafana, kargo, argocd, cert-manager).
  - name: KC_LOG_CONSOLE_OUTPUT
    value: "json"
  - name: KC_CACHE
    value: "local"
  # Pin the public URL *including the external port*. kind maps host 30443 ->
  # container 443, but Envoy forwards X-Forwarded-Port: 443, so Keycloak otherwise
  # builds issuer/redirect URLs without :30443 and the admin console's OIDC calls
  # hit :443 (unmapped) and hang. A full-URL KC_HOSTNAME overrides that.
  - name: KC_HOSTNAME
    value: "https://local.keycloak.internal:30443"

# JVM auth server — give it headroom. Memory limit only (no CPU limit), matching
# the platform convention of guaranteeing requests but not throttling CPU.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

ingress:
  enabled: true
  ingressClassName: cilium
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
    cert-manager.io/usages: "digital signature,key encipherment,server auth"
  rules:
    - host: local.keycloak.internal
      # Cilium/Envoy needs Prefix for "/" to match all subpaths (/admin, /realms,
      # /resources); ImplementationSpecific only matched "/" and 404'd the rest.
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: keycloak-tls
      hosts:
        - local.keycloak.internal

# Expose /metrics; Alloy scrapes via explicit prometheus.scrape like the rest of
# the platform, so the chart's ServiceMonitor stays off.
metrics:
  enabled: true
serviceMonitor:
  enabled: false

# Bump to restart Keycloak after the keycloak-db credentials change (e.g. the
# CNPG Cluster was recreated): env from secretKeyRef is only read at start.
podAnnotations:
  db-credentials-generation: "2"
