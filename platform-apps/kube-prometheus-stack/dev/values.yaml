# Dev-specific overrides for kube-prometheus-stack

# kind: kube-scheduler, kube-controller-manager and etcd listen on 127.0.0.1
# inside the control-plane container, and Cilium replaces kube-proxy, so these
# targets can never be scraped. Their monitors only produced permanent
# TargetDown/*Down alerts. Disabling a component also drops its rules.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  disabled:
    # kind nodes have no NTP sync (node_timex_sync_status is always 0).
    NodeClockNotSynchronising: true
    NodeClockSkewDetected: true

# The nfsd collector fails on every scrape on this kernel ("unknown NFSd
# metric line wdeleg_getattr") and logs an error each time; no node serves NFS.
# Setting extraArgs replaces the chart's list, so its two filesystem excludes
# are repeated here.
prometheus-node-exporter:
  prometheus:
    monitor:
      interval: 60s
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    - --no-collector.nfsd

# Series diet: histogram families no dashboard, rule or KPI references
# (verified against all grafana_dashboard ConfigMaps and the Mimir ruler).
# apiserver_request_total/_count/_sum and the etcd _sum/_count stay.
kubeApiServer:
  serviceMonitor:
    interval: 60s
    # Replaces the chart default (le-thinning of request_duration), which is
    # moot once the whole bucket family is dropped.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: (etcd_request_duration_seconds_bucket|apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket)

kubelet:
  serviceMonitor:
    interval: 60s
    probesMetricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: prober_probe_duration_seconds_bucket
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: kubelet_runtime_operations_duration_seconds_bucket
    # Replaces the chart default list: its entries are repeated, then the
    # extra drops (container_memory_failures_total, container_blkio_*).
    cAdvisorMetricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
      - action: drop
        sourceLabels: [__name__]
        regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
      - action: drop
        sourceLabels: [__name__]
        regex: container_memory_(mapped_file|swap)
      - action: drop
        sourceLabels: [__name__]
        regex: container_(file_descriptors|tasks_state|threads_max)
      - action: drop
        sourceLabels: [__name__]
        regex: container_spec.*
      - action: drop
        sourceLabels: [id, pod]
        regex: .+;
      - action: drop
        sourceLabels: [__name__]
        regex: (container_memory_failures_total|container_blkio_device_usage_total)

# Ingest diet: all rules, dashboards and KPIs use >=5m rate windows, so 60s
# scrapes lose nothing. Prometheus default is 30s.
kube-state-metrics:
  prometheus:
    monitor:
      interval: 60s

# This cluster's metrics go to Mimir: the OpenTelemetry target allocator scrapes
# the ServiceMonitors this chart renders (kubelet, apiserver, coredns,
# node-exporter, kube-state-metrics), and the shared Grafana loads its
# dashboards. Nothing queries the chart's own Prometheus, Alertmanager or
# Grafana, which cost about 1.7Gi together, so they are off. The operator stays:
# it manages the kubelet Service that the kubelet ServiceMonitor selects.
prometheus:
  enabled: false
alertmanager:
  enabled: false
grafana:
  enabled: false
  # Dashboard ConfigMaps are rendered only with Grafana on, unless forced.
  forceDeployDashboards: true
  sidecar:
    dashboards:
      # Grafana's sidecar puts these in the Kubernetes folder.
      annotations:
        grafana_folder: Kubernetes

# The standalone kube-state-metrics app already exports these series to Mimir
# with the same job label; a second copy only doubled them.
kubeStateMetrics:
  enabled: false
