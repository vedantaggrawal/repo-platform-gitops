# Mimir — Prometheus-compatible TSDB.
# Chart only ships microservices mode. For local we collapse each role
# to a single replica with minimal resources; same chart scales out by
# bumping replicas per component for prod (the structuredConfig is unchanged).

mimir:
  structuredConfig:
    server:
      log_format: json
    multitenancy_enabled: false
    common:
      storage:
        backend: s3
        s3:
          endpoint: local-minio.monitoring-storage.svc.cluster.local:9000
          # From Secret mimir-s3 (global.extraEnvFrom); Mimir expands ${VAR}.
          access_key_id: "${MIMIR_S3_ACCESS_KEY_ID}"
          secret_access_key: "${MIMIR_S3_SECRET_ACCESS_KEY}"
          insecure: true
          region: us-east-1
    blocks_storage:
      backend: s3
      s3:
        bucket_name: mimir-blocks
    # Rules come only from git: ConfigMap mimir-rules mounted at
    # <directory>/<tenant>/<file> (tenant "anonymous", multitenancy off).
    ruler_storage:
      backend: local
      local:
        directory: /etc/mimir-rules
    alertmanager_storage:
      backend: s3
      s3:
        bucket_name: mimir-alertmanager
    limits:
      compactor_blocks_retention_period: 30d
      ingestion_rate: 100000
      ingestion_burst_size: 200000
      # Default 150k was hitting after adding cilium SMs. 1.5M gives
      # headroom for a small dev cluster; tune per-tenant in prod.
      max_global_series_per_user: 1500000
      # Exemplar storage (off by default); fed by otel-cluster spanmetrics.
      max_global_exemplars_per_user: 100000
    # Single-replica ingester + store-gateway: drop the ring replication
    # factor from the default 3, otherwise queries fail with
    # "too many unhealthy instances in the ring".
    ingester:
      ring:
        replication_factor: 1
    store_gateway:
      sharding_ring:
        replication_factor: 1

global:
  # MinIO user credentials from OpenBao (ExternalSecret in manifests/minio-init).
  extraEnvFrom:
    - secretRef:
        name: mimir-s3

# Resource floor used everywhere we don't override per-component.
_resourcesSmall: &resourcesSmall
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 128Mi

alertmanager:
  # Replaces the kube-prom-stack-bundled Alertmanager. Tenant config would live
  # in S3 (mimir-alertmanager bucket); with none (multitenancy off, tenant
  # "anonymous") the fallbackConfig below applies, so routing is declarative.
  enabled: true
  replicas: 1
  # Slack webhook is read from a file (never in config): Secret alert-slack,
  # delivered by ESO from OpenBao platform/alerting/slack. Optional so the pod
  # starts before the human sets tfvar alert_slack_webhook.
  extraVolumes:
    - name: alert-slack
      secret:
        secretName: alert-slack
        optional: true
  extraVolumeMounts:
    - name: alert-slack
      mountPath: /etc/alertmanager-secrets/slack
      readOnly: true
  fallbackConfig: |
    route:
      receiver: "null"
      group_by: [alertname, namespace, service]
      routes:
        - matchers: [severity="critical"]
          receiver: slack
          repeat_interval: 1h
        - matchers: [severity="warning"]
          receiver: slack
          repeat_interval: 4h
        - matchers: [severity="info"]
          receiver: "null"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager-secrets/slack/webhook_url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
  persistentVolume:
    size: 1Gi
    storageClass: standard
  resources: *resourcesSmall

distributor:
  replicas: 1
  # Own block, not *resourcesSmall: at 128Mi the distributor OOMKilled under
  # remote_write load from Alloy/OTel, so every push failed.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    size: 5Gi
    storageClass: standard
  # WAL replay on startup needs far more than steady state: at 1280Mi the
  # ingester OOMKilled ~26% into replay and never became Ready. Keep the 4Gi
  # limit for replay bursts; request 2Gi (measured peak incl. a replay: 1.33Gi
  # at ~360k series, 2026-10-25) so the worker isn't over-reserved.
  resources:
    requests:
      cpu: 250m
      memory: 2048Mi
    limits:
      memory: 4096Mi

querier:
  replicas: 1
  # Own block, not *resourcesSmall: OOMKilled at 128Mi under dashboard queries.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

query_frontend:
  replicas: 1
  resources: *resourcesSmall

query_scheduler:
  replicas: 1
  resources: *resourcesSmall

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    size: 2Gi
    storageClass: standard
  resources: *resourcesSmall

compactor:
  replicas: 1
  # Scratch space for downloading and merging blocks: about 2x the largest
  # compacted range (24h, ~1.5 GB at ~220k series), so 2Gi fails at that stage.
  persistentVolume:
    size: 10Gi
    storageClass: standard
  # Own block, not *resourcesSmall: merging 2h blocks into a 12h block at
  # ~220k active series OOMKilled at 128Mi, so nothing was compacted and
  # retention never ran. Usage peaks during a compaction, idle in between.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  env:
    # Let the Go GC work before the 1Gi limit OOMKills the pod.
    - name: GOMEMLIMIT
      value: 900MiB

ruler:
  enabled: true
  resources: *resourcesSmall
  extraVolumes:
    - name: rules
      configMap:
        name: mimir-rules
  extraVolumeMounts:
    - name: rules
      mountPath: /etc/mimir-rules/anonymous
      readOnly: true

overrides_exporter:
  enabled: false

gateway:
  replicas: 1
  resources: *resourcesSmall

# HA helper — needed only when ingesters have ≥2 zones; we run one zone.
rollout_operator:
  enabled: false

# Bundled MinIO/Memcached/metaMonitoring all disabled — we own those layers.
minio:
  enabled: false
memcached:
  enabled: false
memcachedExporter:
  enabled: false
metaMonitoring:
  # ServiceMonitors for every Mimir component; the OTel Target Allocator picks
  # them up, so Mimir's own metrics (ring, shipper, OOMs) land in Mimir.
  serviceMonitor:
    enabled: true
  grafanaAgent:
    enabled: false

# Ruler rule files (local storage), tenant "anonymous". Edit here; Argo rolls it.
extraObjects:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: mimir-rules
      namespace: monitoring
    data:
      slo.yaml: |
        groups:
          - name: slo-gateway-availability
            rules:
              - alert: GatewayErrorBudgetBurnFast
                expr: |
                  (sum(rate(traces_span_metrics_calls_total{service_name="platform-gateway",status_code="STATUS_CODE_ERROR"}[1h])) / sum(rate(traces_span_metrics_calls_total{service_name="platform-gateway"}[1h]))) > (14.4 * 0.001)
                  and
                  (sum(rate(traces_span_metrics_calls_total{service_name="platform-gateway",status_code="STATUS_CODE_ERROR"}[5m])) / sum(rate(traces_span_metrics_calls_total{service_name="platform-gateway"}[5m]))) > (14.4 * 0.001)
                labels: {severity: critical, service: platform-gateway}
                annotations:
                  summary: platform-gateway burning 99.9% availability budget at 14.4x (1h and 5m)
              - alert: GatewayErrorBudgetBurnSlow
                expr: |
                  (sum(rate(traces_span_metrics_calls_total{service_name="platform-gateway",status_code="STATUS_CODE_ERROR"}[6h])) / sum(rate(traces_span_metrics_calls_total{service_name="platform-gateway"}[6h]))) > (6 * 0.001)
                  and
                  (sum(rate(traces_span_metrics_calls_total{service_name="platform-gateway",status_code="STATUS_CODE_ERROR"}[30m])) / sum(rate(traces_span_metrics_calls_total{service_name="platform-gateway"}[30m]))) > (6 * 0.001)
                labels: {severity: warning, service: platform-gateway}
                annotations:
                  summary: platform-gateway burning 99.9% availability budget at 6x (6h and 30m)
          - name: slo-tenant-api-latency
            rules:
              - alert: TenantApiLatencyP95High
                expr: histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="tenant-api"}[5m]))) > 300
                for: 10m
                labels: {severity: warning, service: tenant-api}
                annotations:
                  summary: tenant-api p95 latency above 300ms for 10m
          - name: postgres-capacity
            rules:
              - alert: PostgresConnectionsHigh
                expr: sum by (namespace, pod) (cnpg_backends_total) / max by (namespace, pod) (cnpg_pg_settings_setting{name="max_connections"}) > 0.8
                for: 10m
                labels: {severity: warning, service: postgres}
                annotations:
                  summary: Postgres connections above 80% of max_connections
          - name: platform-capacity
            rules:
              # kind's local-path volumes expose no per-PVC stats (no CSI), so watch
              # the node filesystem that holds every PVC (/var).
              - alert: NodeDiskFillingUp
                expr: (node_filesystem_avail_bytes{mountpoint="/var"} / node_filesystem_size_bytes{mountpoint="/var"} < 0.15) and predict_linear(node_filesystem_avail_bytes{mountpoint="/var"}[6h], 24 * 3600) < 0
                for: 30m
                labels: {severity: warning, service: node, layer: storage}
                annotations:
                  summary: Node /var (holds all PVCs) under 15% free and full within 24h
              - alert: PodPendingTooLong
                expr: sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) > 0
                for: 5m
                labels: {severity: warning, service: kubernetes, layer: scheduling}
                annotations:
                  summary: Pod Pending for over 5m
              - alert: NodeMemoryRequestsHigh
                expr: sum by (node) (kube_pod_container_resource_requests{resource="memory",node!=""}) / sum by (node) (kube_node_status_allocatable{resource="memory"}) > 0.85
                for: 15m
                labels: {severity: warning, service: kubernetes, layer: capacity}
                annotations:
                  summary: Node memory requests above 85% of allocatable
              - alert: NodeCpuRequestsHigh
                expr: sum by (node) (kube_pod_container_resource_requests{resource="cpu",node!=""}) / sum by (node) (kube_node_status_allocatable{resource="cpu"}) > 0.85
                for: 15m
                labels: {severity: warning, service: kubernetes, layer: capacity}
                annotations:
                  summary: Node CPU requests above 85% of allocatable
              - alert: ContainerOOMKilled
                expr: (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1) and on (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[10m]) > 0)
                labels: {severity: warning, service: kubernetes, layer: workload}
                annotations:
                  summary: A container OOMKilled in the last 10m
              - alert: ArgoApplicationControllerRestarting
                expr: increase(kube_pod_container_status_restarts_total{namespace="argocd",container="application-controller"}[30m]) > 0
                labels: {severity: critical, service: argocd, layer: gitops}
                annotations:
                  summary: Argo CD application-controller restarted in the last 30m (OOM if ContainerOOMKilled also fires)
              - alert: ContainerCpuThrottlingHigh
                expr: sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total{container!=""}[5m])) / sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total{container!=""}[5m])) > 0.25
                for: 15m
                labels: {severity: warning, service: kubernetes, layer: workload}
                annotations:
                  summary: A container CPU throttled in over 25% of periods
          - name: telemetry-pipeline
            rules:
              - alert: OtelCollectorExportFailing
                expr: sum by (exporter) (rate(otelcol_exporter_send_failed_spans_total[5m]) + rate(otelcol_exporter_send_failed_metric_points_total[5m]) + rate(otelcol_exporter_send_failed_log_records_total[5m])) > 0
                for: 5m
                labels: {severity: critical, service: otel-collector, layer: telemetry}
                annotations:
                  summary: OTel collector exporter failing to send
              - alert: OtelCollectorQueueNearFull
                expr: max by (exporter, pod) (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.8
                for: 5m
                labels: {severity: warning, service: otel-collector, layer: telemetry}
                annotations:
                  summary: OTel exporter queue above 80%
              - alert: OtelCollectorReceiverRefusing
                expr: sum by (receiver) (rate(otelcol_receiver_refused_spans_total[5m]) + rate(otelcol_receiver_refused_metric_points_total[5m]) + rate(otelcol_receiver_refused_log_records_total[5m])) > 0
                for: 5m
                labels: {severity: warning, service: otel-collector, layer: telemetry}
                annotations:
                  summary: OTel receiver refusing data (backpressure)
              - alert: MimirDiscardingSamples
                expr: sum by (reason) (rate(cortex_discarded_samples_total[5m])) > 0
                for: 10m
                labels: {severity: warning, service: mimir, layer: telemetry}
                annotations:
                  summary: Mimir discarding samples
          - name: grafana
            rules:
              - alert: GrafanaDown
                expr: absent_over_time(grafana_build_info[10m])
                for: 5m
                labels: {severity: critical, service: grafana, layer: observability}
                annotations:
                  summary: Grafana has reported no metrics for 10m
              - alert: GrafanaDatasourceErrorRate
                expr: sum by (datasource) (rate(grafana_datasource_request_total{code=~"5.."}[10m])) / sum by (datasource) (rate(grafana_datasource_request_total[10m])) > 0.05
                for: 10m
                labels: {severity: warning, service: grafana, layer: observability}
                annotations:
                  summary: Grafana datasource {{ $labels.datasource }} returning >5% errors
              - alert: GrafanaHttpP95High
                # Streaming and datasource-proxied handlers are as slow as the backend; excluded.
                expr: histogram_quantile(0.95, sum by (le) (rate(grafana_http_request_duration_seconds_bucket{handler!~"/api/live/.*|/api/ds/query|/api/datasources/proxy/.*"}[10m]))) > 2
                for: 15m
                labels: {severity: warning, service: grafana, layer: observability}
                annotations:
                  summary: Grafana HTTP p95 above 2s for 15m
          - name: gateway-envoy
            rules:
              # Per-route latency from Envoy; streaming routes (watch/WebSocket UIs)
              # hold requests open by design and are excluded from the SLI.
              - alert: GatewayLatencyP95High
                expr: histogram_quantile(0.95, sum by (le, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_time_bucket{namespace="envoy-gateway-system",envoy_cluster_name=~"httproute/.*",envoy_cluster_name!~"httproute/(argocd|kargo|headlamp|kube-system)/.*"}[10m]))) > 500
                for: 15m
                labels: {severity: warning, service: envoy, layer: gateway}
                annotations:
                  summary: Gateway route p95 above 500ms for 15m (streaming routes excluded)
              - alert: EnvoyUpstreamConnectionOverflow
                expr: sum by (envoy_cluster_name) (increase(envoy_cluster_upstream_cx_overflow_total{namespace="envoy-gateway-system"}[5m]) + increase(envoy_cluster_upstream_rq_pending_overflow_total{namespace="envoy-gateway-system"}[5m])) > 0
                labels: {severity: warning, service: envoy, layer: gateway}
                annotations:
                  summary: Envoy Gateway upstream connection or pending-request circuit breaker overflowing
              - alert: EnvoyUpstream5xxRatioHigh
                expr: sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx_total{namespace="envoy-gateway-system",envoy_response_code_class="5"}[5m])) / sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx_total{namespace="envoy-gateway-system"}[5m])) > 0.05
                for: 10m
                labels: {severity: critical, service: envoy, layer: gateway}
                annotations:
                  summary: Envoy Gateway upstream 5xx ratio above 5% for 10m
          - name: postgres-health
            rules:
              - alert: PostgresLockWaits
                expr: max by (namespace, pod) (cnpg_backends_waiting_total) > 0
                for: 5m
                labels: {severity: warning, service: postgres, layer: data}
                annotations:
                  summary: Postgres backends waiting on locks for over 5m
              - alert: PostgresDeadlocks
                expr: sum by (namespace, pod, datname) (increase(cnpg_pg_stat_database_deadlocks_total[10m])) > 0
                labels: {severity: warning, service: postgres, layer: data}
                annotations:
                  summary: Postgres deadlocks detected in the last 10m
              - alert: PostgresLongTransaction
                expr: max by (namespace, pod, datname) (cnpg_backends_max_tx_duration_seconds) > 300
                for: 5m
                labels: {severity: warning, service: postgres, layer: data}
                annotations:
                  summary: Postgres transaction open longer than 5m
              - alert: PostgresReplicationLagHigh
                expr: max by (namespace, pod) (cnpg_pg_replication_lag) > 30
                for: 10m
                labels: {severity: warning, service: postgres, layer: data}
                annotations:
                  summary: Postgres replica lag above 30s for 10m
