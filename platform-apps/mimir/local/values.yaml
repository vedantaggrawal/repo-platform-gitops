# Mimir — Prometheus-compatible TSDB.
# Chart only ships microservices mode. For local we collapse each role
# to a single replica with minimal resources; same chart scales out by
# bumping replicas per component for prod (the structuredConfig is unchanged).

mimir:
  structuredConfig:
    server:
      log_format: json
    multitenancy_enabled: false
    common:
      storage:
        backend: s3
        s3:
          endpoint: local-minio.monitoring-storage.svc.cluster.local:9000
          # From Secret mimir-s3 (global.extraEnvFrom); Mimir expands ${VAR}.
          access_key_id: "${MIMIR_S3_ACCESS_KEY_ID}"
          secret_access_key: "${MIMIR_S3_SECRET_ACCESS_KEY}"
          insecure: true
          region: us-east-1
    blocks_storage:
      backend: s3
      s3:
        bucket_name: mimir-blocks
    ruler_storage:
      backend: s3
      s3:
        bucket_name: mimir-ruler
    alertmanager_storage:
      backend: s3
      s3:
        bucket_name: mimir-alertmanager
    limits:
      compactor_blocks_retention_period: 30d
      ingestion_rate: 100000
      ingestion_burst_size: 200000
      # Default 150k was hitting after adding cilium SMs. 1.5M gives
      # headroom for a small dev cluster; tune per-tenant in prod.
      max_global_series_per_user: 1500000
    # Single-replica ingester + store-gateway: drop the ring replication
    # factor from the default 3, otherwise queries fail with
    # "too many unhealthy instances in the ring".
    ingester:
      ring:
        replication_factor: 1
    store_gateway:
      sharding_ring:
        replication_factor: 1

global:
  # MinIO user credentials from OpenBao (ExternalSecret in manifests/minio-init).
  extraEnvFrom:
    - secretRef:
        name: mimir-s3

# Resource floor used everywhere we don't override per-component.
_resourcesSmall: &resourcesSmall
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 128Mi

alertmanager:
  # Replaces the kube-prom-stack-bundled Alertmanager. Mimir's tenant-aware
  # Alertmanager reads config from S3 (mimir-alertmanager bucket, already
  # created by the MinIO Job). Default empty config — add receivers + routes
  # here when alerting is needed.
  enabled: true
  replicas: 1
  persistentVolume:
    size: 1Gi
    storageClass: standard
  resources: *resourcesSmall

distributor:
  replicas: 1
  # Own block, not *resourcesSmall: at 128Mi the distributor OOMKilled under
  # remote_write load from Alloy/OTel, so every push failed.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    size: 5Gi
    storageClass: standard
  # WAL replay on startup needs far more than steady state: at 1280Mi the
  # ingester OOMKilled ~26% into replay and never became Ready, so Mimir
  # ingested nothing. request == limit so the scheduler reserves it.
  resources:
    requests:
      cpu: 250m
      memory: 4096Mi
    limits:
      memory: 4096Mi

querier:
  replicas: 1
  # Own block, not *resourcesSmall: OOMKilled at 128Mi under dashboard queries.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

query_frontend:
  replicas: 1
  resources: *resourcesSmall

query_scheduler:
  replicas: 1
  resources: *resourcesSmall

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    size: 2Gi
    storageClass: standard
  resources: *resourcesSmall

compactor:
  replicas: 1
  # Scratch space for downloading and merging blocks: about 2x the largest
  # compacted range (24h, ~1.5 GB at ~220k series), so 2Gi fails at that stage.
  persistentVolume:
    size: 10Gi
    storageClass: standard
  # Own block, not *resourcesSmall: merging 2h blocks into a 12h block at
  # ~220k active series OOMKilled at 128Mi, so nothing was compacted and
  # retention never ran. Usage peaks during a compaction, idle in between.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  env:
    # Let the Go GC work before the 1Gi limit OOMKills the pod.
    - name: GOMEMLIMIT
      value: 900MiB

ruler:
  enabled: false

overrides_exporter:
  enabled: false

gateway:
  replicas: 1
  resources: *resourcesSmall

# HA helper — needed only when ingesters have ≥2 zones; we run one zone.
rollout_operator:
  enabled: false

# Bundled MinIO/Memcached/metaMonitoring all disabled — we own those layers.
minio:
  enabled: false
memcached:
  enabled: false
memcachedExporter:
  enabled: false
metaMonitoring:
  # ServiceMonitors for every Mimir component; the OTel Target Allocator picks
  # them up, so Mimir's own metrics (ring, shipper, OOMs) land in Mimir.
  serviceMonitor:
    enabled: true
  grafanaAgent:
    enabled: false
