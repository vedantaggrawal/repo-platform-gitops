# MinIO — S3-compatible object store backing Mimir/Loki/Tempo.
# Standalone mode locally; switch to mode: distributed (>=4 replicas) for prod.

mode: standalone
replicas: 1

# Recreate: the RWO data volume can't be shared by a surge pod. Server-side
# apply can't drop the live rollingUpdate block (no field owner), so Argo CD
# replaces this Deployment instead (same as the loki gateway).
deploymentUpdate:
  type: Recreate
additionalAnnotations:
  argocd.argoproj.io/sync-options: Replace=true

# Root credentials: Secret minio-root (keys rootUser/rootPassword), delivered
# from OpenBao by an ExternalSecret in manifests/minio-init/local.
existingSecret: minio-root

# The chart default `users` adds a console user with a well-known password; app
# users are created by the minio-init Job instead.
users: []

persistence:
  enabled: true
  storageClass: standard
  size: 30Gi

# Bucket creation moved to manifests/minio-init/local/buckets-job.yaml
# (Argo Application local-minio-init). Argo strips the chart's
# helm.sh/hook annotations so the chart's `buckets:` Job never ran.
buckets: []

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP
  port: 9000
consoleService:
  type: ClusterIP
  port: 9001

# Web console for poking around buckets; api ingress not exposed externally.
consoleIngress:
  enabled: true
  ingressClassName: cilium
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
    cert-manager.io/usages: "digital signature,key encipherment,server auth"
  hosts:
    - local.minio.internal
  tls:
    - secretName: minio-console-tls
      hosts:
        - local.minio.internal

# Console login through Keycloak (realm `platform`, confidential client `minio`).
# The `policy` claim carries MinIO policy names: Keycloak gives members of
# platform-admins the minio client role `consoleAdmin`. Other users get no policy
# claim, so MinIO refuses them (readonly would expose every bucket, including the
# observability data). Break-glass: the root user (Secret minio-root).
# The issuer URL resolves in-cluster through the CoreDNS rewrite to the
# keycloak-issuer Service. If discovery fails, MinIO logs a warning and starts
# without OpenID; S3 and the root login are unaffected.
oidc:
  enabled: true
  configUrl: https://local.keycloak.internal:30443/realms/platform/.well-known/openid-configuration
  clientId: minio
  # From OpenBao via manifests/minio-init (ExternalSecret minio-oidc). The pod
  # does not start until this Secret exists.
  existingClientSecretName: minio-oidc
  existingClientSecretKey: client_secret
  claimName: policy
  scopes: "openid,profile,email"
  redirectUri: https://local.minio.internal:30443/oauth_callback
  displayName: Keycloak

# Trust platform-ca for the issuer. MinIO loads every certificate in
# <certsPath>/CAs at start. Optional: MinIO starts even without the ConfigMap.
extraVolumes:
  - name: platform-ca
    configMap:
      name: platform-ca-bundle
      optional: true
extraVolumeMounts:
  - name: platform-ca
    mountPath: /etc/minio/certs/CAs
    readOnly: true

# Disable the metrics scrape job until Alloy is in place (phase 5).
metrics:
  serviceMonitor:
    enabled: false
