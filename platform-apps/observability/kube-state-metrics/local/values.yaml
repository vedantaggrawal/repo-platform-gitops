# Default port :8080 named "http" — Alloy targets svc:8080 via explicit
# discovery.kubernetes endpoints role + relabel filter.
replicas: 1

# JSON logs to keep Loki's | json clean.
extraArgs:
  - --logtostderr=true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 128Mi

prometheus:
  monitor:
    # ServiceMonitor: discovered by Alloy's prometheus.operator.servicemonitors
    # block. CRDs come from the prometheus-operator-crds app (no controller).
    enabled: true
    http:
      # Keep KSM's own namespace/pod labels (the object's) instead of renaming
      # them to exported_* and stamping the scrape target's (monitoring).
      honorLabels: true

# Platform categories on kube_namespace_labels / kube_pod_labels (KSM exports label metrics only for an
# allowlist). eve.io/tenant and eve.io/layer are the join keys for per-tenant and per-layer metrics
# (OpenCost allocation, Mimir eve_* rules); the pod app label gives per-app joins.
metricLabelsAllowlist:
  - namespaces=[eve.io/tenant,eve.io/layer]
  - pods=[app.kubernetes.io/name]
