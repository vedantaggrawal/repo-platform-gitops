# Loki — log store.
# Local: SingleBinary mode (1 pod runs distributor+ingester+querier+frontend).
# Prod: switch deploymentMode to SimpleScalable (3 pools) or Distributed.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  # Ruler: evaluates the log rules below and sends alerts to the same Alertmanager as Mimir.
  rulerConfig:
    enable_api: true
    alertmanager_url: http://local-mimir-alertmanager.monitoring.svc:8080/alertmanager
    rule_path: /tmp/loki/rules-temp
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    ring:
      kvstore:
        store: inmemory
  server:
    log_format: json
  # Single-replica SingleBinary: drop ring replication from default 3.
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2025-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
    s3:
      endpoint: local-minio.monitoring-storage.svc.cluster.local:9000
      # From Secret loki-s3 (singleBinary.extraEnvFrom), expanded by -config.expand-env.
      accessKeyId: "${LOKI_S3_ACCESS_KEY_ID}"
      secretAccessKey: "${LOKI_S3_SECRET_ACCESS_KEY}"
      s3ForcePathStyle: true
      insecure: true
      region: us-east-1
  limits_config:
    retention_period: 168h          # 7d
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_lookback: 168h
    allow_structured_metadata: true
    volume_enabled: true
    # OTLP index labels (Loki 3.6.7 pkg/loghttp/push/otlp_config.go): the defaults promote 18 resource
    # attributes incl. k8s.pod.name / k8s.deployment.name / service.instance.id, so every rollout
    # starts new streams (55-61 streams for ~45 workloads). Index only the stable identity; pod,
    # deployment, node and the rest stay queryable as structured metadata (`| k8s_pod_name="..."`).
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - service.namespace
              - k8s.namespace.name
              - k8s.container.name
              - deployment.environment
  compactor:
    retention_enabled: true
    delete_request_store: s3
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: loki-s3
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard
  resources:
    requests:
      cpu: 250m
      memory: 514Mi
    limits:
      memory: 1024Mi
  # Log-based alert rules for the ruler (in the single binary); tenant dir "fake" because auth is off.
  extraVolumes:
    - name: alert-rules
      configMap: { name: loki-alert-rules }
  extraVolumeMounts:
    - name: alert-rules
      mountPath: /etc/loki/rules/fake

# Disable everything that doesn't apply to SingleBinary.
write: { replicas: 0 }
read: { replicas: 0 }
backend: { replicas: 0 }
ingester: { replicas: 0 }
distributor: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
indexGateway: { replicas: 0 }
compactor: { replicas: 0 }
bloomGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
patternIngester: { replicas: 0 }
ruler: { replicas: 0 }
overridesExporter: { replicas: 0 }

# Gateway in front of singleBinary for cleaner routing + future scale-out.
gateway:
  enabled: true
  replicas: 1
  deploymentStrategy:
    type: Recreate
  # Server-side apply can't switch the live Deployment to Recreate: the
  # apiserver-defaulted rollingUpdate block has no field owner, so it is never
  # removed and validation rejects Recreate + rollingUpdate. Replace=true makes
  # Argo CD replace this one object (takes precedence over ServerSideApply).
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      memory: 256Mi

# Disable bundled MinIO, monitoring, canaries, tests, memcached.
minio:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
memcached:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
sidecar:
  rules:
    enabled: false
  datasources:
    enabled: false
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  # Scraped by the otel-cluster target allocator (any ServiceMonitor). 60s like every platform target;
  # the collector allowlist admits loki_* names only once a dashboard or rule references them.
  serviceMonitor:
    enabled: true
    interval: 60s
  dashboards:
    enabled: false
  rules:
    enabled: false

# Rules the ruler loads (mounted under /etc/loki/rules/fake by singleBinary.extraVolumes).
extraObjects:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: loki-alert-rules
      namespace: monitoring
    data:
      platform-logs.yaml: |
        groups:
          - name: platform-logs
            rules:
              # CNPG only logs this; the failure also shows in metrics once the plugin reports it.
              - alert: PostgresBackupFailedLog
                expr: sum by (k8s_namespace_name) (count_over_time({k8s_container_name="postgres"} |= `"msg":"Backup failed"` [30m])) > 0
                labels: {severity: critical, service: postgres, layer: data}
                annotations:
                  summary: CNPG backup failed in {{ "{{ $labels.k8s_namespace_name }}" }} (see the postgres container log)
              # Survives metric allowlist drift: the ruler logs every failed push to Alertmanager.
              - alert: MimirRulerAlertDeliveryFailingLog
                expr: sum(count_over_time({k8s_namespace_name="monitoring", k8s_container_name="ruler"} |= "Error sending alert" [10m])) > 0
                for: 10m
                labels: {severity: critical, service: mimir, layer: observability}
                annotations:
                  summary: Mimir ruler cannot deliver alerts to Alertmanager (log-based)
              - alert: CloudflaredTunnelDegradedLog
                expr: sum(count_over_time({k8s_namespace_name="cloudflared"} |~ `(?i)(connection .*(lost|terminated)|failed to dial|unregistered tunnel|retrying connection)` [10m])) > 3
                for: 5m
                labels: {severity: critical, service: cloudflared, layer: networking}
                annotations:
                  summary: cloudflared is losing tunnel connections (public names degraded)
