# OpenBao — the platform's secrets manager. Standalone (one replica, PebbleDB on
# a PVC). Unseals itself with a static key held in Secret `openbao-unseal`,
# which a PreSync Job below generates in-cluster once (never in Git). Back it
# up off-cluster: losing it means losing everything stored in OpenBao.
#   kubectl -n openbao get secret openbao-unseal -o jsonpath='{.data.key}' > openbao-unseal.key.b64
# Self-init (first start only) enables Kubernetes auth, a KV v2 store at
# `secret/`, and a `bao-config` role used by later config jobs; the root token
# it uses is revoked automatically.
# If self-init ever fails, it can't be retried (the store is already
# initialised and the root token revoked): fix the config, then delete PVC
# data-local-openbao-0 and the pod to start over.

injector:
  enabled: false

ui:
  enabled: true

server:
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable     = 1        # TLS terminates at the ingress
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "pebbledb" {
        path = "/openbao/data/pebbledb"
      }
      seal "static" {
        current_key_id = "platform-1"
        current_key    = "file:///openbao/unseal/key"
      }
      initialize "platform" {
        request "kubernetes-auth" {
          operation = "update"
          path      = "sys/auth/kubernetes"
          data      = { type = "kubernetes" }
        }
        request "kubernetes-auth-config" {
          operation = "update"
          path      = "auth/kubernetes/config"
          data      = { kubernetes_host = "https://kubernetes.default.svc" }
        }
        request "kv" {
          operation = "update"
          path      = "sys/mounts/secret"
          data      = { type = "kv", options = { version = "2" } }
        }
        request "bao-config-policy" {
          operation = "update"
          path      = "sys/policy/bao-config"
          data = {
            policy = <<-EOP
              path "sys/auth/*"   { capabilities = ["create", "read", "update", "delete", "list", "sudo"] }
              path "sys/auth"     { capabilities = ["read"] }
              path "auth/*"       { capabilities = ["create", "read", "update", "delete", "list"] }
              path "sys/policies/acl/*" { capabilities = ["create", "read", "update", "delete", "list"] }
              path "sys/policy/*" { capabilities = ["create", "read", "update", "delete", "list"] }
              path "sys/mounts/*" { capabilities = ["create", "read", "update", "list"] }
              path "secret/*"     { capabilities = ["create", "read", "update", "list"] }
            EOP
          }
        }
        request "bao-config-role" {
          operation = "update"
          path      = "auth/kubernetes/role/bao-config"
          data = {
            bound_service_account_names      = "bao-config"
            bound_service_account_namespaces = "openbao"
            policies                         = "bao-config"
            ttl                              = "15m"
          }
        }
      }
  dataStorage:
    size: 1Gi
    storageClass: standard
  volumes:
    - name: unseal
      secret:
        secretName: openbao-unseal
  volumeMounts:
    - name: unseal
      mountPath: /openbao/unseal
      readOnly: true
  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: platform-ca
      cert-manager.io/usages: "digital signature,key encipherment,server auth"
    hosts:
      - host: local.openbao.internal
        paths: []
    tls:
      - secretName: openbao-tls
        hosts:
          - local.openbao.internal

extraObjects:
  # Generates the static unseal key once (32 random bytes); exits if present.
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: openbao-unseal-init
      namespace: openbao
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-2"
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: openbao-unseal-init
      namespace: openbao
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-2"
    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        resourceNames: ["openbao-unseal"]
        verbs: ["get"]
      # RBAC can't restrict `create` by name.
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["create"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: openbao-unseal-init
      namespace: openbao
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-2"
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: openbao-unseal-init
    subjects:
      - kind: ServiceAccount
        name: openbao-unseal-init
        namespace: openbao
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: openbao-unseal-init
      namespace: openbao
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: openbao-unseal-init
          restartPolicy: Never
          containers:
            - name: init
              image: docker.io/alpine/k8s:1.31.4
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  if kubectl -n openbao get secret openbao-unseal >/dev/null 2>&1; then echo "openbao-unseal exists"; exit 0; fi
                  head -c 32 /dev/urandom > /tmp/key
                  kubectl -n openbao create secret generic openbao-unseal --from-file=key=/tmp/key >/dev/null
                  rm -f /tmp/key
                  echo "openbao-unseal created"
  # Identity for later config jobs (bound to the bao-config role by self-init).
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: bao-config
      namespace: openbao
  # OpenBao configuration as code, applied after every sync via the
  # bao-config role (no root token): ESO read policy/role, and platform
  # secrets seeded with random values only if absent (re-runs never rotate).
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: bao-config
      namespace: openbao
      annotations:
        argocd.argoproj.io/hook: PostSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: bao-config
          restartPolicy: Never
          containers:
            - name: config
              image: quay.io/openbao/openbao:2.7.1
              env:
                - name: BAO_ADDR
                  value: http://local-openbao.openbao.svc.cluster.local:8200
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  BAO_TOKEN=$(bao write -field=token auth/kubernetes/login role=bao-config \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export BAO_TOKEN
                  printf '%s\n' \
                    'path "secret/data/platform/*" { capabilities = ["read"] }' \
                    'path "secret/metadata/platform/*" { capabilities = ["read", "list"] }' \
                    | bao policy write eso-read - >/dev/null
                  bao write auth/kubernetes/role/eso >/dev/null \
                    bound_service_account_names=local-external-secrets \
                    bound_service_account_namespaces=external-secrets \
                    policies=eso-read ttl=1h
                  rand() { head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c "$1"; }
                  seed() { # path, then key=value pairs; cas=0 makes the server refuse to overwrite
                    p=$1; shift
                    if bao kv put -cas=0 "$p" "$@" >/dev/null 2>&1; then echo "seeded: $p"
                    elif bao kv metadata get "$p" >/dev/null 2>&1; then echo "exists: $p"
                    else echo "failed: $p"; exit 1; fi
                  }
                  seed secret/platform/minio/root rootUser="admin-$(rand 8 | tr 'A-Z' 'a-z')" rootPassword="$(rand 40)"
                  for app in mimir loki tempo; do
                    seed "secret/platform/minio/$app" accessKeyId="$app-$(rand 12 | tr 'A-Z' 'a-z')" secretAccessKey="$(rand 40)"
                  done
