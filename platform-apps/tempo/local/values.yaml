# Tempo — trace store.
# This chart is the single-binary 'tempo' (NOT 'tempo-distributed'):
# 1 StatefulSet runs distributor + ingester + querier + compactor.
# Prod path: switch to tempo-distributed chart with same backend config.

replicas: 1

tempo:
  retention: 72h
  extraArgs:
    config.expand-env: "true"
  extraEnvFrom:
    - secretRef:
        name: tempo-s3
  multitenancyEnabled: false
  server:
    http_listen_port: 3200
    log_format: json
  metricsGenerator:
    enabled: false
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo-blocks
        endpoint: local-minio.monitoring-storage.svc.cluster.local:9000
        # From Secret tempo-s3 (tempo.extraEnvFrom), expanded by -config.expand-env.
        access_key: "${TEMPO_S3_ACCESS_KEY}"
        secret_key: "${TEMPO_S3_SECRET_KEY}"
        insecure: true
        forcepathstyle: true
        region: us-east-1
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 384Mi

persistence:
  enabled: true
  size: 2Gi
  storageClassName: standard

service:
  type: ClusterIP

serviceMonitor:
  enabled: false
