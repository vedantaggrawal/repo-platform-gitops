# Retired: the separate "break-glass" sign-in flow and the post-logout redirect
# to it. The default sign-in page now has a username field (password login, e.g.
# akadmin) and a "GitHub" button, so sign-out lands on the standard page and
# nothing auto-redirects. These entries remove the old objects. Once applied,
# this file can be deleted: drop it from kustomization.yaml and remove the
# orphaned "platform - break-glass login" blueprint instance in Authentik.
version: 1
metadata:
  name: platform - break-glass login
entries:
  - model: authentik_flows.flowstagebinding
    state: absent
    identifiers:
      order: 10
      target: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      stage: !Find [authentik_stages_redirect.redirectstage, [name, after-logout-to-sign-in]]
  - model: authentik_stages_redirect.redirectstage
    state: absent
    identifiers: { name: after-logout-to-sign-in }
  - model: authentik_flows.flow
    state: absent
    identifiers: { slug: break-glass }
  - model: authentik_stages_identification.identificationstage
    state: absent
    identifiers: { name: break-glass-identification }
