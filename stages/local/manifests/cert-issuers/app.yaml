# Argo CD settings for the cert-issuers manifests in this stage: read by argocd/appsets/manifests.yaml.
# Keys: namespace, wave; optional project, recurse, prune (false = never prune here), allowEmpty, syncOptions,
# retry, ignoreDifferences, extraSources.
namespace: cert-manager
wave: -1
recurse: true
syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true
retry:
  limit: 5
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 2m
