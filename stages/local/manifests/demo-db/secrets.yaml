# Passwords for the demo DB's two roles. Nothing secret is in Git: ESO generates
# them once, keeps them in OpenBao (platform/demo-db/roles) and delivers them as
# the basic-auth Secrets CNPG reads (cluster.yaml). Same flow as authentik-keys.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: demo-db-password
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# Generate once (one generator call per key; `password` renamed to the key)...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-db-roles-seed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: demo-db-roles-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: demo-db-password } }
      rewrite: [{ regexp: { source: password, target: owner_password } }]
    - sourceRef: { generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: demo-db-password } }
      rewrite: [{ regexp: { source: password, target: app_password } }]
---
# ...store in OpenBao only if not there yet (never overwritten, never deleted)...
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: demo-db-roles
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - { kind: ClusterSecretStore, name: openbao }
  selector:
    secret: { name: demo-db-roles-seed }
  data:
    - match: { remoteRef: { remoteKey: platform/demo-db/roles } }
---
# ...and deliver from OpenBao as basic-auth Secrets. cnpg.io/reload applies a
# password change at once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-db-owner
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: demo-db-owner
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" }
      data:
        username: demo_owner
        password: "{{ .owner_password }}"
  data:
    - secretKey: owner_password
      remoteRef: { key: platform/demo-db/roles, property: owner_password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: openbao }
  target:
    name: demo-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels: { cnpg.io/reload: "true" }
      data:
        username: demo_app
        password: "{{ .app_password }}"
  data:
    - secretKey: app_password
      remoteRef: { key: platform/demo-db/roles, property: app_password }
