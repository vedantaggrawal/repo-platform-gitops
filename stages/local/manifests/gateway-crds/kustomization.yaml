# Gateway API CRDs, standard channel. Owned here (reconciled) instead of a
# one-shot Terraform kubectl apply. Must match the version the gateway
# controller supports (Envoy Gateway v1.6 -> Gateway API 1.4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
commonAnnotations:
  # Deleting these CRDs deletes every Gateway and route in the cluster.
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
