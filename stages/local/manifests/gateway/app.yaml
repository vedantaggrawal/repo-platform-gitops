# Argo CD settings for the gateway manifests in this stage: read by argocd/appsets/manifests.yaml.
# Keys: namespace, wave; optional project, recurse, prune (false = never prune here), allowEmpty, syncOptions,
# retry, ignoreDifferences, extraSources.
namespace: envoy-gateway-system
wave: 2
syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true
  - SkipDryRunOnMissingResource=true
retry:
  limit: 5
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 2m
