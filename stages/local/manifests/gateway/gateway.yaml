# Gateway API CRD defaults (ref group/kind, PathPrefix "/" match) are written out:
# Argo CD 2.10 diffs client-side and would show the server-side defaults as drift.
# Listeners bind the node's 443/80 (hostNetwork); kind maps host 30443/30080 to them.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: platform-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    # Only the redirect below attaches here, so app routes without a
    # sectionName can't serve plain HTTP.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            # Public HTTPS port on the host (kind maps 30443 to the node's 443).
            port: 30443
            statusCode: 301
