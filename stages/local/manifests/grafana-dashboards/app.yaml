# Argo CD settings for the grafana-dashboards manifests in this stage: read by argocd/appsets/manifests.yaml.
# Keys: namespace, wave; optional project, recurse, prune (false = never prune here), allowEmpty, syncOptions,
# retry, ignoreDifferences, extraSources.
namespace: monitoring
recurse: true
allowEmpty: true
syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true
