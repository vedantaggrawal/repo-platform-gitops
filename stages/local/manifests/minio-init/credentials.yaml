# MinIO credentials (root + one user per LGTM app), generated in-cluster once
# and pushed to OpenBao secret/platform/minio/<name> only if that key is absent;
# OpenBao stays the source of truth. externalsecrets.yaml delivers them.
# Per credential: a seed ExternalSecret (CreatedOnce) and a PushSecret
# (IfNotExists, never deletes; no secretKey = whole Secret as one KV entry).
# Waves: seeds, then pushes, then the delivering ExternalSecrets (wave 0), so
# those don't read OpenBao before it is seeded.
# Rotate: write a new password to that OpenBao key; once the ExternalSecrets
# refresh (hourly), re-sync minio-init and restart MinIO or the consumer.
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: minio
  namespace: monitoring-storage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Alphanumeric: MinIO secret keys are 8-40 chars, and the minio-init Job
  # puts them in a URL.
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root-seed
  namespace: monitoring-storage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: CreatedOnce
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: minio
  target:
    name: minio-root-seed
    template:
      data:
        username: minio-root
        password: "{{ .password }}"
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: minio-root
  namespace: monitoring-storage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao
  selector:
    secret:
      name: minio-root-seed
  data:
    - match:
        remoteRef:
          remoteKey: platform/minio/root
