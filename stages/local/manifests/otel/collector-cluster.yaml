# otel-cluster — StatefulSet + Target Allocator. Replaces Alloy pipelines 1
# (ServiceMonitor/PodMonitor scrape), 2 (apiserver/kubelet/cadvisor/coredns, now
# covered by the kube-prometheus-stack SMs) and 5 (remote_write to Mimir). The TA
# discovers the SM/PM objects and shards them across the collector's prometheus
# receiver.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-cluster
  namespace: opentelemetry-operator
spec:
  mode: statefulset
  replicas: 1
  priorityClassName: platform-critical
  # The worker can fill up (demo workloads); this pipeline (traces, cluster
  # metrics, SLO inputs) must always schedule, so it may use the control-plane node.
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
  # contrib distro — needed for the prometheus receiver + prometheusremotewrite
  # exporter, which the operator-default opentelemetry-collector-k8s image omits.
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.158.0
  serviceAccount: otel-cluster
  # Disable the operator-generated NetworkPolicy: its egress rule is an ipBlock to
  # the apiserver node IP (172.18.0.2:6443), which Cilium treats as the special
  # `host` entity and an ipBlock cannot match — so the Target Allocator's
  # informers can't reach the API and hang. Network policy is managed separately.
  networkPolicy:
    enabled: false
  # Bounded so scraping cadvisor (high-cardinality) + remote_write buffering
  # can't OOM the node; memory_limiter (below) applies backpressure at 80%.
  # At 512Mi the memory_limiter soft limit (~282MiB) sat below the working heap
  # (~386MiB): it refused ~20% of points and the pod still OOMKilled. 1Gi gives a
  # ~563MiB soft limit. GOMEMLIMIT matches the limiter's hard limit (80%) instead
  # of the operator's default of 100% of the container limit.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  env:
    - name: GOMEMLIMIT
      value: 820MiB
  observability:
    metrics:
      enableMetrics: true
  targetAllocator:
    enabled: true
    serviceAccount: otel-cluster-ta
    # Empty selectors = discover every ServiceMonitor/PodMonitor in the cluster
    # (cilium, hubble, kube-state-metrics, cert-manager, the otel collectors, …).
    prometheusCR:
      enabled: true
      serviceMonitorSelector: {}
      podMonitorSelector: {}
  config:
    receivers:
      # Traces from otel-agent (tail sampling needs every span of a trace here).
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      prometheus:
        config:
          # Jobs come from ServiceMonitors/PodMonitors via the TA, except the kubelet:
          # it has no Service without prometheus-operator, so it is scraped here by
          # node discovery. Labels match the kube-prometheus-stack ServiceMonitor the
          # mixin dashboards and rules were written for (job="kubelet", metrics_path, node).
          scrape_configs:
            - job_name: kubelet
              scheme: https
              kubernetes_sd_configs: [{role: node}]
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt, insecure_skip_verify: true}
              honor_labels: true
              relabel_configs:
                - {source_labels: [__meta_kubernetes_node_name], target_label: node}
                - {source_labels: [__metrics_path__], target_label: metrics_path}
              metric_relabel_configs:
                - {source_labels: [__name__], regex: kubelet_runtime_operations_duration_seconds_bucket, action: drop}
            - job_name: kubelet-cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              kubernetes_sd_configs: [{role: node}]
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt, insecure_skip_verify: true}
              honor_labels: true
              relabel_configs:
                - {target_label: job, replacement: kubelet}
                - {source_labels: [__meta_kubernetes_node_name], target_label: node}
                - {source_labels: [__metrics_path__], target_label: metrics_path}
              metric_relabel_configs:
                - {source_labels: [__name__], regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)', action: drop}
                - {source_labels: [__name__], regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)', action: drop}
                - {source_labels: [__name__], regex: 'container_memory_(mapped_file|swap)', action: drop}
                - {source_labels: [__name__], regex: 'container_(file_descriptors|tasks_state|threads_max)', action: drop}
                - {source_labels: [__name__], regex: 'container_spec.*', action: drop}
                - {source_labels: [__name__], regex: '(container_memory_failures_total|container_blkio_device_usage_total)', action: drop}
            - job_name: kubelet-probes
              scheme: https
              metrics_path: /metrics/probes
              kubernetes_sd_configs: [{role: node}]
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt, insecure_skip_verify: true}
              honor_labels: true
              relabel_configs:
                - {target_label: job, replacement: kubelet}
                - {source_labels: [__meta_kubernetes_node_name], target_label: node}
                - {source_labels: [__metrics_path__], target_label: metrics_path}
              metric_relabel_configs:
                - {source_labels: [__name__], regex: prober_probe_duration_seconds_bucket, action: drop}
    # RED metrics and the service graph are derived from the unsampled stream
    # (traces/in), before tail_sampling, so sampling does not bias them.
    connectors:
      forward/sample: {}
      spanmetrics:
        dimensions:
          - name: x-tenant-id
          - name: x-tier
        exemplars:
          enabled: true
        histogram:
          explicit:
            buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
      servicegraph:
        latency_histogram_buckets: [10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      # Metric allowlist: keep only names a dashboard, rule or the fleet KPI set reads (83% of series fed
      # nothing on 2026-10-28). Generated: bin/metrics-contract <repo> --allowlist; the merge gate checks drift.
      # Re-enable a metric by referencing it in a dashboard/rule or listing it in harness/metrics-allowlist-extra.txt.
      # cAdvisor/KSM trims (measured 2026-10-31): every pod reports 10 interfaces (eth0 + kernel tunnel stubs
      # erspan0/gre0/sit0/…; hostNetwork pods add cilium_*/lxc*), so container_network_* was 1,318 series per
      # family for 92 pods; only eth0 carries traffic. kube_pod_status_phase emits 5 phases per pod, 4 always 0;
      # dashboards/rules only read phase=~"..." > 0 sums, so the zeros carry nothing.
      filter/trim:
        error_mode: ignore
        metrics:
          datapoint:
            # nil guard: a datapoint without an interface label is kept, never dropped by accident.
            - 'IsMatch(metric.name, "^container_network_") and attributes["interface"] != nil and attributes["interface"] != "eth0"'
            # The prometheus receiver emits double datapoints; post-merge check: count(kube_pod_status_phase == 0) must be 0.
            - 'metric.name == "kube_pod_status_phase" and value_double == 0.0'
      filter/allowlist:
        error_mode: ignore
        metrics:
          metric:
            # BEGIN generated: bin/metrics-contract --allowlist (regenerate, do not edit)
            - >-
              not (IsMatch(name, "^(:node_memory_MemAvailable_bytes:sum)$")
              or IsMatch(name, "^(OR)$")
              or IsMatch(name, "^(apiserver_admission_webhook_admission_duration_seconds|apiserver_admission_webhook_admission_duration_seconds_bucket|apiserver_current_inflight_requests|apiserver_flowcontrol_current_executing_requests|apiserver_longrunning_requests|apiserver_request|apiserver_request:availability30d|apiserver_request_sli_duration_seconds|apiserver_request_sli_duration_seconds_bucket|apiserver_request_total|apiserver_storage_objects|apiserver_watch_events|apiserver_watch_events_total)$")
              or IsMatch(name, "^(argocd_app_info|argocd_app_reconcile|argocd_app_reconcile_bucket|argocd_app_reconcile_count|argocd_app_sync|argocd_app_sync_total|argocd_appset_owned_applications|argocd_appset_reconcile|argocd_appset_reconcile_bucket|argocd_cluster_cache_age_seconds|argocd_git_request|argocd_git_request_duration_seconds|argocd_git_request_duration_seconds_bucket|argocd_git_request_total|argocd_kubectl_exec_pending|argocd_kubectl_requests|argocd_kubectl_requests_total|argocd_redis_request|argocd_redis_request_total|argocd_repo_parallelism_wait_duration_seconds|argocd_repo_parallelism_wait_duration_seconds_bucket|argocd_repo_pending_request|argocd_repo_pending_request_total)$")
              or IsMatch(name, "^(certmanager_certificate_expiration_timestamp_seconds|certmanager_certificate_ready_status)$")
              or IsMatch(name, "^(cilium_version)$")
              or IsMatch(name, "^(cluster:namespace:pod_cpu:active:kube_pod_container_resource_limits|cluster:namespace:pod_cpu:active:kube_pod_container_resource_requests|cluster:namespace:pod_memory:active:kube_pod_container_resource_limits|cluster:namespace:pod_memory:active:kube_pod_container_resource_requests|cluster:node_cpu:ratio_rate5m|cluster_quantile:apiserver_request_slo_duration_seconds:histogram_quantile)$")
              or IsMatch(name, "^(clustersecretstore_status_condition)$")
              or IsMatch(name, "^(cnpg_backends|cnpg_backends_max_tx_duration_seconds|cnpg_backends_total|cnpg_backends_waiting|cnpg_backends_waiting_total|cnpg_pg_replication_lag|cnpg_pg_settings_setting|cnpg_pg_stat_database_deadlocks|cnpg_pg_stat_database_deadlocks_total)$")
              or IsMatch(name, "^(code_resource:apiserver_request_total:rate5m)$")
              or IsMatch(name, "^(container_cpu_usage_seconds|container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_receive_bytes|container_network_receive_bytes_total|container_network_receive_packets|container_network_receive_packets_dropped|container_network_receive_packets_dropped_total|container_network_receive_packets_total|container_network_transmit_bytes|container_network_transmit_bytes_total|container_network_transmit_packets|container_network_transmit_packets_dropped|container_network_transmit_packets_dropped_total|container_network_transmit_packets_total|container_oom_events|container_oom_events_total)$")
              or IsMatch(name, "^(coredns_cache_entries|coredns_cache_hits|coredns_cache_hits_total|coredns_cache_misses|coredns_cache_misses_total|coredns_cache_size|coredns_dns_do_requests|coredns_dns_do_requests_total|coredns_dns_request_count|coredns_dns_request_count_total|coredns_dns_request_do_count|coredns_dns_request_do_count_total|coredns_dns_request_duration_seconds|coredns_dns_request_duration_seconds_bucket|coredns_dns_request_size_bytes|coredns_dns_request_size_bytes_bucket|coredns_dns_request_type_count|coredns_dns_request_type_count_total|coredns_dns_requests|coredns_dns_requests_total|coredns_dns_response_rcode_count|coredns_dns_response_rcode_count_total|coredns_dns_response_size_bytes|coredns_dns_response_size_bytes_bucket|coredns_dns_responses|coredns_dns_responses_total)$")
