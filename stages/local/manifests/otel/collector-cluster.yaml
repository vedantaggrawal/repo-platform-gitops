              or IsMatch(name, "^(hubble_dns_queries|hubble_dns_queries_total|hubble_dns_response_types|hubble_dns_response_types_total|hubble_dns_responses|hubble_dns_responses_total|hubble_drop|hubble_drop_total|hubble_flows_processed|hubble_flows_processed_total|hubble_http_request_duration_seconds|hubble_http_request_duration_seconds_bucket|hubble_http_requests|hubble_http_requests_total|hubble_http_responses|hubble_http_responses_total|hubble_icmp|hubble_icmp_total|hubble_port_distribution|hubble_port_distribution_total|hubble_tcp_flags|hubble_tcp_flags_total)$")
              or IsMatch(name, "^(instance:node_cpu_utilisation:rate5m|instance:node_load1_per_cpu:ratio|instance:node_memory_utilisation:ratio|instance:node_network_receive_bytes_excluding_lo:rate5m|instance:node_network_receive_drop_excluding_lo:rate5m|instance:node_network_transmit_bytes_excluding_lo:rate5m|instance:node_network_transmit_drop_excluding_lo:rate5m|instance:node_num_cpu:sum|instance:node_vmstat_pgmajfault:rate5m|instance_device:node_disk_io_time_seconds:rate5m|instance_device:node_disk_io_time_weighted_seconds:rate5m)$")
