# CoreDNS metrics from the kube-dns Service, keeping job="coredns" as before.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: coredns
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels: {k8s-app: kube-dns}
  endpoints:
    - port: metrics
      interval: 60s
      relabelings:
        - {targetLabel: job, replacement: coredns}
