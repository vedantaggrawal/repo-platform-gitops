apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: platform, namespace: envoy-gateway-system, sectionName: https}
  hostnames: [local.harbor.internal]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api/}}]
      backendRefs: [{group: "", kind: Service, name: local-harbor-core, port: 80, weight: 1}]
    - matches: [{path: {type: PathPrefix, value: /service/}}]
      backendRefs: [{group: "", kind: Service, name: local-harbor-core, port: 80, weight: 1}]
    - matches: [{path: {type: PathPrefix, value: /v2/}}]
      backendRefs: [{group: "", kind: Service, name: local-harbor-core, port: 80, weight: 1}]
    - matches: [{path: {type: PathPrefix, value: /c/}}]
      backendRefs: [{group: "", kind: Service, name: local-harbor-core, port: 80, weight: 1}]
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: local-harbor-portal, port: 80, weight: 1}]
