apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webserver
  namespace: devops-test-webserver
spec:
  parentRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: platform, namespace: envoy-gateway-system, sectionName: https}
  hostnames: [local.webserver.internal]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{group: "", kind: Service, name: local-devops-test-webserver-generic-app, port: 8080, weight: 1}]
