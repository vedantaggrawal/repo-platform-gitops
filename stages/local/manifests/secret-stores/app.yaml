# Argo CD settings for the secret-stores manifests in this stage: read by argocd/appsets/manifests.yaml.
# Keys: namespace, wave; optional project, recurse, prune (false = never prune here), allowEmpty, syncOptions,
# retry, ignoreDifferences, extraSources.
namespace: external-secrets
wave: 0
recurse: true
syncOptions:
  - CreateNamespace=true
retry:
  limit: 5
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 2m
