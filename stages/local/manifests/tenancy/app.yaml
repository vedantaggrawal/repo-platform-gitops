# Argo CD settings for the tenancy manifests in this stage: read by argocd/appsets/manifests.yaml.
# Keys: namespace, wave; optional project, recurse, prune (false = never prune here), allowEmpty, syncOptions,
# retry, ignoreDifferences, extraSources.
namespace: default
recurse: true
syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true
retry:
  limit: 5
  backoff:
    duration: 10s
    factor: 2
    maxDuration: 2m
ignoreDifferences:
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
    jqPathExpressions:
      - select(.aggregationRule != null) | .rules
