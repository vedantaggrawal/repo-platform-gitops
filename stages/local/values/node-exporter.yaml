# Node metrics (CPU, memory, disk, network per node) for the OTel target
# allocator; the ServiceMonitor keeps job=node-exporter so rules and dashboards
# are unchanged. Port 9101: the kube-prometheus-stack DaemonSet still holds
# 9100 on the host network until it is removed.
service:
  port: 9101
  targetPort: 9101
  labels:
    jobLabel: node-exporter

prometheus:
  monitor:
    enabled: true
    jobLabel: jobLabel
    interval: 60s

# The nfsd collector fails on every scrape on this kernel ("unknown NFSd
# metric line wdeleg_getattr"); no node serves NFS. Setting extraArgs replaces
# the chart's list, so its two filesystem excludes are repeated here.
extraArgs:
  - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
  - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
  - --no-collector.nfsd

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 64Mi}
