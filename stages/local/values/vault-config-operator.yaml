# vault-config-operator (redhat-cop): OpenBao content as Kubernetes resources: Policy, AuthEngineMount,
# KubernetesAuthEngineRole, SecretEngineMount, PKISecretEngine*, PasswordPolicy, RandomSecret, ...
# OpenBao speaks the Vault API, so the operator works unchanged. It runs in the openbao namespace next
# to the ServiceAccount `bao-config`, which OpenBao's self-init binds to the `bao-config` policy and
# Kubernetes auth role (platform-apps/openbao/local/values.yaml). Each CR names that role in its
# `authentication` block, so the operator never holds a long-lived token.
env:
  - name: VAULT_ADDR
    value: http://local-openbao.openbao.svc.cluster.local:8200
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
# Webhook certificate from cert-manager (the chart creates a self-signed Issuer in this namespace).
enableCertManager: true
# Metrics: plain HTTP for the ServiceMonitor; the target allocator scrapes it like every platform target.
enableMonitoring: true
metricsSecure: false
