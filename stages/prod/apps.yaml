# prod: every platform app of this stage, one entry per upstream Helm chart app. The platform
# ApplicationSet fans this file out: one Application per entry. The stage is the folder name.
# Promotion is a stage snapshot: Kargo copies local's apps.yaml, values files and config directories
# into the next stage verbatim; humans edit them only in local. Per-chart warehouses bump local only.
# Keys per app:
#   chart, repoURL   the upstream chart            namespace, wave   where and in which order
#   version          exact chart version (Kargo writes it; a human edits it only in the first stage)
#   enabled: false   keep the entry, deploy nothing (say why)
apps:
  kube-prometheus-stack:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    version: "51.10.0"
    namespace: monitoring
    wave: -1
    enabled: true

  metrics-server:
    chart: metrics-server
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    version: "3.11.0"
    namespace: kube-system
    wave: -2
    enabled: true
